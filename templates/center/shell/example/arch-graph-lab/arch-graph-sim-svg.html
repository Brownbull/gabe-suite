<title>Arch Graph — Change Simulation (blast radius)</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{ --bg:#f7f8fa; --panel:#ffffff; --ink:#1c2024; --muted:#6b7280;
       --line:#e3e6ea; --edge:#9aa3ad; --accent:#0d6e78;
       --touch:#1f8a53; --touch-bg:#e9f6ee; --blast:#d9821f; --blast-bg:#fbf1e0; }
@media (prefers-color-scheme:dark){ :root{ --bg:#0f1216; --panel:#171b21;
       --ink:#e6e9ee; --muted:#8a929c; --line:#262c34; --edge:#4a525c;
       --touch:#4cbe83; --touch-bg:#12271c; --blast:#e0a24a; --blast-bg:#271f12; } }

*{ box-sizing:border-box; }
body{ background:var(--bg); color:var(--ink); margin:0;
      font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      height:100vh; display:flex; flex-direction:column; overflow:hidden; }
/* top bar (header + toolbar) and bottom bar (legend) are full-width body rows;
   the CENTRE row splits into 75% diagram + 25% panel */
.center{ flex:1; min-height:0; display:flex; flex-direction:row; overflow:hidden; }
.side{ width:25%; min-width:280px; max-width:440px; border-left:1px solid var(--line);
       background:var(--panel); overflow:auto; flex:none; }
.hchange{ font-weight:400; font-size:12px; color:var(--muted); margin-left:8px; }

/* ── header ─────────────────────────────────────────────────────────── */
header{ padding:14px 20px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
header h1{ margin:0; font-size:16px; font-weight:650; letter-spacing:-.01em; }
header .sub{ margin-top:3px; font-size:12px; color:var(--muted); }
header .sub b{ color:var(--accent); font-weight:600; }
header .sub .sep{ opacity:.45; padding:0 6px; }

/* ── toolbar ────────────────────────────────────────────────────────── */
.toolbar{ display:flex; align-items:center; gap:10px; padding:9px 20px;
          border-bottom:1px solid var(--line); background:var(--panel); min-height:46px; }
.crumb{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
.crumb .dot{ width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
.crumb .lvl{ color:var(--muted); font-weight:500; }
button{ font:inherit; font-size:12.5px; color:var(--ink); background:var(--panel);
        border:1px solid var(--line); border-radius:7px; padding:5px 11px; cursor:pointer; }
button:hover{ border-color:var(--edge); }
button:disabled{ opacity:.4; cursor:default; }
button.back{ font-weight:600; }
.laywrap{ font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.laywrap select{ font:inherit; font-size:12px; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:7px; padding:4px 7px; cursor:pointer; }
.spacer{ flex:1; }
.selinfo{ font-size:12px; color:var(--muted); }
.selinfo b{ color:var(--ink); }

/* ── stage ──────────────────────────────────────────────────────────── */
/* the svg FILLS the stage; content is centred + panned by a viewport transform
   (drag the background), so it never clips and pans whether it fits or overflows. */
.stage{ flex:1; min-width:0; overflow:hidden; display:block; position:relative; }
svg#graph{ display:block; width:100%; height:100%; }

/* graph elements */
.edge{ fill:none; stroke:var(--edge); stroke-linecap:round; transition:opacity .15s; }
#arrow > path{ fill:var(--edge); }
.node{ cursor:pointer; transition:opacity .15s; }
.node .body{ transition:stroke .12s, stroke-width .12s; }
.node text{ pointer-events:none; user-select:none; }
.dim{ opacity:.13; }
.node.sel .body{ stroke:var(--accent); stroke-width:3.5; }

/* ── change-simulation overlay ─────────────────────────────────────── */
.node.faded{ opacity:.12; }
.edge.faded{ opacity:.07; }
/* touched = SOLID fill (unmistakable even where the kind colour is already green) */
.node.touched .body{ fill:var(--touch); stroke:var(--touch); stroke-width:2.5; }
.node.touched .chiplabel{ fill:#fff; }   /* chip text on green fill; circle labels sit outside, stay ink */
.node.blast   .body{ stroke:var(--blast); stroke-width:4.5; stroke-dasharray:7 4; }
.edge.blastedge{ stroke:var(--blast); }
.node .badge{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
/* before|after segmented toggle */
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button{ border:0; border-radius:0; padding:5px 13px; font-weight:600; color:var(--muted); }
.seg button + button{ border-left:1px solid var(--line); }
.seg button.on{ background:var(--accent); color:#fff; }
/* change banner */
.change{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
         padding:9px 20px; border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,var(--panel),transparent); font-size:12.5px; }
.change .tag{ font-size:10px; font-weight:800; letter-spacing:.09em; color:#fff;
              background:var(--accent); border-radius:5px; padding:2px 7px; }
.change b{ color:var(--ink); font-weight:650; }
.change .meta{ color:var(--muted); }
.change .arrow{ color:var(--blast); font-weight:700; }
.change .g{ color:var(--touch); font-weight:700; }

/* single-click: the entity EXPANDS into a container of mini-circle pieces */
.node.exploded{ opacity:0; pointer-events:none; }        /* its solid circle is replaced */
.xcontainer{ cursor:pointer; }
.xcontlabel{ font-size:12.5px; font-weight:650; text-anchor:middle; }
.xpiece text{ pointer-events:none; }
.xplabel{ font-size:9.5px; text-anchor:middle; fill:var(--ink); }
.xedge{ fill:none; stroke-linecap:round; }
.xedge.intra{ stroke:var(--edge); stroke-width:1.5; opacity:.7; }   /* piece↔piece, same entity */
.xedge.cross{ stroke:var(--blast); stroke-width:2.2; opacity:.95; } /* piece→piece, across entities */
/* a flow the CURRENT stage touched — painted the stage colour (stroke set inline) */
.xedge.hot{ opacity:1; stroke-width:2.8; }
/* expand animations */
.xedge.flow{ stroke-dasharray:6 6; animation: xflow 1.1s linear infinite; }
@keyframes xflow{ to{ stroke-dashoffset:-24; } }
.xpiece.pulse circle{ animation: xpulse 1.7s ease-in-out infinite; }
@keyframes xpulse{ 0%,100%{ stroke:var(--panel); stroke-width:2; } 50%{ stroke:var(--accent); stroke-width:3.6; } }
@media (prefers-reduced-motion: reduce){ .xedge.flow{ animation:none; } .xpiece.pulse circle{ animation:none; } }
/* per-stage node encoding rings + selection */
.xpiece circle{ cursor:pointer; }
.xpiece .ring{ fill:none; }
.xpiece.tested .ring{ stroke:#4c9aff; stroke-width:2.4; }
.xpiece.again  .ring{ stroke:var(--blast); stroke-width:2.4; }
.xpiece .ring2{ fill:none; stroke:none; }
.xpiece.selp .ring2{ stroke:var(--accent); stroke-width:2.6; }
.xbadge{ font-size:9px; font-weight:800; fill:#fff; text-anchor:middle; }
/* detail panel (persistent, right side) */
.detail{ padding:16px 18px; font-size:13px; }
.detail .close{ display:none; }
.detail .empty{ color:var(--muted); font-size:12.5px; padding-top:6px; }
.detail .phdr{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
.detail h4{ margin:0 0 2px; font-size:16px; }
.detail .kind{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:11px; }
.detail .ex{ color:#b46a12; font-weight:700; text-transform:none; letter-spacing:0; }
.detail .row{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-top:1px solid var(--line); }
.detail .row .k{ color:var(--muted); } .detail .row .v{ font-weight:600; text-align:right; }
.detail .sum{ margin-top:11px; color:var(--ink); opacity:.85; line-height:1.55; }
/* clear, low-word stage blocks */
.detail .pillrow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:2px 0 10px; }
.detail .pill{ display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.05em;
  text-transform:uppercase; color:#fff; padding:3px 9px; border-radius:999px; }
.detail .file{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--muted); }
.detail .case{ font-size:11px; font-weight:700; color:#4c9aff; border:1px solid #4c9aff55; border-radius:5px; padding:1px 6px; }
.detail .bar{ display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--line); margin:4px 0 3px; }
.detail .bar i{ display:block; height:100%; }
.detail .delta{ font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:4px; }
.detail .b{ margin:11px 0; }
.detail .b .l{ font-size:10px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.detail .b .t{ font-size:13.5px; color:var(--ink); margin-top:2px; line-height:1.4; }
.detail .headline{ padding:8px 11px; border-radius:0 6px 6px 0; margin-top:3px;
  font-size:13px; color:var(--ink); line-height:1.5; }
.detail .muted{ color:var(--muted); }
.detail .headline .delta{ margin-top:5px; }
.stage{ cursor:grab; }
.stage:active{ cursor:grabbing; }
.detail .stageline{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.detail .dot{ display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
.detail .dot i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
/* ── typed identifier chips — the command center's code-section visual language ──
   icon + name per kind (function · endpoint · model · schema · data type),
   soft-bg + colored-fg exactly like the center's .tag.ic; data-type tokens wear
   the center's ty-* type-family colors. */
.detail .idsec{ margin:12px 0 4px; }
/* one column: the kind TITLE on its own row, its chips full-width beneath —
   so a chip never has to share the row with its label and can breathe. */
.detail .idrow{ display:block; padding:8px 0 6px; border-top:1px solid var(--line); }
.detail .idrow:first-child{ border-top:0; }
.detail .idlbl{ font-size:10px; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.detail .idchips{ display:flex; flex-wrap:wrap; gap:5px; }
.idchip{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:11px;
  font-size:11.5px; line-height:1.55; max-width:100%; }
.idchip svg{ flex:none; }
.idchip b{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.idchip .mth{ font-weight:800; font-size:10px; letter-spacing:.03em; }
.idchip.dt{ background:var(--line); color:var(--muted); }
.idchip.dt b{ color:var(--ink); font-weight:600; }
.idchip.dt .ty{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px; }
.idchip.st{ background:var(--line); color:var(--muted); font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:10.5px; padding:2px 8px; }
/* type-family colors — byte-identical to the center's arch-data-model page */
.ty-num1{color:#7089c4} .ty-num2{color:#1d4ed8}
.ty-tim1{color:#c08a4a} .ty-tim2{color:#9a4b06}
.ty-str1{color:#4f9a86} .ty-str2{color:#0b6a55}
.ty-bool{color:#b83280} .ty-json{color:#7c6bb8} .ty-id{color:#78849a}
@media (prefers-color-scheme:dark){
  .ty-num1{color:#9db4ee} .ty-num2{color:#6c8cff}
  .ty-tim1{color:#e3b579} .ty-tim2{color:#f0913c}
  .ty-str1{color:#84c9b6} .ty-str2{color:#3fd6ac}
  .ty-bool{color:#f472b6} .ty-json{color:#b4a8f0} .ty-id{color:#8391a5}
}
/* per-stage highlight colours on the stage buttons */
#stageSeg button[data-stage="red"].on{ background:#e5484d; }
#stageSeg button[data-stage="execute"].on{ background:#4c9aff; }
#stageSeg button[data-stage="review"].on{ background:#30a46c; }
#stageSeg button[data-stage="commit"].on{ background:#8e4ec6; }
/* L2 connector focus — click a node to light exactly what it connects to */
.stage.l2view .edge{ opacity:.42; }               /* calmer default, not spaghetti */
.stage.l2view .edge.hi{ opacity:1; stroke:var(--accent); stroke-width:2.8; }
.stage.l2view .edge.faded{ opacity:.05; }
.stage.l2view .node.faded{ opacity:.14; }
.colhdr{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em;
         text-transform:uppercase; }
.l1label{ font-size:13px; font-weight:650; text-anchor:middle; }
.l1sub{ font-size:10.5px; text-anchor:middle; fill:var(--muted); }
.chiplabel{ font-size:11px; font-weight:500; }
.hint{ position:absolute; bottom:10px; right:16px; font-size:11px; color:var(--muted);
       background:var(--panel); border:1px solid var(--line); border-radius:6px;
       padding:3px 8px; pointer-events:none; opacity:.9; }
/* per-stage NODE-ENCODING key — what a filled/hollow/ringed/glowing circle means
   for the CURRENT stage; rebuilt on every stage switch (buildStageLegend). */
#stagelegend{ position:absolute; bottom:12px; left:14px; font-size:11px; color:var(--muted);
  background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 11px 8px;
  box-shadow:0 6px 20px rgba(0,0,0,.10); max-width:250px; pointer-events:none; }
#stagelegend .lh{ font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  margin-bottom:7px; display:flex; align-items:center; gap:6px; color:var(--ink); }
#stagelegend .lh i{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
#stagelegend .li{ display:flex; align-items:center; gap:8px; padding:2px 0; line-height:1.32; }
#stagelegend .li svg{ flex:none; }
#stagelegend .li b{ color:var(--ink); font-weight:600; }
@keyframes lgpulse{ 0%,100%{ opacity:.22; } 50%{ opacity:1; } }
#stagelegend .lgpulse{ animation: lgpulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ #stagelegend .lgpulse{ animation:none; opacity:.7; } }

/* ── tooltip ────────────────────────────────────────────────────────── */
#tip{ position:fixed; z-index:50; pointer-events:none; max-width:260px; opacity:0;
      transform:translateY(2px); transition:opacity .1s; background:var(--panel);
      border:1px solid var(--line); border-radius:9px; padding:9px 11px;
      box-shadow:0 8px 26px rgba(0,0,0,.16); font-size:12px; }
#tip.on{ opacity:1; transform:none; }
#tip .ttl{ font-weight:650; font-size:12.5px; margin-bottom:2px; display:flex;
           align-items:center; gap:7px; }
#tip .ttl .sw{ width:10px; height:10px; border-radius:3px; flex:none; }
#tip .kind{ font-size:10.5px; color:var(--muted); text-transform:uppercase;
            letter-spacing:.05em; margin-bottom:5px; }
#tip .grid{ display:grid; grid-template-columns:auto auto; gap:1px 14px; margin-top:4px; }
#tip .grid .k{ color:var(--muted); }
#tip .grid .v{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
#tip .meta{ color:var(--muted); font-size:11px; margin-top:3px; }

/* ── legend ─────────────────────────────────────────────────────────── */
.legend{ display:flex; align-items:center; gap:16px; flex-wrap:wrap;
         padding:8px 20px; border-top:1px solid var(--line); background:var(--panel);
         font-size:11.5px; color:var(--muted); }
.legend .grp{ display:flex; align-items:center; gap:14px; }
.legend .item{ display:flex; align-items:center; gap:6px; }
.legend .sw{ width:12px; height:12px; border-radius:4px; flex:none; }
.legend .swr{ width:16px; height:0; border-top:2px solid var(--edge); position:relative; }
.legend .swr::after{ content:""; position:absolute; right:-2px; top:-3px; border:3px solid transparent;
                     border-left-color:var(--edge); }
.legend .div{ width:1px; height:14px; background:var(--line); }
.legend .count{ margin-left:auto; color:var(--ink); font-weight:600; }
</style>

<header>
  <h1>Change Simulation <span class="hchange" id="hchange"></span></h1>
</header>

<div class="toolbar">
  <button id="openAll">Open all</button>
  <button class="back" id="backBtn" disabled hidden>&larr; Back</button>
  <span class="dot" id="crumbDot" hidden></span><span id="crumbTxt" hidden></span><span id="crumbLvl" hidden></span>
  <div class="selinfo" id="selInfo"></div>
  <div class="spacer"></div>
  <label class="laywrap"><span id="layLbl">layout</span>
    <select id="layoutSel"></select>
  </label>
  <label class="laywrap" id="insideWrap">inside
    <select id="insideSel"></select>
  </label>
  <div class="seg" id="stageSeg">
    <button data-stage="red">Red</button>
    <button data-stage="execute" class="on">Execute</button>
    <button data-stage="review">Review</button>
    <button data-stage="commit">Commit</button>
  </div>
  <button id="resetBtn">Reset layout</button>
</div>

<div class="center">
<div class="stage" id="stage">
  <svg id="graph" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
              markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0.5,0.5 L9.5,5 L0.5,9.5 z"></path>
      </marker>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#e5484d"></path></marker>
      <marker id="arrow-execute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#4c9aff"></path></marker>
      <marker id="arrow-review" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#30a46c"></path></marker>
      <marker id="arrow-commit" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#8e4ec6"></path></marker>
    </defs>
    <g id="viewport"></g>
  </svg>
  <div class="hint" id="hint">click an entity to open · click a piece for details · drag to move</div>
  <div id="stagelegend"></div>
</div>
<aside class="side" id="side">
  <div id="detail" class="detail"><div class="empty">Click an entity or a piece for details.</div></div>
</aside>
</div><!-- /.center -->

<div class="legend" id="legend"></div>

<div id="tip"></div>

<script src="./c4-graph.data.js"></script>
<script src="./sim.data.js"></script>
<script>
(function(){
  "use strict";
  var DATA = window.GABE_C4, COLORS = window.GABE_C4_COLORS || {};
  var NS = "http://www.w3.org/2000/svg";

  // ── change simulation state ─────────────────────────────────────────
  var SIM = window.GABE_SIM || null;
  var TOUCH = {}, BLAST = {}, INVOLVED = {};
  if(SIM){
    SIM.touched.forEach(function(s){ TOUCH[s]=1; INVOLVED[s]=1; });
    SIM.blast.forEach(function(s){ BLAST[s]=1; INVOLVED[s]=1; });
  }
  var curStage = "execute";  // lifecycle lens: red | execute | review | commit
  var selPiece = null;       // "slug|pieceId" currently detailed
  var PIECE_R = 11;          // base mini-circle radius (encodings scale from it)
  var expanded = {};         // L1: SET of entities currently exploded into their pieces
  var l2focus = null;        // L2: the node whose connectors are isolated
  var lastBounds = null;     // L1 frame bounds, so an expansion can grow the canvas
  var l1layout = "ring";       // entity arrangement: ring | flow | force
  var l2layout = "columns";    // L2 arrangement: columns | force | radial
  var insideLayout = "force";  // pieces INSIDE an expanded entity: ring | grid | force
  var STAGE_COLOR = { red:"#e5484d", execute:"#4c9aff", review:"#30a46c", commit:"#8e4ec6" };
  var L1_LAYOUTS = { ring:"Ring", flow:"Flow (deps)", force:"Force" };
  var L2_LAYOUTS = { columns:"Columns", force:"Force", radial:"Radial" };
  var INSIDE_LAYOUTS = { ring:"Ring", grid:"Grid", force:"Force" };
  var KIND_COLOR = { endpoint:"#4c6ef5", model:"#12b886", schema:"#f59f00", external:"#868e96" };
  var KIND_LABEL = { endpoint:"Endpoints", model:"Models", schema:"Schemas", external:"External" };

  // ── state ───────────────────────────────────────────────────────────
  var view = "l1", drilledSlug = null, selected = null;
  var nodePos = {};        // id -> {x,y}   (L1: circle centre · L2: chip top-left)
  var nodeMeta = {};       // id -> {kind, r?, el, node}
  var edgeRecs = [];       // {el, s, t}
  var CHIP_W = 214, CHIP_H = 38, MARGIN = 70;

  var stage   = document.getElementById("stage");
  var svg     = document.getElementById("graph");
  var vp      = document.getElementById("viewport");
  var tip     = document.getElementById("tip");
  var backBtn = document.getElementById("backBtn");
  var resetBtn= document.getElementById("resetBtn");
  var legend  = document.getElementById("legend");

  // ── tiny DOM helpers ────────────────────────────────────────────────
  function E(tag, attrs){
    var e = document.createElementNS(NS, tag);
    if(attrs) for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function trunc(s,n){ s=String(s); return s.length>n ? s.slice(0,n-1)+"…" : s; }

  // ── scales ──────────────────────────────────────────────────────────
  var L1 = DATA.l1.nodes, L1E = DATA.l1.edges;
  var linesArr = L1.map(function(n){ return n.counts?n.counts.lines:0; });
  var minSq = Math.sqrt(Math.min.apply(null, linesArr)),
      maxSq = Math.sqrt(Math.max.apply(null, linesArr));
  function radius(n){
    var t = maxSq>minSq ? (Math.sqrt(n.counts.lines)-minSq)/(maxSq-minSq) : .5;
    return 22 + t*38;                      // 22 .. 60
  }
  function ewidth(w){ return 1.5 + (clamp(w,1,10)-1)/9*4.6; }   // 1.5 .. 6.1

  // ── build viewport at natural pixel scale, offset so all coords ≥ margin
  var panX=0, panY=0, fitTx=0, fitTy=0;
  function frame(b){
    var cw=stage.clientWidth||900, ch=stage.clientHeight||600;
    svg.setAttribute("width", cw); svg.setAttribute("height", ch);
    fitTx = Math.round((cw-(b.maxX-b.minX))/2 - b.minX);   // centre content in the viewport
    fitTy = Math.round((ch-(b.maxY-b.minY))/2 - b.minY);
    applyPan();
  }
  function applyPan(){ vp.setAttribute("transform","translate("+(fitTx+panX)+","+(fitTy+panY)+")"); }

  // ══════════════════════════════════════════════════════════════════
  //  layout engines — Ring (stamped) · Flow (Flare dependency gradient) · Force
  // ══════════════════════════════════════════════════════════════════
  function flowLayout(nodes, edges){
    // Flare's flowLayout, ported: longest-path depth over the FK DAG puts
    // foundations (imported by many, import nothing) LEFT, entry points RIGHT.
    var ids = nodes.map(function(n){ return n.id; }), has={}; ids.forEach(function(i){ has[i]=1; });
    var out={}; ids.forEach(function(i){ out[i]=[]; });
    edges.forEach(function(e){ if(has[e.source]&&has[e.target]&&e.source!==e.target) out[e.source].push(e.target); });
    var depth={}, onstack={};
    function dep(u){ if(depth[u]!=null) return depth[u]; if(onstack[u]) return 0; onstack[u]=1;
      var d=0; out[u].forEach(function(v){ d=Math.max(d, 1+dep(v)); }); onstack[u]=0; return (depth[u]=d); }
    ids.forEach(dep);
    var cols={}; ids.forEach(function(i){ (cols[depth[i]]=cols[depth[i]]||[]).push(i); });
    var COLW=210, ROWH=118, pos={};
    Object.keys(cols).forEach(function(dk){
      var col=cols[dk].sort(), d=Number(dk);
      col.forEach(function(id,i){ pos[id]={ x:d*COLW, y:(i-(col.length-1)/2)*ROWH }; });
    });
    return pos;
  }
  function forceLayout(nodes, edges, opt){
    opt=opt||{}; var R=opt.R||200, ITER=opt.iter||240, K=opt.k||9000, REST=opt.rest||150;
    var pos={}, vel={}, n=nodes.length, has={};
    nodes.forEach(function(nd,i){ var a=2*Math.PI*i/n; pos[nd.id]={x:R*Math.cos(a),y:R*Math.sin(a)}; vel[nd.id]={x:0,y:0}; has[nd.id]=1; });
    var E2=edges.filter(function(e){ return has[e.source]&&has[e.target]&&e.source!==e.target; });
    for(var it=0; it<ITER; it++){
      for(var i=0;i<n;i++) for(var j=i+1;j<n;j++){
        var a=nodes[i].id,b=nodes[j].id, dx=pos[a].x-pos[b].x, dy=pos[a].y-pos[b].y, d2=dx*dx+dy*dy+60, d=Math.sqrt(d2);
        var f=K/d2, ux=dx/d, uy=dy/d; vel[a].x+=ux*f; vel[a].y+=uy*f; vel[b].x-=ux*f; vel[b].y-=uy*f;
      }
      E2.forEach(function(e){ var a=e.source,b=e.target, dx=pos[b].x-pos[a].x, dy=pos[b].y-pos[a].y,
        d=Math.sqrt(dx*dx+dy*dy)||1, f=0.02*(d-REST), ux=dx/d, uy=dy/d;
        vel[a].x+=ux*f; vel[a].y+=uy*f; vel[b].x-=ux*f; vel[b].y-=uy*f; });
      nodes.forEach(function(nd){ var id=nd.id; vel[id].x=(vel[id].x - pos[id].x*0.003)*0.9; vel[id].y=(vel[id].y - pos[id].y*0.003)*0.9;
        pos[id].x+=vel[id].x; pos[id].y+=vel[id].y; });
    }
    var p2={}; Object.keys(pos).forEach(function(k){ p2[k]={x:Math.round(pos[k].x*100)/100,y:Math.round(pos[k].y*100)/100}; });
    return p2;
  }
  function computeL1Positions(){
    if(l1layout==="flow")  return flowLayout(L1, L1E);
    if(l1layout==="force") return forceLayout(L1, L1E, {R:210, rest:170});
    var p={}; L1.forEach(function(n){ p[n.id]={x:n.x,y:n.y}; }); return p;   // ring (stamped)
  }
  function computeInsidePositions(slug, pieces, cx, cy){
    // how the mini-circles distribute INSIDE an expanded entity
    var n=pieces.length||1, pos={};
    if(insideLayout==="grid"){
      var cols=Math.ceil(Math.sqrt(n)), GX=58, GY=54;
      pieces.forEach(function(p,i){ var r=Math.floor(i/cols), c=i%cols, rows=Math.ceil(n/cols);
        pos[p.id]={ x:cx+(c-(cols-1)/2)*GX, y:cy+(r-(rows-1)/2)*GY }; });
    } else if(insideLayout==="force"){
      var nodes=pieces.map(function(p){ return {id:p.id}; });
      var edges=(SIM.intra_edges&&SIM.intra_edges[slug])||[];
      var fp=forceLayout(nodes, edges, { R:Math.max(42,n*9), iter:170, k:2600, rest:58 });
      pieces.forEach(function(p){ pos[p.id]={ x:cx+fp[p.id].x, y:cy+fp[p.id].y }; });
    } else {                                       // ring (default)
      var ringR=Math.max(48, n*11);
      pieces.forEach(function(p,i){ var a=-Math.PI/2+2*Math.PI*i/n;
        pos[p.id]={ x:cx+ringR*Math.cos(a), y:cy+ringR*Math.sin(a) }; });
    }
    return pos;
  }
  function computeL2Positions(g2){
    if(l2layout==="force") return forceLayout(g2.nodes, g2.edges, {R:270, iter:260, k:5200, rest:118});
    if(l2layout==="radial"){
      var ord=["endpoint","schema","model","external"];
      var sorted=g2.nodes.slice().sort(function(a,b){ return (ord.indexOf(a.kind)-ord.indexOf(b.kind)) || (a.id<b.id?-1:1); });
      var R=Math.max(220, sorted.length*13), pos={};
      sorted.forEach(function(n,i){ var a=-Math.PI/2+2*Math.PI*i/sorted.length; pos[n.id]={x:R*Math.cos(a),y:R*Math.sin(a)}; });
      return pos;
    }
    // columns (flow order) — top-left anchored chip coords
    var ord2=["endpoint","schema","model","external"], COLW=(DATA.layout.l2&&DATA.layout.l2.col_w)||240, kc={};
    ord2.forEach(function(k,i){ kc[k]=i; });
    var p={}; g2.nodes.forEach(function(n){ p[n.id]={x:kc[n.kind]*COLW, y:n.y}; }); return p;
  }

  // ══════════════════════════════════════════════════════════════════
  //  L1 render — entities positioned by the active layout, fk edges
  // ══════════════════════════════════════════════════════════════════
  function renderL1(){
    view = "l1"; drilledSlug = null;
    vp.textContent = ""; nodePos = {}; nodeMeta = {}; edgeRecs = [];

    var POS = computeL1Positions();
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    L1.forEach(function(n){
      var r = radius(n), pad = r + 40, p = POS[n.id] || {x:n.x,y:n.y};
      nodePos[n.id] = { x:p.x, y:p.y };
      nodeMeta[n.id] = { kind:"entity", r:r, node:n };
      minX=Math.min(minX,p.x-pad); maxX=Math.max(maxX,p.x+pad);
      minY=Math.min(minY,p.y-r-6); maxY=Math.max(maxY,p.y+r+30);
    });
    lastBounds = {minX:minX,minY:minY,maxX:maxX,maxY:maxY};
    frame(lastBounds);

    // edges first (under nodes)
    var eLayer = E("g"); vp.appendChild(eLayer);
    L1E.forEach(function(ed){
      var p = E("path", { class:"edge", "marker-end":"url(#arrow)" });
      p.style.strokeWidth = ewidth(ed.weight);
      eLayer.appendChild(p);
      var rec = { el:p, s:ed.source, t:ed.target, kind:"l1", weight:ed.weight, data:ed };
      edgeRecs.push(rec); updateEdge(rec);
    });

    // nodes
    var nLayer = E("g"); vp.appendChild(nLayer);
    L1.forEach(function(n){
      var col = COLORS[n.slug] || (n.kind==="unclaimed" ? COLORS.__unclaimed__ : "#888");
      var g = E("g", { class:"node entnode", "data-id":n.id });
      var r = nodeMeta[n.id].r;
      var c = E("circle", { class:"body", r:r, cx:0, cy:0, fill:col,
                            stroke:"var(--panel)", "stroke-width":2 });
      if(n.kind==="unclaimed"){ c.setAttribute("fill","var(--panel)");
        c.setAttribute("stroke", COLORS.__unclaimed__); c.setAttribute("stroke-dasharray","5 4"); }
      var t1 = E("text", { class:"l1label", x:0, y:r+16 }); t1.textContent = n.label;
      t1.setAttribute("fill","var(--ink)");
      var t2 = E("text", { class:"l1sub", x:0, y:r+30 });
      t2.textContent = n.counts.endpoints+" ep · "+n.counts.lines.toLocaleString()+" ln";
      g.appendChild(c); g.appendChild(t1); g.appendChild(t2);
      nLayer.appendChild(g);
      nodeMeta[n.id].el = g;
      wire(g, n);
    });

    afterRender("All entities", DATA.stats.entities + " entities", "var(--muted)");
    applySim();
    if(Object.keys(expanded).length) drawExpansions();
  }

  // ══════════════════════════════════════════════════════════════════
  //  L2 render — columns endpoint · model · schema · external
  // ══════════════════════════════════════════════════════════════════
  function renderL2(slug){
    view = "l2"; drilledSlug = slug; selected = null; l2focus = null;
    vp.textContent = ""; nodePos = {}; nodeMeta = {}; edgeRecs = [];
    var g2 = DATA.l2[slug];
    if(!g2){ afterRender(slug, "no L2 data", COLORS[slug]||"var(--muted)"); return; }

    var POS = computeL2Positions(g2);
    var asChips = (l2layout==="columns"), PR2 = 12;
    var present = {};
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    g2.nodes.forEach(function(n){
      var p=POS[n.id];
      nodePos[n.id] = { x:p.x, y:p.y };
      nodeMeta[n.id] = { kind:n.kind, node:n, shape: asChips?"chip":"circle", r:PR2 };
      present[n.kind] = (present[n.kind]||0) + 1;
      if(asChips){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x+CHIP_W); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y+CHIP_H); }
      else { minX=Math.min(minX,p.x-PR2-46); maxX=Math.max(maxX,p.x+PR2+46); minY=Math.min(minY,p.y-PR2-6); maxY=Math.max(maxY,p.y+PR2+18); }
    });
    if(asChips) minY -= 34;                        // room for column headers
    frame({minX:minX,minY:minY,maxX:maxX,maxY:maxY});

    // column headers (columns layout only)
    if(asChips){
      var ord3=["endpoint","schema","model","external"], COLW3=(DATA.layout.l2&&DATA.layout.l2.col_w)||240;
      var hLayer = E("g");
      ord3.forEach(function(kind, i){
        if(!present[kind]) return;
        var h = E("text", { class:"colhdr", x:i*COLW3+2, y:minY+18 });
        h.textContent = KIND_LABEL[kind] + "  " + present[kind];
        hLayer.appendChild(h);
      });
      vp.appendChild(hLayer);
    }

    // edges
    var eLayer = E("g"); vp.appendChild(eLayer);
    g2.edges.forEach(function(ed){
      if(!nodePos[ed.source] || !nodePos[ed.target]) return;
      var p = E("path", { class:"edge", "marker-end":"url(#arrow)" });
      p.style.strokeWidth = ed.kind==="fk" ? 1.9 : 1.3;
      if(ed.kind==="fk") p.style.strokeDasharray = "5 4";
      eLayer.appendChild(p);
      var rec = { el:p, s:ed.source, t:ed.target, kind:"l2", ekind:ed.kind, data:ed };
      edgeRecs.push(rec); updateEdge(rec);
    });

    // nodes — chips in columns, circles in force/radial (so connections read)
    var nLayer = E("g"); vp.appendChild(nLayer);
    g2.nodes.forEach(function(n){
      var col = KIND_COLOR[n.kind] || "#888";
      var label = n.label || String(n.id).replace(/^[^:]+:/,"");
      var g = E("g", { class:"node", "data-id":n.id,
                       transform:"translate("+nodePos[n.id].x+","+nodePos[n.id].y+")" });
      if(asChips){
        var rect = E("rect", { class:"body", x:0, y:0, width:CHIP_W, height:CHIP_H, rx:8,
                               fill:"var(--panel)", stroke:col, "stroke-width":1.6 });
        var bar  = E("rect", { x:0, y:0, width:5, height:CHIP_H, rx:2.5, fill:col });
        if(n.kind==="external"){ rect.setAttribute("stroke-dasharray","5 4"); }
        var t = E("text", { class:"chiplabel", x:14, y:CHIP_H/2+4 }); t.setAttribute("fill","var(--ink)");
        t.textContent = trunc(label, n.kind==="endpoint"?30:26);
        g.appendChild(rect); g.appendChild(bar); g.appendChild(t);
      } else {
        var c2 = E("circle", { class:"body", r:PR2, cx:0, cy:0, fill:"var(--panel)", stroke:col, "stroke-width":2.6 });
        if(n.kind==="external"){ c2.setAttribute("stroke-dasharray","4 3"); }
        var t2 = E("text", { class:"xplabel", x:0, y:PR2+11 }); t2.setAttribute("fill","var(--ink)");
        t2.textContent = trunc(label, 16);
        g.appendChild(c2); g.appendChild(t2);
      }
      nLayer.appendChild(g);
      nodeMeta[n.id].el = g;
      wire(g, n);
    });

    var ent = L1.filter(function(n){ return n.slug===slug; })[0];
    afterRender((ent?ent.label:slug), g2.nodes.length + " nodes · " + g2.edges.length + " edges",
                COLORS[slug]||"var(--muted)");
    applySim();
  }

  // ── shared post-render bookkeeping ──────────────────────────────────
  function afterRender(title, sub, dotColor){
    document.getElementById("crumbTxt").textContent = title;
    document.getElementById("crumbLvl").textContent =
        view==="l1" ? "· L1 · fk graph" : "· L2 · touches + fk";

    document.getElementById("selInfo").innerHTML = sub ? "<span>"+sub+"</span>" : "";
    backBtn.disabled = (view==="l1");

  }
  function fillSel(sel, opts, cur){
    sel.innerHTML="";

      var o=document.createElement("option"); o.value=k; o.textContent=opts[k];
      if(k===cur) o.selected=true; sel.appendChild(o);

  function syncLayoutSel(){
    document.getElementById("layLbl").textContent = (view==="l1") ? "entities" : "layout";
    fillSel(document.getElementById("layoutSel"), view==="l1"?L1_LAYOUTS:L2_LAYOUTS, view==="l1"?l1layout:l2layout);
    var iw=document.getElementById("insideWrap");

  // ── geometry: (re)compute an edge path from live node positions ─────
  function updateEdge(rec){
    var s = nodePos[rec.s], t = nodePos[rec.t];
    if(!s || !t){ rec.el.setAttribute("d",""); return; }
    if(rec.kind==="l1"){
      var r1 = nodeMeta[rec.s].r, r2 = nodeMeta[rec.t].r;
      var dx=t.x-s.x, dy=t.y-s.y, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
      var sx=s.x+ux*r1, sy=s.y+uy*r1, ex=t.x-ux*(r2+3.5), ey=t.y-uy*(r2+3.5);
      var mx=(sx+ex)/2, my=(sy+ey)/2, bow=Math.min(38, d*0.12);
      var cx=mx + (-uy)*bow, cy=my + (ux)*bow;
      rec.el.setAttribute("d","M"+sx+" "+sy+" Q "+cx+" "+cy+" "+ex+" "+ey);
    } else if(nodeMeta[rec.s].shape==="circle" || nodeMeta[rec.t].shape==="circle"){
      // circle L2 (force/radial): centre-to-centre, trimmed by radius, slight bow
      var r1=nodeMeta[rec.s].r||12, r2=nodeMeta[rec.t].r||12;
      var dx=t.x-s.x, dy=t.y-s.y, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
      var sx=s.x+ux*r1, sy=s.y+uy*r1, ex=t.x-ux*(r2+3), ey=t.y-uy*(r2+3);
      var mx=(sx+ex)/2, my=(sy+ey)/2, bow=Math.min(26,d*0.09);
      rec.el.setAttribute("d","M"+sx+" "+sy+" Q "+(mx-uy*bow)+" "+(my+ux*bow)+" "+ex+" "+ey);
    } else {
      var sc={ l:s.x, r:s.x+CHIP_W, cx:s.x+CHIP_W/2, cy:s.y+CHIP_H/2 };
      var tc={ l:t.x, r:t.x+CHIP_W, cx:t.x+CHIP_W/2, cy:t.y+CHIP_H/2 };
      var x1,x2,y1=sc.cy,y2=tc.cy, fwd = tc.cx>=sc.cx;
      if(fwd){ x1=sc.r; x2=tc.l; } else { x1=sc.l; x2=tc.r; }
      var h=Math.max(28, Math.abs(x2-x1)*0.5)*(fwd?1:-1);
      rec.el.setAttribute("d","M"+x1+" "+y1+" C "+(x1+h)+" "+y1+" "+(x2-h)+" "+y2+" "+x2+" "+y2);
    }
  }
  function refreshEdgesFor(id){
    for(var i=0;i<edgeRecs.length;i++){
      var r=edgeRecs[i]; if(r.s===id||r.t===id) updateEdge(r);
    }
  }

  // ── interaction wiring on a node group ──────────────────────────────
  var pendingTap = null, dragging = null;
  function wire(g, node){
    g.addEventListener("pointerenter", function(){ if(!dragging) showTip(node); });
    g.addEventListener("pointermove",  function(e){ if(!dragging) moveTip(e); });
    g.addEventListener("pointerleave", function(){ hideTip(); });

    g.addEventListener("pointerdown", function(e){
      e.preventDefault();
      var start = { x:e.clientX, y:e.clientY }, moved=false;
      var origin = { x:nodePos[node.id].x, y:nodePos[node.id].y };
      hideTip();
      function onMove(ev){
        var dx=ev.clientX-start.x, dy=ev.clientY-start.y;
        if(!moved && Math.abs(dx)+Math.abs(dy) < 4) return;
        moved = true; dragging = node.id;
        nodePos[node.id] = { x:origin.x+dx, y:origin.y+dy };
        if(view==="l1") g.setAttribute("transform","translate("+nodePos[node.id].x+","+nodePos[node.id].y+")");
        else            g.setAttribute("transform","translate("+nodePos[node.id].x+","+nodePos[node.id].y+")");
        refreshEdgesFor(node.id);
      }
      function onUp(){
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        setTimeout(function(){ dragging=null; }, 0);
        if(!moved) tap(node);
      }
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    });

    // position L1 group (L2 groups already carry their transform)
    if(view==="l1") g.setAttribute("transform","translate("+nodePos[node.id].x+","+nodePos[node.id].y+")");
  }

  // single-click vs double-click discrimination
  function tap(node){
    if(pendingTap && pendingTap.id===node.id){
      clearTimeout(pendingTap.t); pendingTap=null; onDouble(node);
    } else {
      if(pendingTap) clearTimeout(pendingTap.t);
      var t=setTimeout(function(){ pendingTap=null; onSingle(node); }, 230);
      pendingTap = { id:node.id, t:t };
    }
  }
  function onSingle(node){
    // single-click SELECTS the entity (shows its summary) — never changes open/closed
    if(view==="l1"){ if(INVOLVED[node.id]) openEntityDetail(node.slug); }
    else { focusL2(node.id); }
  }
  function onDouble(node){
    // double-click TOGGLES the entity open ↔ closed
    if(view==="l1" && INVOLVED[node.id]){
      if(expanded[node.slug]) delete expanded[node.slug]; else expanded[node.slug]=true;
      renderL1(); openEntityDetail(node.slug);
    }
  }

  // ── selection / highlight ───────────────────────────────────────────
  function neighboursL1(id){
    var keep = {}; keep[id]=1;
    L1E.forEach(function(e){ if(e.source===id) keep[e.target]=1; if(e.target===id) keep[e.source]=1; });
    return keep;
  }
  // In the simulation page the CHANGE OVERLAY is the highlight, not free
  // selection — a click just re-asserts the overlay (double-click still drills).
  function applySelection(){ selected=null; applySim(); }
  function applyL2Highlight(){ selected=null; applySim(); }

  // ── single-click (after phase): open an entity IN PLACE to the pieces this
  //    change touched (touched entity → its changed models; downstream entity →
  //    the models that reference the change). Click again to close. ──────────
  function toggleExpand(slug){
    if(expanded[slug]) delete expanded[slug]; else expanded[slug]=true;
    renderL1();
  }
  // Each clicked entity's circle EXPANDS into a container holding its touched
  // pieces as mini-circles; edges show the relationships BETWEEN those pieces
  // (intra) and the piece→piece links to OTHER expanded entities (cross).
  function drawExpansions(){
    var slugs = Object.keys(expanded);
    var PR = PIECE_R;                             // piece-circle radius
    var innerPos = {};                            // "slug\tpieceId" -> {x,y}
    // hide the exploded entities' solid circles; fade the uninvolved
    vp.querySelectorAll(".node").forEach(function(n){
      var id=n.getAttribute("data-id");
      if(expanded[id]) n.classList.add("exploded");
      else if(!INVOLVED[id]) n.classList.add("faded");
    });
    edgeRecs.forEach(function(r){ r.el.classList.add("faded"); });
    var reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
    var layer=E("g",{id:"expansion"}); vp.appendChild(layer);
    var b={minX:lastBounds.minX,minY:lastBounds.minY,maxX:lastBounds.maxX,maxY:lastBounds.maxY};
    var connector={};                              // endpoints of cross edges → pulse
    ((SIM.cross_edges)||[]).forEach(function(e){ connector[e.from_slug+"\t"+e.from]=1; connector[e.to_slug+"\t"+e.to]=1; });
    // pieces the CURRENT stage highlights (tested/changed/found/in-commit) → any
    // flow incident to one is a flow this stage touched, painted the stage colour.
    var hot={};
    SIM.touched.concat(SIM.blast).forEach(function(sl){
      ((SIM.pieces&&SIM.pieces[sl])||[]).forEach(function(pc){
        if(!stageEnc(sl,pc).hollow) hot[sl+"\t"+pc.id]=1;
      });
    });
    var STG=STAGE_COLOR[curStage];

    // 1) containers + inner positions (per the "inside" layout, container auto-sized)
    slugs.forEach(function(slug){
      var pos=nodePos[slug]; if(!pos) return;
      var pieces=(SIM.pieces&&SIM.pieces[slug])||[];
      var ip=computeInsidePositions(slug, pieces, pos.x, pos.y);
      var extent=0;
      pieces.forEach(function(p){ var pp=ip[p.id]; innerPos[slug+"\t"+p.id]=pp;
        extent=Math.max(extent, Math.hypot(pp.x-pos.x, pp.y-pos.y)); });
      var contR=Math.max(56, extent+PR+18), col=COLORS[slug]||"#888";
      var cont=E("circle",{class:"xcontainer",cx:pos.x,cy:pos.y,r:contR,
        fill:col,"fill-opacity":"0.06",stroke:col,"stroke-opacity":"0.55","stroke-width":"1.6","stroke-dasharray":"4 4"});
      (function(sl){                                   // container: single = select · double = toggle
        var en=L1.filter(function(x){ return x.slug===sl; })[0], ct=null;
        cont.addEventListener("click", function(){
          if(ct){ clearTimeout(ct); ct=null; onDouble(en); }
          else { ct=setTimeout(function(){ ct=null; onSingle(en); }, 230); }
        });
      })(slug);
      layer.appendChild(cont);
      var lb=E("text",{class:"xcontlabel",x:pos.x,y:pos.y-contR-8,fill:col}); lb.textContent=nodeMeta[slug].node.label||slug;
      layer.appendChild(lb);
      b.minX=Math.min(b.minX,pos.x-contR-24); b.maxX=Math.max(b.maxX,pos.x+contR+24);
      b.minY=Math.min(b.minY,pos.y-contR-24); b.maxY=Math.max(b.maxY,pos.y+contR+24);
    });
    frame(b);

    var animE=[], animP=[], crossPaths=[];
    function line(a,c,cls,arrow,hotColor){
      var p=E("path",{class:cls+(hotColor?" hot":""), d:"M"+a.x+","+a.y+" L"+c.x+","+c.y});
      if(hotColor) p.style.stroke=hotColor;                 // this flow was touched this stage
      if(arrow) p.setAttribute("marker-end", hotColor?"url(#arrow-"+curStage+")":"url(#arrow)");
      layer.appendChild(p); if(!reduce) animE.push(p); return p;
    }
    // 2) intra-entity edges (relationships among an entity's pieces) — hot when
    //    either endpoint is a piece this stage touched
    slugs.forEach(function(slug){
      ((SIM.intra_edges&&SIM.intra_edges[slug])||[]).forEach(function(e){
        var a=innerPos[slug+"\t"+e.source], c=innerPos[slug+"\t"+e.target];
        var hc=(hot[slug+"\t"+e.source]||hot[slug+"\t"+e.target])?STG:null;
        if(a&&c) line(a,c,"xedge intra",false,hc);
      });
    });
    // 3) cross-entity piece edges — hot when either endpoint piece was touched
    ((SIM.cross_edges)||[]).forEach(function(e){
      var a=innerPos[e.from_slug+"\t"+e.from] || nodePos[e.from_slug];
      var c=innerPos[e.to_slug+"\t"+e.to]   || nodePos[e.to_slug];
      var hc=(hot[e.from_slug+"\t"+e.from]||hot[e.to_slug+"\t"+e.to])?STG:null;
      if(a&&c) crossPaths.push(line(a,c,"xedge cross",true,hc));
    });
    // 4) inner piece-circles — each flies out from its entity's centre
    slugs.forEach(function(slug){
      var pos=nodePos[slug];
      ((SIM.pieces&&SIM.pieces[slug])||[]).forEach(function(p){
        var pp=innerPos[slug+"\t"+p.id]; if(!pp) return;
        var col=p.role==="changed"?"var(--touch)":"var(--blast)";
        var e=stageEnc(slug,p), key=slug+"|"+p.id;
        var g=E("g",{class:"xpiece"+(connector[slug+"\t"+p.id]?" pulse":"")+(selPiece===key?" selp":""),
                     "data-piece":key, transform:"translate("+pp.x+","+pp.y+")"});
        var inner=E("g",{class:"xpiece-in"});
        inner.appendChild(E("circle",{class:"ring2",r:e.r+7,cx:0,cy:0}));           // selection ring (styled only when .selp)
        if(e.ring) inner.appendChild(E("circle",{r:e.r+4,cx:0,cy:0,fill:"none",stroke:e.color,"stroke-width":"2.4"}));
        inner.appendChild(E("circle",{r:e.r, fill:e.hollow?"var(--panel)":e.color, stroke:e.hollow?col:"var(--panel)","stroke-width":"2"}));
        if(e.badge){ var bw=9+String(e.badge).length*5.4, bx=e.r*0.64, by=-e.r*0.72;
          inner.appendChild(E("rect",{x:bx-bw/2,y:by-7,width:bw,height:14,rx:7,fill:e.color}));
          var bt=E("text",{class:"xbadge",x:bx,y:by+3}); bt.textContent=e.badge; inner.appendChild(bt); }
        var t=E("text",{class:"xplabel",x:0,y:e.r+11}); t.textContent=trunc(p.label,16); inner.appendChild(t);
        var ti=E("title"); ti.textContent=(p.label)+(p.via?" — "+p.via:""); inner.appendChild(ti);
        g.appendChild(inner); layer.appendChild(g);
        (function(sl,pc){ g.addEventListener("click", function(ev){ ev.stopPropagation(); openDetail(sl,pc); }); })(slug,p);
        if(!reduce) animP.push({el:inner, dx:pos.x-pp.x, dy:pos.y-pp.y});
      });
    });

    // ANIMATE: pieces fly out (staggered) → edges draw in one-by-one → cross lines flow
    if(!reduce){
      animP.forEach(function(a){ a.el.style.opacity="0"; a.el.style.transform="translate("+a.dx+"px,"+a.dy+"px)"; });
      animE.forEach(function(p){ var len=0; try{ len=p.getTotalLength(); }catch(e){} if(len){ p.style.strokeDasharray=len; p.style.strokeDashoffset=len; p.__len=len; } });
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        animP.forEach(function(a,i){
          a.el.style.transition="transform .5s cubic-bezier(.2,.85,.25,1) "+(i*40)+"ms, opacity .4s ease "+(i*40)+"ms";
          a.el.style.transform="translate(0px,0px)"; a.el.style.opacity="1";
        });
        var edgeStart=animP.length*40+140;
        animE.forEach(function(p,i){ if(!p.__len) return;
          p.style.transition="stroke-dashoffset .5s ease "+(edgeStart+i*55)+"ms"; p.style.strokeDashoffset="0"; });
        var flowAt=edgeStart+animE.length*55+520;
        setTimeout(function(){ crossPaths.forEach(function(p){
          p.style.strokeDasharray=""; p.style.strokeDashoffset=""; p.style.transition=""; p.classList.add("flow"); }); }, flowAt);
      }); });
    }

    document.getElementById("selInfo").innerHTML = slugs.map(function(s){
      var role=((SIM.pieces[s]||[])[0]||{}).role, col=role==="changed"?"var(--touch)":"var(--blast)";
      return "<span style='color:"+col+"'>"+(nodeMeta[s].node.label||s)+" ("+((SIM.pieces[s]||[]).length)+")</span>";
    }).join(" &nbsp;·&nbsp; ") + " &nbsp; <span class='selinfo'>click a circle to collapse</span>";
  }
  // ── L2: click a node to light exactly its connectors, fade the rest ──────
  function focusL2(id){
    l2focus = (l2focus===id) ? null : id;
    var nodes=vp.querySelectorAll(".node");
    if(!l2focus){
      nodes.forEach(function(n){ n.classList.remove("faded"); });
      edgeRecs.forEach(function(r){ r.el.classList.remove("faded","hi"); });
      applySim(); return;
    }
    var keep={}; keep[l2focus]=1;
    edgeRecs.forEach(function(r){ if(r.s===l2focus)keep[r.t]=1; if(r.t===l2focus)keep[r.s]=1; });
    nodes.forEach(function(n){ n.classList.toggle("faded", !keep[n.getAttribute("data-id")]); });
    var c=0;
    edgeRecs.forEach(function(r){ var inc=(r.s===l2focus||r.t===l2focus); if(inc)c++;
      r.el.classList.toggle("hi",inc); r.el.classList.toggle("faded",!inc); });
    var lbl=nodeMeta[l2focus].node.label||l2focus.replace(/^[^:]+:/,"");
    document.getElementById("selInfo").innerHTML="<b>"+trunc(lbl,30)+"</b> · "+c+" connector"+(c===1?"":"s");
  }

  // ── per-stage node encoding (magnitude/ring/badge) + the detail panel ─────
  function stageEnc(slug, p){
    var sd=(SIM.stages&&SIM.stages[curStage])||{}, d=(sd.pieces&&sd.pieces[p.id])||{};
    var e={ r:PIECE_R, hollow:true, ring:false, badge:"", color:STAGE_COLOR[curStage] };
    if(curStage==="execute"){ if(d.changed){ e.hollow=false; e.r=PIECE_R+Math.sqrt(d.add||0)*3.4; if(d.add) e.badge="+"+d.add; } }
    else if(curStage==="red"){ if(d.tested){ e.hollow=false; e.ring=true; if(d.cases&&d.cases.length) e.badge=String(d.cases.length); } }
    else if(curStage==="review"){ if(d.touched_again){ e.hollow=false; e.ring=true; } }
    else if(curStage==="commit"){ if(p.role==="changed") e.hollow=false; }
    return e;   // highlighted pieces fill the STAGE colour; the rest stay hollow (role outline)
  }
  var STAGE_HEAD = { red:"what we made fail", execute:"what we changed", review:"what we found", commit:"what shipped" };
  function pill(t,c){ return "<span class='pill' style='background:"+(c||STAGE_COLOR[curStage])+"'>"+t+"</span>"; }
  function dblock(l,t){ return "<div class='b'><div class='l'>"+l+"</div><div class='t'>"+t+"</div></div>"; }
  function headline(label,text,color){
    return "<div class='b'><div class='l' style='color:"+color+"'>"+label+"</div>"
      + "<div class='headline' style='background:"+color+"18;border-left:3px solid "+color+"'>"+text+"</div></div>";
  }
  function bar(add,del){ var tot=(add||0)+(del||0)||1, g=Math.round(100*(add||0)/tot);
    return "<div class='bar'><i style='width:"+g+"%;background:#2f9e63'></i><i style='width:"+(100-g)+"%;background:#e5484d'></i></div>"
      +"<div class='delta'>+"+(add||0)+" · −"+(del||0)+" lines</div>"; }

  // ── typed identifier chips — EQUAL the command center's code-section language ──
  //  glyphs lifted verbatim from _a3_code._INS_ICONS + _a3_render zap; kind
  //  colours from KIND_COLOR; ty-* families mirror _a3_code._TYPE_CLS.
  var KIND_ICON = {
    fn:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 17c2 0 3-1 3-3v-4c0-2 1-3 3-3"/><path d="M9 11h6"/>',
    endpoint:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    model:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
    schema:'<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>',
    datatype:'<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>'
  };
  var KIND_CHIP = { fn:"#0f766e", endpoint:KIND_COLOR.endpoint, model:KIND_COLOR.model, schema:KIND_COLOR.schema };
  var METHOD_COLOR = { GET:"#16794c", POST:"#4338ca", PUT:"#b45309", PATCH:"#b45309", DELETE:"#d1443c" };
  var TYPE_CLS = { int:"num1",float:"num2",Decimal:"num2",Numeric:"num2",date:"tim1",time:"tim1",
    datetime:"tim2",str:"str1",Text:"str2",bytes:"str2",bool:"bool",dict:"json",list:"json",
    Any:"json",JSON:"json",Literal:"json",UUID:"id",uuid:"id" };
  function icoSvg(path){ return '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" '
    + 'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>'; }
  function tyFamily(t){ var toks=String(t).split(/[^A-Za-z_]+/);
    for(var i=0;i<toks.length;i++){ if(TYPE_CLS[toks[i]]) return TYPE_CLS[toks[i]]; } return null; }
  function kindChip(kind,label){ var c=KIND_CHIP[kind]||"#868e96";
    return "<span class='idchip' style='color:"+c+";background:"+c+"1f'>"+icoSvg(KIND_ICON[kind])
      +"<b>"+trunc(label,30)+"</b></span>"; }
  function epChip(ep){ var mc=METHOD_COLOR[ep.m]||"#868e96", c=KIND_CHIP.endpoint;
    return "<span class='idchip' style='color:"+c+";background:"+c+"1f' title='"+ep.m+" "+ep.p+" → "+ep.fn+"()'>"
      +icoSvg(KIND_ICON.endpoint)+"<span class='mth' style='color:"+mc+"'>"+ep.m+"</span><b>"+ep.p+"</b></span>"; }
  function dtChip(d){ var fam=tyFamily(d.t);
    return "<span class='idchip dt'>"+icoSvg(KIND_ICON.datatype)+"<b>"+d.n+"</b>"
      +"<span class='ty"+(fam?" ty-"+fam:"")+"'>"+d.t+"</span></span>"; }
  // TESTS + EVIDENCE — the center's test-kind glyphs, coloured by pass/red state.
  var TEST_ICON = {
    unit:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
    integration:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    journey:'<circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-8a3.5 3.5 0 0 1 0-7H12"/>',
    web:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'
  };
  var VERIFIED_ICON = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
  var STATE_COLOR = { pass:"#16794c", red:"#e5484d", fail:"#e5484d", skip:"#b45309" };
  function testChip(t){ var c=STATE_COLOR[t.state]||"#868e96", ic=TEST_ICON[t.kind]||TEST_ICON.unit;
    var mk=t.state==="pass"?"✓":(t.state==="red"?"✕":"·"), lab=t.cid==="web"?"e2e":t.cid;
    return "<span class='idchip' style='color:"+c+";background:"+c+"1f' title='"+(t.name||t.tfile)+" · "+(t.tfile||"")+" · "+t.state+"'>"
      +icoSvg(ic)+"<b>"+lab+"</b><span class='mth' style='color:"+c+"'>"+t.state+" "+mk+"</span></span>"; }
  function evChip(label, ev){ if(!ev) return "";
    var ok=(ev.exit===0 && !ev.failed), c=ok?"#16794c":"#e5484d";
    return "<span class='idchip' style='color:"+c+";background:"+c+"1f' title='"+label+"-junit @ "+(ev.head||"?")+"'>"
      +icoSvg(VERIFIED_ICON)+"<b>"+label+"</b><span class='mth' style='color:"+c+"'>"+ev.passed+" ✓"
      +(ev.failed?" · "+ev.failed+" ✕":"")+(ev.skipped?" · "+ev.skipped+" skip":"")+"</span></span>"; }
  function evidenceRow(){ var ev=SIM.evidence; if(!ev) return "";
    var chips=Object.keys(ev).map(function(k){ return evChip(k, ev[k]); }).join("");
    return chips ? idrow("Evidence", chips) : ""; }
  function idrow(label,chips){ return chips ? "<div class='idrow'><div class='idlbl'>"+label
    +"</div><div class='idchips'>"+chips+"</div></div>" : ""; }
  function idSection(ids){
    if(!ids) return "";
    var h="";
    if(ids.fn)        h+=idrow("Functions", ids.fn.map(function(f){ return kindChip("fn",f+"()"); }).join(""));
    if(ids.endpoint)  h+=idrow("Endpoints", ids.endpoint.map(epChip).join(""));
    if(ids.model)     h+=idrow("Models",    ids.model.map(function(m){ return kindChip("model",m); }).join(""));
    if(ids.schema)    h+=idrow("Schemas",   ids.schema.map(function(s){ return kindChip("schema",s); }).join(""));
    if(ids.datatype)  h+=idrow("Data types",ids.datatype.map(dtChip).join(""));
    if(ids.test)      h+=idrow("Tests",     ids.test.map(testChip).join(""));
    if(ids.structure) h+=idrow("Structures",ids.structure.map(function(s){ return "<span class='idchip st'>"+s+"</span>"; }).join(""));
    return h ? "<div class='idsec'>"+h+"</div>" : "";
  }
  // union the current stage's identifiers across an entity's pieces (entity panel)
  function aggregateIds(slug){
    var sd=(SIM.stages&&SIM.stages[curStage])||{}, pieces=(SIM.pieces&&SIM.pieces[slug])||[];
    var out={}, seen={fn:{},endpoint:{},model:{},schema:{},datatype:{},test:{},structure:{}};
    pieces.forEach(function(p){ var ids=((sd.pieces&&sd.pieces[p.id])||{}).ids; if(!ids) return;
      ["fn","endpoint","model","schema","datatype","test","structure"].forEach(function(k){
        (ids[k]||[]).forEach(function(v){ var key=(k==="endpoint")?v.fn:(k==="datatype"?v.n:(k==="test"?v.cid+v.tfile:v));
          if(seen[k][key]) return; seen[k][key]=1; (out[k]=out[k]||[]).push(v); }); });
    });
    return Object.keys(out).length?out:null;
  }

  function openDetail(slug, p){        // a single PIECE, led by its stage headline
    var sd=(SIM.stages&&SIM.stages[curStage])||{}, d=(sd.pieces&&sd.pieces[p.id])||{};
    var dp=document.getElementById("detail"), sc=STAGE_COLOR[curStage];
    var body="";
    if(curStage==="execute"){
      body = d.changed
        ? "<div class='pillrow'>"+pill(d.action||"changed")+"<span class='file'>"+((d.file||"").split("/").pop())+"</span></div>"
          + bar(d.add,d.del) + headline("what we changed", d.effect||d.what||"—", sc)
          + idSection(d.ids) + (d.ids?"":dblock("added", d.what||"internal edits"))
        : "<div class='pillrow'>"+pill("not changed","var(--muted)")+"</div>"
          + dblock("relation","downstream via FK") + dblock("why it's here", d.summary||"referenced by the change");
    } else if(curStage==="red"){
      body = d.tested
        ? "<div class='pillrow'>"+pill("red proved","#e5484d")+(d.cases||[]).map(function(c){return "<span class='case'>"+c+"</span>";}).join("")+"</div>"
          + headline("what we made fail", d.red||"—", "#e5484d")
          + (d.use_case?dblock("use case", d.use_case):"") + idSection(d.ids)
          + dblock("covers", d.covers||"—") + dblock("guards against", d.guards||"—")
          + (d.source?dblock("from", d.source):"")
        : "<div class='pillrow'>"+pill("no test","var(--muted)")+"</div>"
          + idSection(d.ids) + dblock("risk if it breaks", d.guards||"no red declared for this piece");
    } else if(curStage==="review"){
      var rc={low:"#2f9e63",medium:"#d9821f",high:"#e5484d",watch:"#4c9aff"}[d.risk]||sc;
      body = "<div class='pillrow'>"+pill(d.touched_again?"finding":"clean")+pill("risk "+(d.risk||"—"),rc)+"</div>"
        + headline("what we found", d.why||"—", sc) + idSection(d.ids)
        + (d.impact?dblock("impact", d.impact):"") + (d.source?dblock("from", d.source):"");
    } else if(curStage==="commit"){
      var m=(SIM.stages.commit&&SIM.stages.commit.meta)||{};
      var eids=(((SIM.stages.execute||{}).pieces||{})[p.id]||{}).ids;   // ship = what Execute changed
      body = "<div class='pillrow'>"+pill(p.role==="changed"?"in commit":"not in commit", p.role==="changed"?sc:"var(--muted)")+"<span class='file'>"+(m.commit||"")+"</span></div>"
        + headline("what shipped", m.subject||"—", sc) + "<div class='delta'>"+(m.files||0)+" files · +"+(m.add||0)+" · −"+(m.del||0)+"</div>"
        + idSection(eids) + "<div class='idsec'>"+evidenceRow()+"</div>" + dblock("cases", (m.cases||[]).join(", ")||"—");
    }
    var ex=(sd.real===false)?" <span class='ex'>· example</span>":"";
    dp.innerHTML = "<div class='phdr'>"+curStage+ex+"</div><h4>"+p.label+"</h4>"
      + "<div class='kind'>in "+(nodeMeta[slug].node.label||slug)+"</div>"+body;
    selectPiece(slug+"|"+p.id);
  }

  function openEntityDetail(slug){      // the WHOLE entity — its stage headline aggregates every highlighted piece
    var dp=document.getElementById("detail");
    var n=(L1.filter(function(x){ return x.slug===slug; })[0])||{}, c=n.counts||{};
    var roleCol = TOUCH[slug]?"var(--touch)":(BLAST[slug]?"var(--blast)":"var(--muted)");
    var role = TOUCH[slug]?"touched by this change":(BLAST[slug]?"downstream · blast radius":"not involved");
    var pieces=(SIM.pieces&&SIM.pieces[slug])||[], sd=(SIM.stages&&SIM.stages[curStage])||{}, sc=STAGE_COLOR[curStage];
    function row(k,v){ return "<div class='row'><span class='k'>"+k+"</span><span class='v'>"+v+"</span></div>"; }
    var lines=[];
    pieces.forEach(function(p){
      var d=(sd.pieces&&sd.pieces[p.id])||{};
      if(curStage==="red" && d.tested) lines.push("<b>"+p.label+"</b> — "+(d.red||d.covers||""));
      else if(curStage==="execute" && d.changed) lines.push("<b>"+p.label+"</b> +"+d.add+" · "+(d.what||""));
      else if(curStage==="review" && d.touched_again) lines.push("<b>"+p.label+"</b> — "+(d.why||"")+" ("+(d.risk||"")+")");
      else if(curStage==="commit" && p.role==="changed") lines.push("<b>"+p.label+"</b>");
    });
    var headText;
    if(curStage==="commit"){ var m=(SIM.stages.commit&&SIM.stages.commit.meta)||{};
      headText=(m.subject||"")+"<div class='delta'>"+(m.files||0)+" files · +"+(m.add||0)+" · −"+(m.del||0)+"</div>"; }
    else headText = lines.length ? lines.join("<br>") : "<span class='muted'>nothing in this entity for the "+curStage+" stage</span>";
    var ex=(sd.real===false)?" <span class='ex'>· example</span>":"";
    dp.innerHTML = "<div class='phdr'>entity · "+curStage+ex+"</div>"
      + "<h4 style='color:"+roleCol+"'>"+(n.label||slug)+"</h4><div class='kind'>"+role+"</div>"
      + row("endpoints",c.endpoints||0)+row("models",c.models||0)+row("schemas",c.schemas||0)+row("files",c.files||0)+row("lines",(c.lines||0).toLocaleString())
      + headline(STAGE_HEAD[curStage], headText, sc)
      + (function(){ var ag=aggregateIds(slug); return ag?idSection(ag):""; })()
      + (curStage==="commit" ? "<div class='idsec'>"+evidenceRow()+"</div>" : "")
      + "<div class='sum'>double-click to open its pieces</div>";
    selectPiece(null);
  }
  function toggleAllExpand(){
    var inv=SIM.touched.concat(SIM.blast), allOpen=inv.length && inv.every(function(s){ return expanded[s]; });
    expanded={}; if(!allOpen) inv.forEach(function(s){ expanded[s]=true; });
    document.getElementById("openAll").textContent = allOpen ? "Open all" : "Close all";
    renderL1();
  }
  // default panel: a stage-wide summary of the crucial pieces across ALL entities
  function stageSummary(){
    var dp=document.getElementById("detail"), sd=(SIM.stages&&SIM.stages[curStage])||{}, sc=STAGE_COLOR[curStage];
    var lines=[], n=0;
    SIM.touched.concat(SIM.blast).forEach(function(slug){
      var ent=(L1.filter(function(x){ return x.slug===slug; })[0]||{}).label||slug;
      ((SIM.pieces&&SIM.pieces[slug])||[]).forEach(function(p){
        var d=(sd.pieces&&sd.pieces[p.id])||{};
        if(curStage==="red" && d.tested){ n++; lines.push("<b>"+p.label+"</b> — "+(d.red||d.covers||"")+" <span class='muted'>· "+ent+"</span>"); }
        else if(curStage==="execute" && d.changed){ n++; lines.push("<b>"+p.label+"</b> +"+d.add+" · "+(d.what||"")+" <span class='muted'>· "+ent+"</span>"); }
        else if(curStage==="review" && d.touched_again){ n++; lines.push("<b>"+p.label+"</b> — "+(d.why||"")+" ("+(d.risk||"")+") <span class='muted'>· "+ent+"</span>"); }
        else if(curStage==="commit" && p.role==="changed"){ n++; lines.push("<b>"+p.label+"</b> <span class='muted'>· "+ent+"</span>"); }
      });
    });
    var noun={red:"red test",execute:"changed piece",review:"finding",commit:"piece in commit"}[curStage];
    var head, sub=n+" "+noun+(n===1?"":"s");
    if(curStage==="commit"){ var m=(SIM.stages.commit&&SIM.stages.commit.meta)||{};
      head="<b>"+(m.commit||"")+"</b> "+(m.subject||"")+"<div class='delta'>"+(m.files||0)+" files · +"+(m.add||0)+" · −"+(m.del||0)+" · "+(m.cases||[]).join(", ")+"</div>"; }
    else head = lines.length ? lines.join("<br>") : "<span class='muted'>nothing flagged for the "+curStage+" stage</span>";
    var ex=(sd.real===false)?" <span class='ex'>· example</span>":"";
    dp.innerHTML = "<div class='phdr'>"+curStage+ex+" · all entities</div>"
      + "<h4>Change summary</h4>"
      + "<div class='kind'><span style='color:var(--touch)'>"+SIM.touched.join(", ")+"</span> &rarr; <span style='color:var(--blast)'>"+SIM.blast.join(", ")+"</span> · "+sub+"</div>"
      + headline(STAGE_HEAD[curStage], head, sc)
      + "<div class='sum'>click an entity or a piece for its detail</div>";
    selectPiece(null);
  }
  function resetPanel(){ stageSummary(); }
  function selectPiece(key){
    selPiece=key;
    vp.querySelectorAll(".xpiece").forEach(function(g){ g.classList.toggle("selp", g.getAttribute("data-piece")===key); });
  }

  // ── the change overlay: touched (green) · blast/downstream (amber) · faded ──
  function applySim(){
    if(!SIM) return;
    var nodes = vp.querySelectorAll(".node");
    if(view==="l1"){
      nodes.forEach(function(g){
        var id=g.getAttribute("data-id");
        g.classList.remove("touched","blast","faded");
        if(!INVOLVED[id]){ g.classList.add("faded"); return; }   // uninvolved recede
        if(TOUCH[id]) g.classList.add("touched"); else if(BLAST[id]) g.classList.add("blast");
      });
      edgeRecs.forEach(function(r){
        r.el.classList.remove("blastedge","faded");
        if(!(INVOLVED[r.s] && INVOLVED[r.t])){ r.el.classList.add("faded"); return; }
        if(BLAST[r.s] && TOUCH[r.t]) r.el.classList.add("blastedge");
      });
      if(!Object.keys(expanded).length){
        var sd=(SIM.stages&&SIM.stages[curStage])||{};
        document.getElementById("selInfo").innerHTML =
          "<b>"+(sd.label||curStage)+"</b>" + (sd.real===false?" <span style='color:#b46a12'>· example</span>":"")
          + " &nbsp; <span style='color:var(--touch)'>&#9679; "+SIM.touched.join(", ")+"</span>"
          + (SIM.blast.length?" <span style='color:var(--blast)'>&#9679; "+SIM.blast.join(", ")+"</span>":"")
          + " &nbsp;<span class='selinfo'>click an entity to open it</span>";
      }
    }
  }
  // per-stage NODE-ENCODING legend (lower-left) — what circle states mean HERE
  function legendRow(inner, text){
    return "<div class='li'><svg width='24' height='24' viewBox='0 0 24 24'>"+inner+"</svg><span>"+text+"</span></div>";
  }
  function buildStageLegend(){
    var el=document.getElementById("stagelegend"); if(!el) return;
    if(view==="l2"){ el.style.display="none"; return; } el.style.display="";
    var sc=STAGE_COLOR[curStage];
    var hollowG="<circle cx='12' cy='12' r='7' fill='var(--panel)' stroke='var(--touch)' stroke-width='2'/>";
    var rows="";
    if(curStage==="red"){
      rows += legendRow("<circle cx='12' cy='12' r='9.6' fill='none' stroke='#4c9aff' stroke-width='2'/><circle cx='12' cy='12' r='6' fill='#e5484d'/>",
        "<b>tested</b> · blue ring + badge = # cases");
      rows += legendRow(hollowG, "<b>no red test</b> declared");
    } else if(curStage==="execute"){
      rows += legendRow("<circle cx='12' cy='12' r='9' fill='"+sc+"'/>",
        "<b>changed</b> · size ∝ lines, <b>+N</b> = added");
      rows += legendRow("<circle cx='12' cy='12' r='6' fill='var(--panel)' stroke='var(--touch)' stroke-width='2'/>",
        "in a changed file, <b>not edited</b>");
    } else if(curStage==="review"){
      rows += legendRow("<circle cx='12' cy='12' r='9.6' fill='none' stroke='var(--blast)' stroke-width='2'/><circle cx='12' cy='12' r='6' fill='"+sc+"'/>",
        "<b>finding</b> · re-touched in review");
      rows += legendRow(hollowG, "<b>clean</b> / unchanged");
    } else {
      rows += legendRow("<circle cx='12' cy='12' r='7' fill='"+sc+"'/>", "<b>in this commit</b>");
      rows += legendRow(hollowG, "<b>not</b> in the commit");
    }
    // common to every stage
    rows += legendRow(
      "<circle cx='8' cy='12' r='5.6' fill='var(--panel)' stroke='var(--touch)' stroke-width='2'/>"
      +"<circle cx='17' cy='12' r='5.6' fill='var(--panel)' stroke='var(--blast)' stroke-width='2'/>",
      "outline <b style='color:var(--touch)'>green</b> in the change · <b style='color:var(--blast)'>amber</b> downstream");
    rows += legendRow(
      "<circle cx='12' cy='12' r='6.5' fill='var(--panel)' stroke='var(--blast)' stroke-width='2'/>"
      +"<circle class='lgpulse' cx='12' cy='12' r='9.6' fill='none' stroke='"+sc+"' stroke-width='1.8'/>",
      "<b>glow</b> = connector to another entity");
    rows += legendRow(
      "<line x1='2' y1='12' x2='18' y2='12' stroke='"+sc+"' stroke-width='2.8'/><path d='M17 8 L22 12 L17 16 Z' fill='"+sc+"'/>",
      "<b>coloured flow</b> = a flow this stage touched");
    el.innerHTML = "<div class='lh'><i style='background:"+sc+"'></i>"+curStage+" — what a circle means</div>"+rows;
  }
  function setStage(s){
    curStage = s; resetPanel();
    document.getElementById("stageSeg").querySelectorAll("button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-stage")===s); });
    renderL1();
  }

  // ── drill / back ────────────────────────────────────────────────────
  function drill(slug){ selected=null; l2focus=null; expanded={}; renderL2(slug); }
  function back(){ selected=null; l2focus=null; expanded={}; renderL1(); }
  backBtn.addEventListener("click", back);
  resetBtn.addEventListener("click", function(){ selected=null; if(view==="l1") renderL1(); else renderL2(drilledSlug); });

  // drag the empty background to PAN the viewport; a click without drag clears the panel
  (function(){
    var pan=null;
    stage.addEventListener("pointerdown", function(e){
      if(e.target!==stage && e.target!==svg) return;         // nodes keep their own drag
      pan={ x:e.clientX, y:e.clientY, px:panX, py:panY, moved:false };
    });
    window.addEventListener("pointermove", function(e){
      if(!pan) return;
      var dx=e.clientX-pan.x, dy=e.clientY-pan.y;
      if(Math.abs(dx)+Math.abs(dy)>3) pan.moved=true;
      panX=pan.px+dx; panY=pan.py+dy; applyPan();
    });
    window.addEventListener("pointerup", function(){ if(pan){ if(!pan.moved) resetPanel(); pan=null; } });
  })();
  window.addEventListener("resize", function(){ if(lastBounds) frame(lastBounds); });

  // ── tooltip ─────────────────────────────────────────────────────────
  function showTip(node){
    var html;
    if(view==="l1"){
      var c=node.counts, col=COLORS[node.slug]||"var(--muted)";
      html = "<div class='ttl'><span class='sw' style='background:"+col+"'></span>"+node.label+"</div>"
           + "<div class='kind'>entity · "+node.status+"</div>"
           + "<div class='grid'>"
           + row("endpoints",c.endpoints)+row("models",c.models)+row("schemas",c.schemas)
           + row("files",c.files)+row("lines",c.lines.toLocaleString())+"</div>";
    } else {
      var col2=KIND_COLOR[node.kind]||"#888";
      var lbl=node.label || String(node.id).replace(/^[^:]+:/,"");
      html = "<div class='ttl'><span class='sw' style='background:"+col2+"'></span>"+lbl+"</div>"
           + "<div class='kind'>"+node.kind+"</div>";
      if(node.table) html += "<div class='meta'>table · "+node.table+"</div>";
      if(node.kind==="external") html += "<div class='meta'>&rarr; entity <b>"+lbl+"</b> · double-click to hop</div>";
    }
    tip.innerHTML = html; tip.classList.add("on");
  }
  function row(k,v){ return "<div class='k'>"+k+"</div><div class='v'>"+v+"</div>"; }
  function moveTip(e){
    var pad=14, w=tip.offsetWidth, h=tip.offsetHeight;
    var x=e.clientX+pad, y=e.clientY+pad;
    if(x+w>window.innerWidth-8)  x=e.clientX-w-pad;
    if(y+h>window.innerHeight-8) y=e.clientY-h-pad;
    tip.style.left=x+"px"; tip.style.top=y+"px";
  }
  function hideTip(){ tip.classList.remove("on"); }

  // ── legend ──────────────────────────────────────────────────────────
  function buildLegend(){
    var html;
    if(view==="l1"){
      html = "<div class='grp'>";
      L1.forEach(function(n){
        html += "<span class='item'><span class='sw' style='background:"+(COLORS[n.slug]||"#888")+"'></span>"+n.label+"</span>";
      });
      html += "</div><div class='div'></div>"
           + "<span class='item'><span class='swr'></span>fk (directed · width = weight)</span>"
           + "<span class='count'>"+DATA.stats.entities+" entities · "+L1E.length+" edges</span>";
    } else {
      html = "<div class='grp'>";
      ["endpoint","model","schema","external"].forEach(function(k){
        html += "<span class='item'><span class='sw' style='background:"+KIND_COLOR[k]+"'></span>"+KIND_LABEL[k]+"</span>";
      });
      html += "</div><div class='div'></div>"
           + "<span class='item'><span class='swr'></span>touches</span>"
           + "<span class='item'><span class='swr' style='border-top-style:dashed'></span>fk</span>"
           + "<span class='count'>double-click an external chip to hop</span>";
    }
    legend.innerHTML = html;
  }

  // ══════════════════════════════════════════════════════════════════
  //  MANDATORY TEST HOOK
  // ══════════════════════════════════════════════════════════════════
  window.__labtest = {
    approach: "Zero-lib inline SVG · change simulation",
    view:     function(){ return view==="l1" ? "l1" : "l2:"+drilledSlug; },
    l1nodes:  function(){ return DATA.l1.nodes.length; },
    l1edges:  function(){ return DATA.l1.edges.length; },
    entities: function(){ return DATA.l1.nodes.map(function(n){ return n.slug; }); },
    drill:    function(slug){ drill(slug); },
    l2nodes:  function(){ return (view==="l2" && DATA.l2[drilledSlug]) ? DATA.l2[drilledSlug].nodes.length : 0; },
    back:     function(){ back(); },
    // simulation surface
    stageNow: function(){ return curStage; },
    setStage: function(s){ setStage(s); },
    openPiece: function(slug, pid){
      var p=((SIM.pieces&&SIM.pieces[slug])||[]).filter(function(x){ return x.id===pid; })[0];
      if(p) openDetail(slug, p);
    },
    detailOpen: function(){ return !document.querySelector("#detail .empty"); },
    openAll:    function(){ toggleAllExpand(); },
    insideNowSel: function(){ return insideLayout; },
    detailText: function(){ return document.getElementById("detail").textContent; },
    pieceRadius: function(pid){ var c=vp.querySelector('.xpiece[data-piece$="|'+pid+'"] .xpiece-in circle:last-of-type'); return c?+c.getAttribute("r"):0; },
    touched:  function(){ return SIM ? SIM.touched.slice() : []; },
    blast:    function(){ return SIM ? SIM.blast.slice() : []; },
    touchedNow:  function(){ return Array.prototype.map.call(vp.querySelectorAll(".node.touched"), function(g){ return g.getAttribute("data-id"); }); },
    blastNow:    function(){ return Array.prototype.map.call(vp.querySelectorAll(".node.blast"), function(g){ return g.getAttribute("data-id"); }); },
    // single-click expansion + L2 connector focus (for the UX probe)
    singleClick: function(key){
      var arr = view==="l1" ? DATA.l1.nodes : DATA.l2[drilledSlug].nodes;
      var n = arr.filter(function(x){ return x.slug===key || x.id===key; })[0];
      if(n) onSingle(n);
    },
    dblClick: function(key){
      var n = DATA.l1.nodes.filter(function(x){ return x.slug===key || x.id===key; })[0];
      if(n) onDouble(n);
    },
    expandedNow:    function(){ return Object.keys(expanded); },
    insideNow:      function(){ return insideLayout; },
    pieceCircles:   function(){ return vp.querySelectorAll("#expansion .xpiece").length; },
    containers:     function(){ return vp.querySelectorAll("#expansion .xcontainer").length; },
    intraEdges:     function(){ return vp.querySelectorAll("#expansion .xedge.intra").length; },
    crossEdges:     function(){ return vp.querySelectorAll("#expansion .xedge.cross").length; },
    focusNow:       function(){ return l2focus; },
    hiEdges:        function(){ return vp.querySelectorAll(".edge.hi").length; },
    // typed identifier chips in the detail panel (for the chip probe)
    idChips:        function(){ return document.querySelectorAll("#detail .idchip").length; },
    idRows:         function(){ return Array.prototype.map.call(document.querySelectorAll("#detail .idrow .idlbl"), function(l){ return l.textContent; }); },
    tyChips:        function(){ return document.querySelectorAll("#detail .idchip.dt .ty[class*='ty-']").length; },
    // single-column check: is the label stacked ABOVE its chips (not beside)?
    rowStacked:     function(){ var r=document.querySelector("#detail .idrow"); if(!r) return null;
      var l=r.querySelector(".idlbl"), c=r.querySelector(".idchips"); if(!l||!c) return null;
      return l.getBoundingClientRect().bottom <= c.getBoundingClientRect().top + 1; },
    // stage-coloured touched flows in the diagram
    hotEdges:       function(){ return vp.querySelectorAll("#expansion .xedge.hot").length; },
    hotColor:       function(){ var e=vp.querySelector("#expansion .xedge.hot"); return e?e.style.stroke:""; },
    // per-stage node-encoding legend (lower-left)
    stageLegend:    function(){ return document.getElementById("stagelegend").textContent; },
    stageLegendRows:function(){ return document.querySelectorAll("#stagelegend .li").length; }
  };

  // ── compact change note in the header + control wiring ──────────────
  if(SIM){
    document.getElementById("hchange").innerHTML =
      "<b style='color:var(--ink)'>"+SIM.commit+"</b> "+trunc(SIM.subject,50)
      + " · <span style='color:var(--touch)'>"+SIM.touched.join(",")+"</span> &rarr; "
      + "<span style='color:var(--blast)'>"+SIM.blast.join(",")+"</span>";
  }
  document.getElementById("openAll").addEventListener("click", toggleAllExpand);
  document.getElementById("stageSeg").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(b) setStage(b.getAttribute("data-stage"));
  });
  document.getElementById("layoutSel").addEventListener("change", function(){
    var v=this.value;
    if(view==="l1"){ l1layout=v; expanded={}; renderL1(); }
    else { l2layout=v; renderL2(drilledSlug); }
  });
  document.getElementById("insideSel").addEventListener("change", function(){
    insideLayout=this.value; renderL1();   // keeps expanded entities open, re-scatters their pieces
  });

  // ── boot ────────────────────────────────────────────────────────────
  renderL1();
  resetPanel();               // default panel = the stage-wide change summary
  window.__labready = true;
})();
</script>
