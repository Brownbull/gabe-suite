<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebase Graph — Force-Directed</title>
<style>
  :root{ --bg:#f7f8fa; --panel:#ffffff; --ink:#1c2024; --muted:#6b7280;
         --line:#e3e6ea; --edge:#9aa3ad; --accent:#0d6e78; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0f1216; --panel:#171b21;
         --ink:#e6e9ee; --muted:#8a929c; --line:#262c34; --edge:#4a525c; } }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--ink); margin:0;
        font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }

  header{ padding:16px 20px 12px; border-bottom:1px solid var(--line); }
  header h1{ margin:0 0 4px; font-size:18px; font-weight:650; letter-spacing:-.01em; }
  header h1 .tag{ font-size:11px; font-weight:600; color:var(--accent); border:1px solid var(--accent);
        border-radius:999px; padding:1px 8px; margin-left:8px; vertical-align:middle; letter-spacing:.02em; }
  header .sub{ font-size:12px; color:var(--muted); }
  header .sub b{ color:var(--ink); font-weight:600; }
  header .sub .cost{ color:var(--accent); font-weight:600; }

  main{ position:relative; height:calc(100vh - 74px); min-height:520px; }
  #stage{ position:absolute; inset:0; overflow:hidden; }
  svg#svg{ width:100%; height:100%; display:block; touch-action:none; cursor:default; }

  /* nodes / edges */
  .node{ cursor:pointer; }
  .node circle{ stroke:var(--panel); stroke-width:1.5; vector-effect:non-scaling-stroke; transition:opacity .18s; }
  .node.entity circle{ stroke:rgba(0,0,0,.18); }
  @media (prefers-color-scheme:dark){ .node.entity circle{ stroke:rgba(255,255,255,.22); } }
  .node.sel  circle{ stroke:var(--accent); stroke-width:3; }
  .node.pinned circle{ stroke-dasharray:2 2; }
  .node text.label{ fill:var(--ink); font-weight:600; text-anchor:middle;
        paint-order:stroke; stroke:var(--panel); stroke-width:3px; stroke-linejoin:round;
        pointer-events:none; user-select:none; }
  .node.hidelabel text.label{ display:none; }
  .edge line{ vector-effect:non-scaling-stroke; }
  .edge polygon{ stroke:none; }
  .dim{ opacity:.10; }
  .adj{ opacity:1; }

  /* HUD */
  #hud{ position:absolute; top:12px; left:12px; display:flex; gap:8px; align-items:center;
        background:var(--panel); border:1px solid var(--line); border-radius:10px;
        padding:6px 8px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  #hud .vlabel{ font-size:12px; color:var(--muted); padding:0 4px; white-space:nowrap; }
  #hud .vlabel b{ color:var(--ink); }
  button.ctl{ font:inherit; font-size:12px; font-weight:600; color:var(--ink); background:var(--panel);
        border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; }
  button.ctl:hover{ border-color:var(--accent); color:var(--accent); }
  button.ctl:disabled{ opacity:.4; cursor:default; }
  button#back{ display:none; }

  /* legend */
  #legend{ position:absolute; bottom:12px; left:12px; background:var(--panel);
        border:1px solid var(--line); border-radius:10px; padding:10px 12px; max-width:280px;
        box-shadow:0 1px 3px rgba(0,0,0,.06); }
  #legend h4{ margin:0 0 6px; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:650; }
  #legend .row{ display:flex; align-items:center; gap:8px; font-size:12px; margin:3px 0; color:var(--ink); }
  #legend .dot{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  #legend .bar{ width:22px; height:0; border-top-width:2px; border-top-style:solid; flex:0 0 auto; }
  #legend .bar.dash{ border-top-style:dashed; }
  #legend .note{ font-size:11px; color:var(--muted); margin-top:6px; }

  /* tooltip */
  #tip{ position:absolute; pointer-events:none; z-index:5; background:var(--panel);
        border:1px solid var(--line); border-radius:8px; padding:8px 10px; max-width:260px;
        box-shadow:0 4px 14px rgba(0,0,0,.14); font-size:12px; display:none; }
  #tip .t-title{ font-weight:650; margin-bottom:4px; word-break:break-word; }
  #tip .t-kind{ font-size:11px; color:var(--muted); }
  #tip .t-grid{ display:grid; grid-template-columns:auto auto; gap:1px 12px; margin-top:5px; }
  #tip .t-grid span{ color:var(--muted); }
  #tip .t-grid b{ color:var(--ink); font-weight:600; }
  #tip .t-status{ margin-top:5px; font-size:11px; color:var(--accent); font-weight:600; text-transform:capitalize; }
  .hint{ position:absolute; bottom:12px; right:12px; font-size:11px; color:var(--muted);
        background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 9px; }
</style>
</head>
<body>
<header>
  <h1>Codebase Graph <span class="tag">Force-Directed</span></h1>
  <div class="sub">
    <b>EXAMPLE</b> — rendered over real gustify data, not live ·
    Approach: <b>self-simulated force layout</b> (charge · springs · gravity, inline SVG) ·
    Integration cost: <span class="cost">LOW</span> — small inlined simulation, no external lib.
  </div>
</header>

<main>
  <div id="stage">
    <svg id="svg" preserveAspectRatio="xMidYMid meet">
      <g id="scene">
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>

    <div id="hud">
      <button class="ctl" id="back">← Back</button>
      <span class="vlabel" id="vlabel">L1</span>
      <button class="ctl" id="reheat" title="Unpin all &amp; re-run the simulation">Reheat</button>
    </div>

    <div id="legend"></div>
    <div id="tip"></div>
    <div class="hint">click = select · drag = pin · double-click entity = drill in</div>
  </div>
</main>

<!-- data globals: window.GABE_C4 + window.GABE_C4_COLORS -->
<script src="./c4-graph.data.js"></script>
<script>
(function(){
  "use strict";
  var D = window.GABE_C4, COLORS = window.GABE_C4_COLORS || {};
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  // logical viewport the camera fits into (SVG preserves aspect ratio)
  var VP_W = 1000, VP_H = 620;
  var svg = document.getElementById('svg');
  svg.setAttribute('viewBox', '0 0 ' + VP_W + ' ' + VP_H);
  var gScene = document.getElementById('scene');
  var gEdges = document.getElementById('edges');
  var gNodes = document.getElementById('nodes');
  var tip = document.getElementById('tip');
  var stage = document.getElementById('stage');
  var vlabel = document.getElementById('vlabel');
  var backBtn = document.getElementById('back');
  var reheatBtn = document.getElementById('reheat');
  var legend = document.getElementById('legend');
  var NS = 'http://www.w3.org/2000/svg';

  var KIND_COLOR = { endpoint:'#4c6ef5', model:'#12b886', schema:'#f59f00', external:'#868e96',
                     unclaimed:(COLORS.__unclaimed__ || '#8a8f98') };

  // ── force parameters per level ─────────────────────────────────────────────
  var PARAMS = {
    l1: { kRepel:6500, kSpring:0.020, kGravity:0.0040, restBase:215, damping:0.90, kCollide:0.55, fcap:6, vcap:9 },
    l2: { kRepel:900,  kSpring:0.032, kGravity:0.020,  restBase:40,  damping:0.85, kCollide:0.30, fcap:3, vcap:8 }
  };

  // ── runtime state ──────────────────────────────────────────────────────────
  var view = 'l1', drilledSlug = null, level = 'l1';
  var nodes = [], edges = [], byId = {}, selected = null, hovered = null;
  var running = false, rafId = null, quietCount = 0, frameCount = 0;
  var cam = { scale:1, tx:VP_W/2, ty:VP_H/2 };

  // ── sizing helpers ───────────────────────────────────────────────────────
  var linesArr = D.l1.nodes.map(function(n){ return n.counts.lines; });
  var sMin = Math.sqrt(Math.min.apply(null, linesArr));
  var sMax = Math.sqrt(Math.max.apply(null, linesArr));
  function entityRadius(lines){
    var t = (Math.sqrt(lines) - sMin) / (sMax - sMin || 1);
    return 17 + 31 * t;                       // 17..48
  }
  function l2Radius(kind){ return kind === 'endpoint' ? 10 : (kind === 'external' ? 9 : 8); }
  function edgeWidth(weight){ return 1.2 + (Math.max(1, weight || 1) - 1) * 0.55; } // 1.2..6.2

  function rand(a, b){ return a + Math.random() * (b - a); }

  // ── build the L1 graph (entities) ────────────────────────────────────────
  function buildL1(){
    nodes = []; edges = []; byId = {};
    var seed = 46;
    D.l1.nodes.forEach(function(n){
      var node = {
        id: n.slug, kind: 'entity', label: n.label, slug: n.slug,
        color: COLORS[n.slug] || KIND_COLOR.unclaimed, r: entityRadius(n.counts.lines),
        counts: n.counts, status: n.status,
        x: rand(-seed, seed), y: rand(-seed, seed), vx:0, vy:0, ax:0, ay:0, fixed:false
      };
      nodes.push(node); byId[node.id] = node;
    });
    D.l1.edges.forEach(function(e){
      var s = byId[e.source], t = byId[e.target];
      if(!s || !t) return;
      edges.push({ s:s, t:t, weight:e.weight, kind:'fk', w:edgeWidth(e.weight),
                   rest: Math.max(PARAMS.l1.restBase * 0.45, PARAMS.l1.restBase - (e.weight||1) * 3.4),
                   color:'var(--edge)', dash:false });
    });
  }

  // ── build an L2 graph (one entity's internals) ────────────────────────────
  function buildL2(slug){
    var g = D.l2[slug]; nodes = []; edges = []; byId = {};
    if(!g){ return; }
    var seed = 70;
    g.nodes.forEach(function(n){
      var node = {
        id: n.id, kind: n.kind, label: n.label, slug: slug, table: n.table || null,
        color: KIND_COLOR[n.kind] || KIND_COLOR.unclaimed, r: l2Radius(n.kind),
        x: rand(-seed, seed), y: rand(-seed, seed), vx:0, vy:0, ax:0, ay:0, fixed:false
      };
      nodes.push(node); byId[node.id] = node;
    });
    g.edges.forEach(function(e){
      var s = byId[e.source], t = byId[e.target];
      if(!s || !t) return;                    // render only edges whose ends exist
      var isFk = e.kind === 'fk';
      edges.push({ s:s, t:t, weight:1, kind:e.kind, w: isFk ? 1.7 : 1.2,
                   rest: PARAMS.l2.restBase, color: isFk ? 'var(--muted)' : 'var(--edge)', dash: isFk });
    });
  }

  // ── physics step ───────────────────────────────────────────────────────────
  function step(P){
    var i, j, a, b, dx, dy, d2, d, f, ux, uy, minD;
    for(i=0;i<nodes.length;i++){ nodes[i].ax = 0; nodes[i].ay = 0; }
    // charge repulsion (all pairs) + collision resolution
    for(i=0;i<nodes.length;i++){
      a = nodes[i];
      for(j=i+1;j<nodes.length;j++){
        b = nodes[j];
        dx = a.x - b.x; dy = a.y - b.y;
        d2 = dx*dx + dy*dy + 25;              // softening
        d = Math.sqrt(d2);
        ux = dx/d; uy = dy/d;
        f = P.kRepel / d2;
        if(f > P.fcap) f = P.fcap;              // cap the CHARGE term only
        minD = a.r + b.r + 12;                   // hard no-overlap separation
        if(d < minD) f += (minD - d) * P.kCollide;   // collision NOT capped
        a.ax += ux*f; a.ay += uy*f;
        b.ax -= ux*f; b.ay -= uy*f;
      }
    }
    // spring attraction along edges
    for(i=0;i<edges.length;i++){
      var e = edges[i]; a = e.s; b = e.t;
      dx = b.x - a.x; dy = b.y - a.y;
      d = Math.sqrt(dx*dx + dy*dy) || 0.01;
      ux = dx/d; uy = dy/d;
      f = P.kSpring * (d - e.rest);
      a.ax += ux*f; a.ay += uy*f;
      b.ax -= ux*f; b.ay -= uy*f;
    }
    // gravity toward centre (0,0)
    for(i=0;i<nodes.length;i++){
      a = nodes[i];
      a.ax += (0 - a.x) * P.kGravity;
      a.ay += (0 - a.y) * P.kGravity;
    }
    // integrate + damping
    var maxSpeed = 0;
    for(i=0;i<nodes.length;i++){
      a = nodes[i];
      if(a.fixed){ a.vx = 0; a.vy = 0; continue; }
      a.vx = (a.vx + a.ax) * P.damping;
      a.vy = (a.vy + a.ay) * P.damping;
      var sp = Math.sqrt(a.vx*a.vx + a.vy*a.vy);
      if(sp > P.vcap){ a.vx *= P.vcap/sp; a.vy *= P.vcap/sp; sp = P.vcap; }
      a.x += a.vx; a.y += a.vy;
      if(sp > maxSpeed) maxSpeed = sp;
    }
    return maxSpeed;
  }

  // ── camera: fit all nodes into the logical viewport ───────────────────────
  function fit(instant){
    if(!nodes.length) return;
    var minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9;
    for(var i=0;i<nodes.length;i++){
      var n = nodes[i], r = n.r + 14;
      if(n.x-r<minx) minx=n.x-r; if(n.x+r>maxx) maxx=n.x+r;
      if(n.y-r<miny) miny=n.y-r; if(n.y+r>maxy) maxy=n.y+r;
    }
    var pad = 46;
    var w = Math.max(1, maxx-minx), h = Math.max(1, maxy-miny);
    var s = Math.min((VP_W-2*pad)/w, (VP_H-2*pad)/h);
    s = Math.max(0.32, Math.min(2.2, s));
    var cx = (minx+maxx)/2, cy = (miny+maxy)/2;
    var tx = VP_W/2 - s*cx, ty = VP_H/2 - s*cy;
    var k = instant ? 1 : 0.12;
    cam.scale += (s - cam.scale) * k;
    cam.tx += (tx - cam.tx) * k;
    cam.ty += (ty - cam.ty) * k;
    gScene.setAttribute('transform', 'translate('+cam.tx+','+cam.ty+') scale('+cam.scale+')');
  }

  // ── DOM build for the current graph ───────────────────────────────────────
  function makeEl(tag){ return document.createElementNS(NS, tag); }
  function buildDOM(){
    gEdges.textContent = ''; gNodes.textContent = '';
    edges.forEach(function(e){
      var g = makeEl('g'); g.setAttribute('class','edge');
      var ln = makeEl('line');
      ln.setAttribute('stroke', e.color);
      ln.setAttribute('stroke-width', e.w);
      ln.setAttribute('stroke-linecap','round');
      if(e.dash) ln.setAttribute('stroke-dasharray','4 3');
      var ar = makeEl('polygon');
      ar.setAttribute('fill', e.color);
      g.appendChild(ln); g.appendChild(ar);
      gEdges.appendChild(g);
      e.g = g; e.line = ln; e.arrow = ar;
    });
    var hideLabels = (level === 'l2');
    nodes.forEach(function(n){
      var g = makeEl('g');
      g.setAttribute('class', 'node ' + n.kind + (hideLabels ? ' hidelabel' : ''));
      g.dataset.id = n.id;
      var c = makeEl('circle');
      c.setAttribute('r', n.r);
      c.setAttribute('fill', n.color);
      var tx = makeEl('text');
      tx.setAttribute('class','label');
      tx.setAttribute('y', n.r + (level==='l1' ? 15 : 12));
      tx.setAttribute('font-size', level==='l1' ? 13 : 11);
      tx.textContent = n.label.length > 34 ? n.label.slice(0,33)+'…' : n.label;
      g.appendChild(c); g.appendChild(tx);
      gNodes.appendChild(g);
      n.g = g; n.circle = c; n.text = tx;
    });
  }

  // ── per-frame render (positions, edges, arrows) ───────────────────────────
  function render(){
    var s = cam.scale || 1;
    var arrowLen = 11 / s, arrowW = 6 / s;
    for(var i=0;i<edges.length;i++){
      var e = edges[i], a = e.s, b = e.t;
      var dx = b.x-a.x, dy = b.y-a.y;
      var len = Math.sqrt(dx*dx+dy*dy) || 1;
      var ux = dx/len, uy = dy/len;
      var x1 = a.x + ux*(a.r+2), y1 = a.y + uy*(a.r+2);
      var x2 = b.x - ux*(b.r+2), y2 = b.y - uy*(b.r+2);
      var bx = x2 - ux*arrowLen, by = y2 - uy*arrowLen;
      e.line.setAttribute('x1', x1); e.line.setAttribute('y1', y1);
      e.line.setAttribute('x2', bx); e.line.setAttribute('y2', by);
      var px = -uy, py = ux;
      e.arrow.setAttribute('points',
        x2+','+y2+' '+(bx+px*arrowW)+','+(by+py*arrowW)+' '+(bx-px*arrowW)+','+(by-py*arrowW));
    }
    for(var j=0;j<nodes.length;j++){
      var n = nodes[j];
      n.g.setAttribute('transform', 'translate('+n.x+','+n.y+')');
    }
  }

  // ── simulation loop ────────────────────────────────────────────────────────
  function frame(){
    if(!running){ rafId = null; return; }
    var P = PARAMS[level];
    var maxSpeed = step(P); step(P);          // two substeps/frame → settles faster
    fit(false); render(); frameCount++;
    if(maxSpeed < 0.05) quietCount++; else quietCount = 0;
    if(quietCount > 16 || frameCount > 1500){
      running = false; rafId = null; fit(true); render(); return;
    }
    rafId = requestAnimationFrame(frame);
  }
  function startSim(){
    quietCount = 0; frameCount = 0;
    if(reduced){                              // settle instantly, no animation
      var P = PARAMS[level];
      for(var i=0;i<600;i++) step(P);
      fit(true); render(); running = false; return;
    }
    running = true;
    if(!rafId) rafId = requestAnimationFrame(frame);
  }

  // ── selection (highlight node + edges + neighbours, dim the rest) ──────────
  function applySelection(){
    var i, e, n;
    if(!selected){
      for(i=0;i<nodes.length;i++){ nodes[i].g.classList.remove('dim','sel','adj'); }
      for(i=0;i<edges.length;i++){ edges[i].g.classList.remove('dim'); }
      return;
    }
    var neigh = {};
    for(i=0;i<edges.length;i++){
      e = edges[i];
      if(e.s.id === selected) neigh[e.t.id] = true;
      if(e.t.id === selected) neigh[e.s.id] = true;
    }
    for(i=0;i<nodes.length;i++){
      n = nodes[i]; n.g.classList.remove('sel','adj','dim');
      if(n.id === selected) n.g.classList.add('sel');
      else if(neigh[n.id]) n.g.classList.add('adj');
      else n.g.classList.add('dim');
    }
    for(i=0;i<edges.length;i++){
      e = edges[i];
      var on = (e.s.id === selected || e.t.id === selected);
      e.g.classList.toggle('dim', !on);
    }
  }
  function select(id){
    selected = (selected === id) ? null : id;
    applySelection();
  }

  // ── HUD / legend ───────────────────────────────────────────────────────────
  function updateHUD(){
    if(view === 'l1'){
      backBtn.style.display = 'none';
      vlabel.innerHTML = 'L1 · <b>' + D.l1.nodes.length + ' entities</b>';
    } else {
      backBtn.style.display = 'inline-block';   // explicit: '' reverts to the
      // stylesheet's `button#back{display:none}` and the control never appears
      vlabel.innerHTML = 'L2 · <b>' + drilledSlug + '</b>';
    }
  }
  function buildLegend(){
    if(view === 'l1'){
      legend.innerHTML =
        '<h4>Level 1 · entities</h4>' +
        '<div class="row"><span class="dot" style="background:'+ (COLORS.auth||'#5a53a8') +'"></span>Entity — fill = its colour, size ∝ lines of code</div>' +
        '<div class="row"><span class="bar" style="border-top-color:var(--edge);width:22px"></span>FK edge → (width ∝ weight)</div>' +
        '<div class="note"><b>' + D.l1.nodes.length + ' entities · ' + D.l1.edges.length + ' edges.</b> auth is the hub — springs pull it central.</div>';
    } else {
      var g = D.l2[drilledSlug] || {nodes:[],edges:[]};
      var k = {endpoint:0,model:0,schema:0,external:0};
      g.nodes.forEach(function(n){ if(k[n.kind]!=null) k[n.kind]++; });
      legend.innerHTML =
        '<h4>Level 2 · ' + drilledSlug + '</h4>' +
        '<div class="row"><span class="dot" style="background:'+KIND_COLOR.endpoint+'"></span>endpoint ('+k.endpoint+')</div>' +
        '<div class="row"><span class="dot" style="background:'+KIND_COLOR.model+'"></span>model ('+k.model+')</div>' +
        '<div class="row"><span class="dot" style="background:'+KIND_COLOR.schema+'"></span>schema ('+k.schema+')</div>' +
        '<div class="row"><span class="dot" style="background:'+KIND_COLOR.external+'"></span>external ('+k.external+')</div>' +
        '<div class="row"><span class="bar" style="border-top-color:var(--edge)"></span>touches →</div>' +
        '<div class="row"><span class="bar dash" style="border-top-color:var(--muted)"></span>fk →</div>' +
        '<div class="note"><b>' + g.nodes.length + ' nodes · ' + g.edges.length + ' edges.</b> hover a node for its name.</div>';
    }
  }

  // ── tooltip ────────────────────────────────────────────────────────────────
  function showTip(n){
    var html;
    if(n.kind === 'entity'){
      var c = n.counts;
      html = '<div class="t-title">' + n.label + '</div>' +
        '<div class="t-grid">' +
          '<span>endpoints</span><b>'+c.endpoints+'</b>' +
          '<span>models</span><b>'+c.models+'</b>' +
          '<span>schemas</span><b>'+c.schemas+'</b>' +
          '<span>files</span><b>'+c.files+'</b>' +
          '<span>lines</span><b>'+c.lines.toLocaleString()+'</b>' +
        '</div>' +
        '<div class="t-status">'+ n.status +'</div>';
    } else {
      html = '<div class="t-title">' + n.label + '</div>' +
        '<div class="t-kind">' + n.kind + (n.table ? ' · table ' + n.table : '') + '</div>';
    }
    tip.innerHTML = html; tip.style.display = 'block';
  }
  function hideTip(){ tip.style.display = 'none'; }
  function moveTip(ev){
    if(tip.style.display === 'none') return;
    var b = stage.getBoundingClientRect();
    var x = ev.clientX - b.left + 14, y = ev.clientY - b.top + 14;
    if(x + tip.offsetWidth > b.width - 6) x = ev.clientX - b.left - tip.offsetWidth - 14;
    if(y + tip.offsetHeight > b.height - 6) y = ev.clientY - b.top - tip.offsetHeight - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }

  // ── view transitions ───────────────────────────────────────────────────────
  function drillTo(slug){
    if(!D.l2[slug]) return;
    view = 'l2'; level = 'l2'; drilledSlug = slug; selected = null; hovered = null;
    hideTip(); cam = { scale:1, tx:VP_W/2, ty:VP_H/2 };
    buildL2(slug); buildDOM(); wireNodes();
    fit(true); render(); updateHUD(); buildLegend(); startSim();
  }
  function goBack(){
    view = 'l1'; level = 'l1'; drilledSlug = null; selected = null; hovered = null;
    hideTip(); cam = { scale:1, tx:VP_W/2, ty:VP_H/2 };
    buildL1(); buildDOM(); wireNodes();
    fit(true); render(); updateHUD(); buildLegend(); startSim();   // re-run the L1 sim
  }

  // ── pointer handling: drag→pin, tap→select, dbl-tap→drill ─────────────────
  var DRAG_THRESH = 4, TAP_MS = 280;
  var lastTapId = null, lastTapTime = 0, pendingTap = null;
  function screenToWorld(ev){
    var b = svg.getBoundingClientRect();
    // account for preserveAspectRatio meet (uniform scale, centred)
    var sc = Math.min(b.width / VP_W, b.height / VP_H);
    var ox = (b.width - VP_W*sc)/2, oy = (b.height - VP_H*sc)/2;
    var vx = (ev.clientX - b.left - ox)/sc, vy = (ev.clientY - b.top - oy)/sc;
    return { x: (vx - cam.tx)/cam.scale, y: (vy - cam.ty)/cam.scale };
  }
  function wireNodes(){
    nodes.forEach(function(n){
      var g = n.g;
      g.addEventListener('pointerenter', function(){ hovered = n; showTip(n);
        if(level==='l2') g.classList.remove('hidelabel'); });
      g.addEventListener('pointerleave', function(){ if(hovered===n){ hovered=null; hideTip(); }
        if(level==='l2' && selected!==n.id) g.classList.add('hidelabel'); });
      g.addEventListener('pointerdown', function(ev){ onNodeDown(ev, n); });
    });
  }
  var drag = null;
  function onNodeDown(ev, n){
    ev.stopPropagation();
    try{ n.g.setPointerCapture(ev.pointerId); }catch(e){}
    drag = { n:n, id:ev.pointerId, moved:false, sx:ev.clientX, sy:ev.clientY };
    window.addEventListener('pointermove', onDrag);
    window.addEventListener('pointerup', onUp);
  }
  function onDrag(ev){
    if(!drag) return;
    var dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if(!drag.moved && (dx*dx+dy*dy) > DRAG_THRESH*DRAG_THRESH) drag.moved = true;
    if(drag.moved){
      var w = screenToWorld(ev);
      drag.n.x = w.x; drag.n.y = w.y; drag.n.vx = 0; drag.n.vy = 0;
      drag.n.fixed = true; drag.n.g.classList.add('pinned');   // pin while/after dragging
      if(!running){ if(reduced){ var P=PARAMS[level]; for(var i=0;i<40;i++) step(P); } fit(false); render(); }
      if(!running && !reduced) startSim();
    }
  }
  function onUp(ev){
    window.removeEventListener('pointermove', onDrag);
    window.removeEventListener('pointerup', onUp);
    if(!drag) return;
    var n = drag.n, moved = drag.moved; drag = null;
    if(moved){ fit(false); render(); return; }   // a real drag: node stays pinned
    // otherwise it's a tap → single-select, or double-tap → drill (entities only)
    var now = Date.now();
    if(lastTapId === n.id && (now - lastTapTime) < TAP_MS){
      if(pendingTap){ clearTimeout(pendingTap); pendingTap = null; }
      lastTapId = null;
      if(n.kind === 'entity') drillTo(n.slug);
    } else {
      lastTapId = n.id; lastTapTime = now;
      if(pendingTap) clearTimeout(pendingTap);
      pendingTap = setTimeout(function(){ pendingTap = null; select(n.id); }, TAP_MS);
    }
  }
  // click empty background → clear selection
  svg.addEventListener('pointerdown', function(){ if(selected){ selected = null; applySelection(); } });

  backBtn.addEventListener('click', goBack);
  reheatBtn.addEventListener('click', function(){
    nodes.forEach(function(n){ n.fixed = false; n.g.classList.remove('pinned');
      n.vx = rand(-2,2); n.vy = rand(-2,2); });
    startSim();
  });
  stage.addEventListener('pointermove', moveTip);
  window.addEventListener('resize', function(){ render(); });

  // ── test hook (kept in sync with what is rendered) ────────────────────────
  window.__labtest = {
    approach: "Force-Directed",
    view:     function(){ return view === 'l1' ? 'l1' : 'l2:' + drilledSlug; },
    l1nodes:  function(){ return (view === 'l1')
                 ? nodes.filter(function(n){ return n.kind === 'entity'; }).length
                 : D.l1.nodes.length; },
    l1edges:  function(){ return (view === 'l1') ? edges.length : D.l1.edges.length; },
    entities: function(){ return D.l1.nodes.map(function(n){ return n.slug; }); },
    drill:    function(slug){ drillTo(slug); },
    l2nodes:  function(){ return (view === 'l2') ? nodes.length : 0; },
    back:     function(){ goBack(); }
  };

  // ── boot ────────────────────────────────────────────────────────────────────
  buildL1(); buildDOM(); wireNodes();
  fit(true); render(); updateHUD(); buildLegend();
  window.__labready = true;                    // initial L1 render complete
  startSim();
})();
</script>
</body>
</html>
