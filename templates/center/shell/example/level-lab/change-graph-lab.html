<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change Graph — lab-grammar preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ── the CENTER's theme convention: light default, data-theme stamp WINS ── */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#141a24; --muted:#7a8595; --line:#e7e9ee;
  --accent:#4f46e5; --edge:#9aa3ad;
  --c-model:#12b886; --c-schema:#f59f00; --c-fn-api:#4c6ef5; --c-fn-services:#0f766e;
  --m-get:#16794c; --m-post:#4338ca; --m-put:#b45309; --m-delete:#d1443c;
  --red:#d1443c; --heat:#b45309; --ok:#12b886; --drift:#e8590c;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101726; --panel:#1b2436; --ink:#e7ebf3; --muted:#79839a; --line:#2c3648;
  --accent:#8b83f5; --edge:#4a525c; } }
:root[data-theme="dark"]{
  --bg:#101726; --panel:#1b2436; --ink:#e7ebf3; --muted:#79839a; --line:#2c3648;
  --accent:#8b83f5; --edge:#4a525c; }
:root[data-theme="light"]{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#141a24; --muted:#7a8595; --line:#e7e9ee;
  --accent:#4f46e5; --edge:#9aa3ad; }
*{ box-sizing:border-box; margin:0; }
body{ background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,sans-serif;
  height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
header h1{ font-size:15px; font-weight:650; }
.sub{ font-size:12px; color:var(--muted); }
.seg{ display:flex; gap:4px; margin-left:auto; }
.seg button{ font:inherit; font-size:12.5px; font-weight:600; background:var(--panel); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:5px 13px; cursor:pointer; }
.seg button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.tgl{ font:inherit; background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:8px; padding:5px 8px; cursor:pointer; display:inline-flex; align-items:center; }
.wrap{ flex:1; display:flex; min-height:0; }
#stage{ flex:1; min-width:0; position:relative; overflow:hidden; cursor:grab; }
svg#canvas{ display:block; width:100%; height:100%; }
.fixture{ position:absolute; top:10px; left:14px; font-size:10.5px; color:var(--muted);
  background:var(--panel); border:1px dashed var(--line); border-radius:6px; padding:2px 9px; pointer-events:none; }
aside{ width:330px; flex:none; border-left:1px solid var(--line); background:var(--panel);
  overflow:auto; padding:14px 16px; }
aside h3{ font-size:14px; margin-bottom:2px; }
aside .k{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em;
  font-weight:700; margin:12px 0 4px; display:flex; align-items:center; gap:6px; }
aside .row{ display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; border-top:1px solid var(--line); }
aside .note{ font-size:12px; color:var(--muted); line-height:1.5; margin-top:6px; }
aside table.ptab{ border-collapse:collapse; width:100%; font-size:11.5px; margin-top:2px; }
aside table.ptab th{ text-align:left; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--muted); font-weight:700; padding:2px 8px 2px 0; border-bottom:1px solid var(--line); }
aside table.ptab td{ padding:2.5px 8px 2.5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
aside .cid{ font-size:10px; font-weight:800; color:var(--accent); }
aside .st-pass{ color:var(--ok); font-weight:700; } aside .st-red{ color:var(--red); font-weight:700; }
aside .chip{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:999px; padding:0 8px; }
.lbl{ font-size:12px; font-weight:650; text-anchor:middle; fill:var(--ink); pointer-events:none; }
.plabel{ font-size:8.5px; text-anchor:middle; fill:var(--ink); pointer-events:none; }
.sub2{ font-size:10px; text-anchor:middle; fill:var(--muted); pointer-events:none; }
.halo{ fill:transparent; stroke:var(--line); stroke-width:1; opacity:.55; pointer-events:none; }
.flowdot{ pointer-events:none; }
.e-w{ fill:none; }
.red-ring{ fill:none; stroke:var(--red); stroke-width:2; stroke-dasharray:5 3; }
.heat-ring{ fill:none; stroke:var(--heat); stroke-width:2.4; opacity:.85; }
.blast-ring{ fill:none; stroke:var(--heat); stroke-width:1.3; stroke-dasharray:3 3; opacity:.7; }
.ok-ring{ fill:none; stroke:var(--ok); stroke-width:2; }
.drift-ring{ fill:none; stroke:var(--drift); stroke-width:2; stroke-dasharray:2 3; }
@keyframes pulse{ 0%,100%{ stroke-opacity:.95; } 50%{ stroke-opacity:.4; } }
.red-ring,.heat-ring,.drift-ring{ animation:pulse 1.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .red-ring,.heat-ring,.drift-ring{ animation:none; } }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%">
    <h1>Change graph</h1>
    <span class="sub">how the station reads AFTER the merge — one change in flight, walked beat by beat · EXAMPLE over the gustify fixture</span>
    <div class="seg" id="stages">
      <button data-st="red" class="on">1 · Red</button>
      <button data-st="execute">2 · Execute</button>
      <button data-st="review">3 · Review</button>
      <button data-st="commit">4 · Commit</button>
    </div>
    <button id="themebtn" class="tgl" title="Theme — light / dark"><svg viewBox='0 0 24 24' width='16' height='16'><path d='M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z' fill='none' stroke='currentColor' stroke-width='2'/></svg></button>
  </div>
</header>
<div class="wrap">
  <div id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>
    <div class="fixture">EXAMPLE · a dietary-profile change (allergen + auth declared) · the real station rides GABE_SIM + the beat tail</div>
  </div>
  <aside id="panel"></aside>
</div>

<script src="./level-lab.data.js"></script>
<script>
"use strict";
var NS="http://www.w3.org/2000/svg";
function E(t,a){ var e=document.createElementNS(NS,t); for(var k in (a||{})) e.setAttribute(k,a[k]); return e; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function rnd(v){ return Math.round(v*100)/100; }
var D=window.GABE_LEVELS, COLORS=D.colors||{};
var vp=document.getElementById("vp"), panel=document.getElementById("panel"),
    stage=document.getElementById("stage"), svg=document.getElementById("canvas");

/* ── the lab grammar essentials (halo trim · bowed wires · dots · icons) ── */
var HALO_R=14, BOW=2;
function curve(x1,y1,x2,y2,bow){ var dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy)||1;
  bow=bow*BOW;
  if(d>3*HALO_R){ var ux=dx/d, uy=dy/d;
    x1+=ux*HALO_R; y1+=uy*HALO_R; x2-=ux*HALO_R; y2-=uy*HALO_R;
    dx=x2-x1; dy=y2-y1; d=Math.hypot(dx,dy)||1; }
  var mx=(x1+x2)/2 - dy/d*bow, my=(y1+y2)/2 + dx/d*bow;
  return "M"+rnd(x1)+" "+rnd(y1)+" Q "+rnd(mx)+" "+rnd(my)+" "+rnd(x2)+" "+rnd(y2); }
function halo(g){ g.insertBefore(E("circle",{class:"halo", r:HALO_R}), g.firstChild); }
var REDUCED=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var _fn=0;
function flowDots(host, pathEl, fill){
  var len=0; try{ len=pathEl.getTotalLength(); }catch(_){ return; }
  if(!len) return;
  if(!pathEl.id) pathEl.id="cgf"+(++_fn);
  var dur=Math.max(1.6, len/55);
  var dot=E("circle",{class:"flowdot", r:"2.1", fill:fill});
  if(REDUCED){ var q=pathEl.getPointAtLength(len*0.62);
    dot.setAttribute("cx",rnd(q.x)); dot.setAttribute("cy",rnd(q.y)); }
  else { var am=E("animateMotion",{dur:dur.toFixed(2)+"s", repeatCount:"indefinite", rotate:"none"});
    var mp=E("mpath"); mp.setAttribute("href","#"+pathEl.id); am.appendChild(mp); dot.appendChild(am); }
  host.appendChild(dot); }
function cylinder(g,r,col){ g.appendChild(E("ellipse",{cx:0,cy:-r*0.62,rx:r,ry:r*0.38,fill:col}));
  var b=E("path",{d:"M"+(-r)+" "+(-r*0.62)+" v"+(r*1.24)+" a"+r+" "+(r*0.38)+" 0 0 0 "+(2*r)+" 0 v-"+(r*1.24), fill:col});
  g.appendChild(b); }
function sBadge(g,r,col){ g.appendChild(E("path",{d:"M"+(-r*0.5)+" "+(-r)+" h-1 a2 2 0 0 0 -2 2 v"+(r*0.6)+" a2 2 0 0 1 -2 2 a2 2 0 0 1 2 2 v"+(r*0.6)+" a2 2 0 0 0 2 2 h1 M"+(r*0.5)+" "+(-r)+" h1 a2 2 0 0 1 2 2 v"+(r*0.6)+" a2 2 0 0 0 2 2 a2 2 0 0 0 -2 2 v"+(r*0.6)+" a2 2 0 0 1 -2 2 h-1",
  fill:"none", stroke:col, "stroke-width":"1.8"})); }
function fGlyph(g,r,col,handler){ if(handler) g.appendChild(E("circle",{r:r+2.5, fill:"none", stroke:col, "stroke-width":"2"}));
  g.appendChild(E("path",{d:"M-2 "+(r*0.8)+" c2 0 3 -1 3 -3 v-"+(r*0.8)+" c0 -2 1 -3 3 -3 M-3 0 h6",
    fill:"none", stroke:col, "stroke-width":"2"})); }
var METHOD={GET:"var(--m-get)", POST:"var(--m-post)", PATCH:"var(--m-put)", PUT:"var(--m-put)", DELETE:"var(--m-delete)"};
function epMark(g,r,m){ g.appendChild(E("circle",{r:r+2, fill:METHOD[m]||"var(--muted)"}));
  g.appendChild(E("path",{d:"M1 "+(-r+1)+" L-2.6 1 h2 L-1 "+(r-1)+" L2.6 -1 h-2 Z", fill:"#fff"})); }
function pill(g,y,n,red){ var w=n>9?15:11;
  g.appendChild(E("rect",{class:"tpill", x:y-2, y:-y-8, width:w, height:10, rx:5,
    fill:red?"var(--red)":"var(--ok)"}));
  var t=E("text",{class:"tpill", x:y-2+w/2, y:-y, "text-anchor":"middle",
    "font-size":"7.5","font-weight":"800", fill:"#fff"}); t.textContent=String(n); g.appendChild(t); }
function twoRow(g, s, y){ s=String(s); var r1=s.slice(0,10), r2=s.slice(10,20)+(s.length>20?"…":"");
  var t1=E("text",{class:"plabel", y:y}); t1.textContent=r1; g.appendChild(t1);
  if(s.length>10){ var t2=E("text",{class:"plabel", y:y+9}); t2.textContent=r2; g.appendChild(t2); } }
function edgeGradient(defs,a,c,s,t2){ var id="cg"+(++_fn);
  var g=E("linearGradient",{id:id, gradientUnits:"userSpaceOnUse", x1:a.x,y1:a.y,x2:c.x,y2:c.y});
  g.appendChild(E("stop",{offset:"0%","stop-color":s})); g.appendChild(E("stop",{offset:"100%","stop-color":t2}));
  defs.appendChild(g); return id; }

/* ── THE CHANGE (example, shaped like GABE_SIM): declared vs touched vs blast ── */
var CHANGE={
  name:"dietary-profile preferences rework",
  declared:["allergen","auth"],
  cases:[
    {cid:"C901", name:"patch_preferences_rejects_unknown_restriction_code_C901", target:"cls:allergen|PreferencesPatch"},
    {cid:"C902", name:"dietary_profile_upsert_is_idempotent_C902", target:"cls:allergen|UserDietaryProfile"},
    {cid:"C903", name:"settings_roundtrip_preserves_household_format_C903", target:"ep:auth|PATCH /settings/preferences"},
    {cid:"C904", name:"exploration_patch_updates_profile_C904", target:"fn:auth|patch_exploration"}
  ],
  touched:["cls:allergen|UserDietaryProfile","cls:allergen|PreferencesPatch",
           "ep:auth|PATCH /settings/preferences","fn:auth|patch_preferences","fn:auth|patch_exploration"],
  drift:[{key:"fn:cooking|post_start_session", why:"uses UserDietaryProfile — outside the declared set"}]
};

/* ── the SCENE: the change's neighbourhood, lab-grammar rendering ── */
var pos={}, nodeEl={};
function build(){
  vp.textContent="";
  var defs=E("defs"), contL=E("g"), wireL=E("g"), nodeL=E("g"), ringL=E("g");
  vp.appendChild(defs); vp.appendChild(contL); vp.appendChild(wireL); vp.appendChild(nodeL); vp.appendChild(ringL);
  var ENTS=[
    {slug:"allergen", x:-260, y:40, r:150, items:[
      {key:"cls:allergen|UserDietaryProfile", kind:"model", name:"UserDietaryProfile", dx:0, dy:-40},
      {key:"cls:allergen|PreferencesPatch", kind:"schema", name:"PreferencesPatch", dx:-70, dy:50},
      {key:"cls:allergen|ExplorationPreferencesInput", kind:"schema", name:"ExplorationPrefs…", dx:70, dy:55}]},
    {slug:"auth", x:250, y:-60, r:170, items:[
      {key:"fn:auth|patch_preferences", kind:"fn", name:"patch_preferences", handler:true, dx:-40, dy:-10},
      {key:"fn:auth|patch_exploration", kind:"fn", name:"patch_exploration", handler:true, dx:75, dy:40},
      {key:"cls:auth|User", kind:"model", name:"User", dx:30, dy:-90}]},
    {slug:"cooking", x:120, y:270, r:110, items:[
      {key:"fn:cooking|post_start_session", kind:"fn", name:"post_start_sess…", handler:true, dx:0, dy:8}]}
  ];
  var eps=[{key:"ep:auth|PATCH /settings/preferences", m:"PATCH", p:"settings/preferences", ent:1, ang:2.6},
           {key:"ep:auth|PATCH /settings/exploration", m:"PATCH", p:"settings/exploration", ent:1, ang:0.6}];
  ENTS.forEach(function(en){ var col=COLORS[en.slug]||"#888";
    contL.appendChild(E("circle",{cx:en.x, cy:en.y, r:en.r, fill:col, "fill-opacity":"0.05",
      stroke:col, "stroke-opacity":"0.6", "stroke-width":"1.4"}));
    var lb=E("text",{class:"lbl", x:en.x, y:en.y-en.r-10}); lb.textContent=en.slug;
    lb.setAttribute("fill",col); contL.appendChild(lb);
    en.items.forEach(function(it){ var x=en.x+it.dx, y=en.y+it.dy;
      pos[it.key]={x:x,y:y};
      var g=E("g",{transform:"translate("+x+","+y+")"});
      halo(g);
      if(it.kind==="model") cylinder(g,8,"var(--c-model)");
      else if(it.kind==="schema") sBadge(g,7,"var(--c-schema)");
      else fGlyph(g,8.5, it.handler?"var(--c-fn-api)":"var(--c-fn-services)", it.handler);
      g.appendChild(E("circle",{cx:-10, cy:-9, r:2.6, fill:col}));
      twoRow(g, it.name, 17);
      nodeL.appendChild(g); nodeEl[it.key]=g; }); });
  eps.forEach(function(ep){ var en=ENTS[ep.ent];
    var x=rnd(en.x+en.r*Math.cos(ep.ang)), y=rnd(en.y+en.r*Math.sin(ep.ang));
    pos[ep.key]={x:x,y:y};
    var g=E("g",{transform:"translate("+x+","+y+")"});
    halo(g); epMark(g,6.5,ep.m); twoRow(g, ep.p, 17);
    nodeL.appendChild(g); nodeEl[ep.key]=g; });
  // wires: route → handler → data · uses across entities (bowed, trimmed, dotted)
  var W=[
    ["ep:auth|PATCH /settings/preferences","fn:auth|patch_preferences","route","auth"],
    ["ep:auth|PATCH /settings/exploration","fn:auth|patch_exploration","route","auth"],
    ["fn:auth|patch_preferences","cls:allergen|PreferencesPatch","use",null],
    ["fn:auth|patch_preferences","cls:allergen|UserDietaryProfile","use",null],
    ["fn:auth|patch_exploration","cls:allergen|ExplorationPreferencesInput","use",null],
    ["fn:auth|patch_exploration","cls:allergen|UserDietaryProfile","use",null],
    ["cls:allergen|UserDietaryProfile","cls:auth|User","xfk",null],
    ["fn:cooking|post_start_session","cls:allergen|UserDietaryProfile","use",null]
  ];
  W.forEach(function(w,i){ var a=pos[w[0]], b=pos[w[1]]; if(!a||!b) return;
    var sSlug=w[0].split(":")[1].split("|")[0], tSlug=w[1].split(":")[1].split("|")[0];
    var p=E("path",{class:"e-w","stroke-width":w[2]==="xfk"?"1.8":"1.3",
      "stroke-dasharray":w[2]==="use"?"1.5 3.5":(w[2]==="xfk"?"2 5":""),
      d:curve(a.x,a.y,b.x,b.y,(i%2?26:-26))});
    var fill;
    if(sSlug!==tSlug){ var gr=edgeGradient(defs,a,b,COLORS[sSlug]||"#888",COLORS[tSlug]||"#888");
      p.style.stroke="url(#"+gr+")"; p.style.opacity="0.85"; fill="url(#"+gr+")"; }
    else { p.style.stroke=COLORS[sSlug]||"#888"; p.style.opacity="0.75"; fill=COLORS[sSlug]||"#888"; }
    wireL.appendChild(p); flowDots(wireL, p, fill); });
  window.__ringL=ringL;
}

/* ── THE BEATS: one diagram, four lenses ── */
var STAGE_TEXT={
  red:{ t:"1 · /gabe-red — declare and prove RED",
    n:"The beat names its cases (C-ids minted against the corpus) and proves each one FAILS before any source edit. Declared targets ring red; every pill is red by construction.",
    rows:function(){ return CHANGE.cases.map(function(c){ return [c.cid, c.name, "red"]; }); } },
  execute:{ t:"2 · /gabe-execute — the change lands",
    n:"Touched pieces heat up as the phase edits them; the blast radius (FK + use hops from the touched set) shows what the change can reach. The declared cases flip as work completes.",
    rows:function(){ return CHANGE.touched.map(function(k){ return ["", k.split("|")[1], "touched"]; }); } },
  review:{ t:"3 · /gabe-review — drift priced",
    n:"Green pills = the red cases now pass. The amber dashed ring is ENTITY DRIFT: cooking.post_start_session reads UserDietaryProfile but cooking was never declared — the review prices it (extend the declaration, or split the change).",
    rows:function(){ return CHANGE.cases.map(function(c){ return [c.cid, c.name, "pass"]; })
      .concat(CHANGE.drift.map(function(d){ return ["", d.key.split("|")[1]+" — "+d.why, "drift"]; })); } },
  commit:{ t:"4 · /gabe-commit — the checkpoint",
    n:"All declared cases green, the trailer carries Cases: C901–C904 · Class: feature. The graph returns to rest; the archive station will replay this change as history.",
    rows:function(){ return [["", "checkpoint · Cases: C901 C902 C903 C904 · Class: feature", "pass"]]; } }
};
var curStage="red";
function ring(key, cls, r){ var g=nodeEl[key]; if(!g) return;
  var m=/translate\(([-0-9.]+),([-0-9.]+)\)/.exec(g.getAttribute("transform"));
  window.__ringL.appendChild(E("circle",{class:cls, cx:+m[1], cy:+m[2], r:r||19})); }
function pillOn(key, n, red){ var g=nodeEl[key]; if(!g) return;
  pill(g, 9, n, red); }
function clearStage(){
  window.__ringL.textContent="";
  document.querySelectorAll("#canvas .tpill").forEach(function(x){ x.remove(); }); }
function applyStage(st){
  curStage=st; clearStage();
  document.querySelectorAll("#stages button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-st")===st); });
  if(st==="red"){
    CHANGE.cases.forEach(function(c){ ring(c.target, "red-ring"); });
    var per={}; CHANGE.cases.forEach(function(c){ per[c.target]=(per[c.target]||0)+1; });
    Object.keys(per).forEach(function(k){ pillOn(k, per[k], true); });
  } else if(st==="execute"){
    CHANGE.touched.forEach(function(k){ ring(k, "heat-ring"); });
    ["cls:auth|User","cls:allergen|ExplorationPreferencesInput","fn:cooking|post_start_session",
     "ep:auth|PATCH /settings/exploration"].forEach(function(k){ ring(k, "blast-ring", 23); });
  } else if(st==="review"){
    var per2={}; CHANGE.cases.forEach(function(c){ per2[c.target]=(per2[c.target]||0)+1; });
    Object.keys(per2).forEach(function(k){ ring(k, "ok-ring"); pillOn(k, per2[k], false); });
    CHANGE.drift.forEach(function(d){ ring(d.key, "drift-ring", 22); });
  } else if(st==="commit"){
    CHANGE.touched.forEach(function(k){ ring(k, "ok-ring"); });
  }
  var S=STAGE_TEXT[st];
  var h="<h3>"+esc(CHANGE.name)+"</h3>"
    +"<div class='note'>"+esc(S.t)+"</div>"
    +"<div class='row'><span>declared</span><b>"+CHANGE.declared.join(" · ")+"</b></div>"
    +"<div class='row'><span>cases</span><b>"+CHANGE.cases.length+" (C901–C904)</b></div>"
    +"<div class='k'>this beat</div><div class='note'>"+esc(S.n)+"</div>"
    +"<div class='k'>ledger</div><table class='ptab'><tr><th>case</th><th>what</th><th>state</th></tr>";
  S.rows().forEach(function(r){
    var cls = r[2]==="pass" ? "st-pass" : (r[2]==="red" ? "st-red" : (r[2]==="drift" ? "st-red" : ""));
    h+="<tr><td>"+(r[0]?"<span class='cid'>"+r[0]+"</span>":"")+"</td><td>"+esc(r[1])+"</td>"
      +"<td class='"+cls+"'>"+esc(r[2])+"</td></tr>"; });
  h+="</table>"
    +"<div class='note' style='margin-top:10px'>In the real station these come from GABE_SIM (the beat tail's in-flight projection), the archmap, and the junit captures — this page is the RENDER contract, not the data plumbing.</div>";
  panel.innerHTML=h;
}

/* ── camera: fit + the wheel grammar's pan/zoom core ── */
var panX=0, panY=0, zoom=1, fitT=[0,0], baseScale=1;
function apply(){ vp.setAttribute("transform","translate("+(fitT[0]+panX)+","+(fitT[1]+panY)+") scale("+(baseScale*zoom)+")"); }
function fit(){
  var bb={minX:-460,minY:-280,maxX:470,maxY:420};
  var w=stage.clientWidth, h=stage.clientHeight;
  baseScale=Math.min(w/(bb.maxX-bb.minX), h/(bb.maxY-bb.minY))*0.94;
  fitT=[w/2-(bb.minX+bb.maxX)/2*baseScale, h/2-(bb.minY+bb.maxY)/2*baseScale];
  apply(); }
stage.addEventListener("wheel",function(e){ e.preventDefault();
  if(e.ctrlKey||e.metaKey){
    var r=stage.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    var s1=baseScale*zoom, wx=(mx-(fitT[0]+panX))/s1, wy=(my-(fitT[1]+panY))/s1;
    zoom*=Math.exp(-e.deltaY*0.0022);
    var s2=baseScale*zoom;
    panX=mx-fitT[0]-wx*s2; panY=my-fitT[1]-wy*s2;
  } else if(e.shiftKey){ panX-=(e.deltaY+e.deltaX); }
  else { panX-=e.deltaX; panY-=e.deltaY; }
  apply(); },{passive:false});
window.addEventListener("resize",fit);

document.getElementById("stages").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return; applyStage(b.getAttribute("data-st")); });
document.getElementById("themebtn").addEventListener("click",function(){
  var r=document.documentElement, cur=r.getAttribute("data-theme");
  var dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark"); });

build(); fit(); applyStage("red");
window.__cgtest={
  stage:function(){ return curStage; },
  set:function(s){ applyStage(s); },
  counts:function(){ return {
    rings: vp.querySelectorAll(".red-ring,.heat-ring,.ok-ring,.drift-ring,.blast-ring").length,
    red: vp.querySelectorAll(".red-ring").length,
    heat: vp.querySelectorAll(".heat-ring").length,
    blast: vp.querySelectorAll(".blast-ring").length,
    okr: vp.querySelectorAll(".ok-ring").length,
    drift: vp.querySelectorAll(".drift-ring").length,
    pills: vp.querySelectorAll(".tpill").length,
    halos: vp.querySelectorAll(".halo").length,
    dots: vp.querySelectorAll(".flowdot").length }; }
};
window.__cgready=true;
</script>
