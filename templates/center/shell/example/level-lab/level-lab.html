<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level lab — codebase-graph levels & symbol grammar (gustify example)</title>
<style>
/* ── LEVEL LAB — a display DESIGN lab, not a station: the level-navigation model
   (Entities → Pieces → Functions → Layers) with the symbol grammar the operator
   specified: models = DB cylinders · schemas = S badges · functions = F glyphs
   coloured by layer · API endpoints as method-coloured markers ON the entity
   border (the entity's surface). Edge grammar: fk solid · calls dashed+moving ·
   imports dotted; cross-file calls render DASHED because graft marks every one
   of them confidence:inferred — the dash IS the trust encoding (a floor, not a
   census). Data: level-lab.data.js, an EXAMPLE FIXTURE derived read-only from
   gustify (archmap + graft index) — see its `note`. ── */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#141a24; --muted:#7a8595; --line:#e7e9ee;
  --accent:#4f46e5; --edge:#9aa3ad;
  --c-model:#12b886; --c-schema:#f59f00; --c-fn-api:#4c6ef5; --c-fn-services:#0f766e; --c-fn-web:#e8590c;
  --m-get:#16794c; --m-post:#4338ca; --m-put:#b45309; --m-delete:#d1443c;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#101726; --panel:#1b2436; --ink:#e7ebf3; --muted:#79839a; --line:#2c3648;
  --accent:#8b83f5; --edge:#4a525c; } }
*{ box-sizing:border-box; margin:0; }
body{ background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,sans-serif;
  height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; position:relative;
  padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
header h1{ font-size:15px; font-weight:650; }
header .sub{ font-size:12px; color:var(--muted); }
.seg{ display:flex; gap:5px; margin-left:auto; }
.seg button{ font:inherit; font-size:12.5px; font-weight:600; color:var(--muted);
  background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 13px; cursor:pointer; }
.seg button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
.wrap{ flex:1; min-height:0; display:flex; }
#stage{ flex:1; min-width:0; position:relative; cursor:grab; overflow:hidden; }
#stage:active{ cursor:grabbing; }
svg{ display:block; width:100%; height:100%; }
aside{ width:300px; flex:none; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px 16px; }
aside h3{ font-size:14px; margin-bottom:2px; }
aside .k{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin:12px 0 4px; }
aside .row{ display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; border-top:1px solid var(--line); }
aside .note{ font-size:12px; color:var(--muted); line-height:1.5; margin-top:10px; }
.epmore{ pointer-events:auto !important; }   /* .sub2 kills pointer-events — the expander must stay clickable */
.legend{ display:flex; gap:8px 18px; flex-wrap:wrap; align-items:center;
  padding:7px 18px; border-top:1px solid var(--line); background:var(--panel);
  font-size:11.5px; color:var(--muted); }
.legend .it{ display:inline-flex; align-items:center; gap:6px; }
.legend svg{ width:16px; height:14px; }
/* node vocab */
.entnode circle.body{ transition:opacity .25s; }
.lbl{ font-size:12px; font-weight:650; text-anchor:middle; fill:var(--ink); pointer-events:none; }
.sub2{ font-size:10px; text-anchor:middle; fill:var(--muted); pointer-events:none; }
.plabel{ font-size:8.5px; text-anchor:middle; fill:var(--ink); pointer-events:none; }
.container{ fill-opacity:.05; stroke-opacity:.5; stroke-width:1.4; stroke-dasharray:4 4; }
.piece, .epmark, .fnode{ cursor:pointer; }
/* edges */
.e-fk{ fill:none; stroke:var(--edge); stroke-width:1.8; }
.e-calls{ fill:none; stroke:var(--accent); stroke-width:1.6; stroke-dasharray:6 5;
  animation:dashmove 1.6s linear infinite; }
.e-imports{ fill:none; stroke:var(--muted); stroke-width:1.4; stroke-dasharray:2 4; }
.e-touch{ fill:none; stroke:var(--edge); stroke-width:1; opacity:.55; }
@keyframes dashmove{ to{ stroke-dashoffset:-22; } }
@media (prefers-reduced-motion: reduce){ .e-calls{ animation:none; } }
.dim{ opacity:.12; }
.hint{ position:absolute; bottom:10px; right:14px; font-size:11px; color:var(--muted);
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:3px 9px; pointer-events:none; }
.fixture{ position:absolute; top:10px; left:14px; font-size:10.5px; color:var(--muted);
  background:var(--panel); border:1px dashed var(--line); border-radius:6px; padding:2px 9px; pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>Level lab</h1>
  <span class="sub" id="sub">the level-navigation model + symbol grammar, on real gustify data</span>
  <div class="seg" id="levels">
    <button data-lvl="entities" class="on">1 · Entities</button>
    <button data-lvl="pieces">2 · Pieces</button>
    <button data-lvl="functions">3 · Functions</button>
    <button data-lvl="layers">4 · Layers</button>
    <button data-lvl="trace">5 · Trace</button>
  </div>
  <button id="gear" title="Layout controls" aria-expanded="false" style="font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;display:inline-flex">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <div id="gearpanel" hidden style="position:absolute;z-index:40;top:52px;right:16px;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px">
    <div style="font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Entities layout</div>
    <div class="seg" id="laySeg" style="margin-left:0">
      <button data-lay="ring" class="on">Ring</button>
      <button data-lay="flow">Flow</button>
      <button data-lay="force">Force</button>
    </div>
    <div style="font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:11px 0 6px">Inside layout</div>
    <div class="seg" id="inSeg" style="margin-left:0">
      <button data-in="ring" class="on">Ring</button>
      <button data-in="grid">Grid</button>
      <button data-in="force">Force</button>
      <button data-in="columns">Columns</button>
    </div>
  </div>
</header>
<div class="wrap">
  <div id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#9aa3ad"></path></marker>
        <marker id="arr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#4f46e5"></path></marker>
      </defs>
      <g id="vp"></g>
    </svg>
    <div class="fixture">EXAMPLE FIXTURE · gustify (read-only) · fn call edges dashed = graft confidence:inferred (a floor)</div>
    <div class="hint">drag to pan · scroll to zoom · click anything</div>
  </div>
  <aside id="panel"></aside>
</div>
<div class="legend" id="legend"></div>

<script src="./level-lab.data.js"></script>
<script>
(function(){
"use strict";
var D = window.GABE_LEVELS; if(!D) return;
var NS = "http://www.w3.org/2000/svg";
var COLORS = D.colors || {};
var METHOD = { GET:"var(--m-get)", POST:"var(--m-post)", PUT:"var(--m-put)", PATCH:"var(--m-put)", DELETE:"var(--m-delete)" };
var FNCOL = { api:"var(--c-fn-api)", services:"var(--c-fn-services)", web:"var(--c-fn-web)" };
var level = "entities";
var pos = {};                 // POSITION PERSISTENCE: id → {x,y}, survives level switches
var panX=0, panY=0, zoom=1, fitT=[0,0];
var stage = document.getElementById("stage"), svg = document.getElementById("canvas"),
    vp = document.getElementById("vp"), panel = document.getElementById("panel");

function E(t,a){ var e=document.createElementNS(NS,t); for(var k in (a||{})) e.setAttribute(k,a[k]); return e; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function trunc(s,n){ s=String(s); return s.length>n?s.slice(0,n-1)+"…":s; }

/* ── the symbol grammar (one function per glyph, reused across levels) ── */
function cylinder(g, r, col){            // MODEL = database cylinder
  var h=r*1.5, w=r*1.7;
  g.appendChild(E("path",{d:"M"+(-w/2)+" "+(-h/2+3)+" v"+(h-6)+" a"+(w/2)+" 4 0 0 0 "+w+" 0 v-"+(h-6),
    fill:col, "fill-opacity":"0.9", stroke:"var(--panel)","stroke-width":"1.4"}));
  g.appendChild(E("ellipse",{cx:0, cy:-h/2+3, rx:w/2, ry:4, fill:col, stroke:"var(--panel)","stroke-width":"1.4"}));
}
// the command center's OWN icon geometry (sim-panel KIND_ICON) — the lab speaks
// the suite's icon language: schema = curly braces, function = the ƒ-curve.
var ICO_SCHEMA='M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1 M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1';
var ICO_FN='M9 17c2 0 3-1 3-3v-4c0-2 1-3 3-3 M9 11h6';
function icoPath(g, d, col, scale){
  var p=E("path",{d:d, fill:"none", stroke:col, "stroke-width":"2",
    "stroke-linecap":"round","stroke-linejoin":"round",
    transform:"translate("+(-12*scale)+","+(-12*scale)+") scale("+scale+")"});
  g.appendChild(p);
}
function sBadge(g, r, col){              // SCHEMA = the bare curly-brace icon (no box)
  g.appendChild(E("circle",{r:r+4, fill:"transparent"}));           // invisible hit target
  var p=E("path",{d:ICO_SCHEMA, fill:"none", stroke:col, "stroke-width":"2.4",
    "stroke-linecap":"round","stroke-linejoin":"round",
    transform:"translate("+(-r)+","+(-r)+") scale("+(2*r/24)+")"});
  g.appendChild(p);
}
function fGlyph(g, r, col, handler, god){ // FUNCTION = the bare ƒ-curve icon (no circle);
  g.appendChild(E("circle",{r:r+4, fill:"transparent"}));           // invisible hit target
  var p=E("path",{d:ICO_FN, fill:"none", stroke:col,
    "stroke-width": handler?"3.1":"2.2",                            // thicker stroke = handler
    "stroke-linecap":"round","stroke-linejoin":"round",
    transform:"translate("+(-r*1.2)+","+(-r*1.2)+") scale("+(2.4*r/24)+")"});
  g.appendChild(p);
  if(god) g.appendChild(E("circle",{cx:r*0.9, cy:-r*0.9, r:3, fill:"var(--m-delete)"}));  // red dot = god fn
}
function epMark(g, r, method){           // ENDPOINT = method-coloured border marker
  var col = METHOD[method]||"var(--muted)";
  g.appendChild(E("circle",{r:r, fill:col, stroke:"var(--panel)","stroke-width":"1.6"}));
  g.appendChild(E("path",{d:"M1.4 "+(-r*0.62)+" L"+(-r*0.5)+" 0.6 L0.2 0.6 L-1 "+(r*0.66)+" L"+(r*0.56)+" -0.4 L0 -0.4 Z",
    fill:"#fff", transform:"scale("+(r/6)+")"}));
}

/* ── pan/zoom (shared) ── */
function frame(b){ var cw=stage.clientWidth||900, ch=stage.clientHeight||600;
  svg.setAttribute("width",cw); svg.setAttribute("height",ch);
  var sx=(cw-40)/Math.max(1,b.maxX-b.minX), sy=(ch-40)/Math.max(1,b.maxY-b.minY);
  var s=Math.min(1, sx, sy);
  fitT=[Math.round(cw/2 - s*zoomless((b.minX+b.maxX)/2)), Math.round(ch/2 - s*zoomless((b.minY+b.maxY)/2))];
  baseScale=s; apply(); }
var baseScale=1;
function zoomless(v){ return v; }
function apply(){ vp.setAttribute("transform","translate("+(fitT[0]+panX)+","+(fitT[1]+panY)+") scale("+(baseScale*zoom)+")"); }
(function(){ var pan=null;
  stage.addEventListener("pointerdown",function(e){ if(e.target.closest(".piece,.epmark,.fnode,.entnode")) return;
    pan={x:e.clientX,y:e.clientY,px:panX,py:panY}; });
  window.addEventListener("pointermove",function(e){ if(!pan) return; panX=pan.px+(e.clientX-pan.x); panY=pan.py+(e.clientY-pan.y); apply(); });
  window.addEventListener("pointerup",function(){ pan=null; });
  stage.addEventListener("wheel",function(e){ e.preventDefault();
    zoom=Math.max(0.3,Math.min(4, zoom*Math.exp(-e.deltaY*0.0014))); apply(); },{passive:false});
})();

/* ── layouts (deterministic; positions persist per id across levels) ── */
function rnd(v){ return Math.round(v*100)/100; }         // kill 1e-14 float dust in transforms
function ringPos(ids, R, cx, cy){ ids.forEach(function(id,i){
  if(pos[id]) return;                                    // persistence: never re-scatter
  var a=-Math.PI/2 + 2*Math.PI*i/ids.length;
  pos[id]={x:rnd(cx+R*Math.cos(a)), y:rnd(cy+R*Math.sin(a))}; }); }

var ENTS = D.entities.map(function(e){ return e.slug; });
var entLayout = "ring", insideLayout = "ring";
var expandedEps = {};        // slug → true when the entity's FULL endpoint list shows

/* inner arrangement for a list of items around (cx,cy): Ring · Grid · Force · Columns.
   opts.edges = [[idA,idB],…] coupling pairs — FORCE ATTRACTS COUPLED ITEMS (without
   edges, repulsion+centering just converges back to a ring — the archive station's
   own measured lesson); opts.groups = id→group for the Columns arrangement. */
function insidePos(items, cx, cy, opts){
  opts=opts||{}; var n=items.length||1, out={};
  if(insideLayout==="grid"){ var cols=Math.ceil(Math.sqrt(n)), GX=52, GY=46, rows=Math.ceil(n/cols);
    items.forEach(function(id,i){ var r=Math.floor(i/cols), c=i%cols;
      out[id]={x:rnd(cx+(c-(cols-1)/2)*GX), y:rnd(cy+(r-(rows-1)/2)*GY)}; }); }
  else if(insideLayout==="columns"){
    var groups={}, order=[];
    items.forEach(function(id){ var g=(opts.groups||{})[id]||"other";
      if(!groups[g]){ groups[g]=[]; order.push(g); } groups[g].push(id); });
    order.forEach(function(g,ci){ var col=groups[g], x=cx+(ci-(order.length-1)/2)*110;
      col.forEach(function(id,ri){ out[id]={x:rnd(x), y:rnd(cy+(ri-(col.length-1)/2)*44)}; }); }); }
  else if(insideLayout==="force"){ var P={},V={},idx={};
    items.forEach(function(id,i){ idx[id]=1; var a=2*Math.PI*i/n, R0=Math.max(36,n*8);
      P[id]={x:R0*Math.cos(a),y:R0*Math.sin(a)}; V[id]={x:0,y:0}; });
    var E2=(opts.edges||[]).filter(function(e){ return idx[e[0]]&&idx[e[1]]&&e[0]!==e[1]; });
    for(var it=0;it<150;it++){ for(var i=0;i<n;i++)for(var j=i+1;j<n;j++){
        var a=items[i],b=items[j],dx=P[a].x-P[b].x,dy=P[a].y-P[b].y,d2=dx*dx+dy*dy+40,d=Math.sqrt(d2),f=2200/d2;
        V[a].x+=dx/d*f;V[a].y+=dy/d*f;V[b].x-=dx/d*f;V[b].y-=dy/d*f; }
      E2.forEach(function(e){ var a=e[0],b=e[1],dx=P[b].x-P[a].x,dy=P[b].y-P[a].y,
        d=Math.hypot(dx,dy)||1,f=0.045*(d-52);
        V[a].x+=dx/d*f;V[a].y+=dy/d*f;V[b].x-=dx/d*f;V[b].y-=dy/d*f; });
      items.forEach(function(id){ V[id].x=(V[id].x-P[id].x*0.02)*0.85; V[id].y=(V[id].y-P[id].y*0.02)*0.85;
        P[id].x+=V[id].x; P[id].y+=V[id].y; }); }
    items.forEach(function(id){ out[id]={x:rnd(cx+P[id].x), y:rnd(cy+P[id].y)}; }); }
  else { var R=Math.max(42,n*7.8);
    items.forEach(function(id,i){ var a=-Math.PI/2+2*Math.PI*i/n;
      out[id]={x:rnd(cx+R*Math.cos(a)), y:rnd(cy+R*Math.sin(a))}; }); }
  return out;
}
function innerExtent(ipos, cx, cy){ var m=0;
  Object.keys(ipos).forEach(function(k){ m=Math.max(m, Math.hypot(ipos[k].x-cx, ipos[k].y-cy)); }); return m; }

/* DECLUTTER: scale entity anchors out from their centroid until no two container
   circles overlap (radii passed per slug). Scale-up only — never shrinks.
   SUPPRESSED during a drag: the user's placement wins over the no-overlap rule
   (they can always drop things apart themselves). */
var suppressDeclutter=false;
function declutterAnchors(radii){
  if(suppressDeclutter) return;
  var cx=0, cy=0; ENTS.forEach(function(s){ cx+=pos["ent:"+s].x; cy+=pos["ent:"+s].y; });
  cx/=ENTS.length; cy/=ENTS.length;
  var scale=1;
  for(var i=0;i<ENTS.length;i++) for(var j=i+1;j<ENTS.length;j++){
    var a=ENTS[i], b=ENTS[j],
        d=Math.hypot(pos["ent:"+a].x-pos["ent:"+b].x, pos["ent:"+a].y-pos["ent:"+b].y)||1,
        need=(radii[a]||60)+(radii[b]||60)+34;
    if(d*scale<need) scale=need/d; }
  if(scale<=1.001) return;
  ENTS.forEach(function(s){ var p=pos["ent:"+s];
    pos["ent:"+s]={x:rnd(cx+(p.x-cx)*scale), y:rnd(cy+(p.y-cy)*scale)}; });
}

/* DRAG an entity anchor (any level that renders per-entity groups) */
function wireEntityDrag(el, slug){
  el.addEventListener("pointerdown", function(e){
    e.preventDefault(); e.stopPropagation();
    var start={x:e.clientX, y:e.clientY}, o=pos["ent:"+slug], origin={x:o.x, y:o.y}, moved=false;
    function mv(ev){ var s=baseScale*zoom,
        dx=(ev.clientX-start.x)/s, dy=(ev.clientY-start.y)/s;
      if(!moved && Math.abs(dx)+Math.abs(dy)<3) return; moved=true;
      pos["ent:"+slug]={x:rnd(origin.x+dx), y:rnd(origin.y+dy)};
      Object.keys(pos).forEach(function(k){ if(k.indexOf("fn:")===0) delete pos[k]; });
      suppressDeclutter=true; try{ renderKeepView(); } finally{ suppressDeclutter=false; } }
    function up(){ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up);
      if(!moved && el.__click) el.__click(); }
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); });
}

/* ── entity layouts: Ring · Flow (FK-DAG longest-path columns) · Force ── */
function fkPairs(){ var out=[]; D.l1_edges.forEach(function(e){ if((e.kinds||{}).fk) out.push([e.s,e.t]); }); return out; }
function computeEntityPositions(){
  Object.keys(pos).forEach(function(k){                    // anchors move → clusters follow
    if(k.indexOf("ent:")===0 || k.indexOf("fn:")===0) delete pos[k]; });
  if(entLayout==="flow"){                                  // FK-only DAG, cycle-safe
    var depth={}; ENTS.forEach(function(s){ depth[s]=0; });
    var edges=fkPairs(), changed=true, guard=0;
    while(changed && guard++<50){ changed=false;
      edges.forEach(function(p){ if(depth[p[0]]<depth[p[1]]+1 && depth[p[0]]<ENTS.length){ depth[p[0]]=depth[p[1]]+1; changed=true; } }); }
    var cols={}; ENTS.forEach(function(s){ (cols[depth[s]]=cols[depth[s]]||[]).push(s); });
    Object.keys(cols).sort(function(a,b){return a-b;}).forEach(function(d){
      cols[d].sort().forEach(function(s,i){ pos["ent:"+s]={x:rnd(d*260-260), y:rnd((i-(cols[d].length-1)/2)*170)}; }); });
  } else if(entLayout==="force"){                          // angle-seeded, deterministic
    var P={}, V={}, n=ENTS.length;
    ENTS.forEach(function(s,i){ var a=2*Math.PI*i/n; P[s]={x:280*Math.cos(a),y:280*Math.sin(a)}; V[s]={x:0,y:0}; });
    var E2=fkPairs();
    for(var it=0; it<240; it++){
      for(var i=0;i<n;i++) for(var j=i+1;j<n;j++){ var a=ENTS[i],b=ENTS[j],
        dx=P[a].x-P[b].x, dy=P[a].y-P[b].y, d2=dx*dx+dy*dy+60, d=Math.sqrt(d2), f=13000/d2;
        V[a].x+=dx/d*f; V[a].y+=dy/d*f; V[b].x-=dx/d*f; V[b].y-=dy/d*f; }
      E2.forEach(function(p){ var a=p[0],b=p[1], dx=P[b].x-P[a].x, dy=P[b].y-P[a].y,

/* ── edge draw helper: one path per KIND between two points, arrowed ── */
function kindPath(layer, a, b, kind, off){

}

function innerArrangement(slug, cx, cy){

  var ids=inner.map(function(it,i){ return slug+"|p"+i; });

  var edges=(pc.intra||[]).map(function(e){ return [byCls[e.s], byCls[e.t]]; })

    layer.appendChild(E("rect",{x:X0-30, y:Y-24, width:920, height:H, rx:14,
      fill:col, "fill-opacity":"0.05", stroke:col, "stroke-opacity":"0.45","stroke-dasharray":"5 5"}));
    var lb=E("text",{class:"lbl", x:X0-14, y:Y-4, style:"text-anchor:start"}); lb.textContent=slug; lb.setAttribute("fill",col); layer.appendChild(lb);
    var yFor=function(i,n){ return Y + 26 + i*( (H-60) / Math.max(n-1,1) ); };
    var epAt={}, fnAt={}, clsAt={};
    eps.forEach(function(ep,i){ var y=yFor(i,eps.length);
      epAt[ep.m+" "+ep.p]={x:X0,y:y};
      var g=E("g",{class:"epmark","data-m":ep.m, transform:"translate("+X0+","+y+")"});
      epMark(g, 6.5, ep.m);
      var t=E("text",{class:"plabel", x:-12, y:3, style:"text-anchor:end"}); t.textContent=trunc(ep.m+" "+ep.p, 26); g.appendChild(t);
      var ti=E("title"); ti.textContent=ep.m+" "+ep.p; g.appendChild(ti);
      g.addEventListener("click",function(ev){ ev.stopPropagation(); showEndpoint(slug, ep); });
      layer.appendChild(g); });
    fnL.forEach(function(fn,i){ var y=yFor(i,fnL.length), x=X0+330;
      fnAt[fn]={x:x,y:y};
      var g=E("g",{class:"fnode","data-layer":"api", transform:"translate("+x+","+y+")"});
      fGlyph(g, 9, "var(--c-fn-api)", true, false);
      var t=E("text",{class:"plabel", y:19}); t.textContent=trunc(fn,18); g.appendChild(t);
      g.addEventListener("click",function(ev){ ev.stopPropagation();
        showFn({name:fn, slug:slug, layer:"api", lang:"py", handler:true, god:false}); });
      layer.appendChild(g); });
    clsL.forEach(function(cls,i){ var y=yFor(i,clsL.length), x=X0+690;
      clsAt[cls]={x:x,y:y};
      var isModel=(pc.models||[]).some(function(m){ return m.cls===cls; });
      var g=E("g",{class:"piece","data-kind":isModel?"model":"schema", transform:"translate("+x+","+y+")"});
      if(isModel) cylinder(g, 8, "var(--c-model)"); else sBadge(g, 7, "var(--c-schema)");
      var t=E("text",{class:"plabel", x:14, y:3, style:"text-anchor:start"}); t.textContent=trunc(cls,20); g.appendChild(t);
      g.addEventListener("click",function(ev){ ev.stopPropagation(); showPiece(slug, {kind:isModel?"model":"schema", m:{cls:cls}}); });
      layer.appendChild(g); });
    // the wires: ep → its handler ƒ → each class the handler touches (entity colour)
    eps.forEach(function(ep){ var a=epAt[ep.m+" "+ep.p], f=ep.fn&&fnAt[ep.fn];
      if(a&&f){ var p1=E("path",{class:"e-touch", d:"M"+(a.x+10)+" "+a.y+" C "+(a.x+120)+" "+a.y+", "+(f.x-120)+" "+f.y+", "+(f.x-12)+" "+f.y});
        p1.style.stroke=col; p1.style.opacity="0.8"; interLayer.appendChild(p1); }
      (ep.touch||[]).forEach(function(cls){ var c2=clsAt[cls]; if(!(f&&c2)) return;
        var p2=E("path",{class:"e-touch", d:"M"+(f.x+12)+" "+f.y+" C "+(f.x+120)+" "+f.y+", "+(c2.x-120)+" "+c2.y+", "+(c2.x-12)+" "+c2.y});
        p2.style.stroke=col; p2.style.opacity="0.8"; interLayer.appendChild(p2); }); });
    var allEps=(pc.endpoints||[]).filter(function(ep){ return (ep.touch||[]).length; });
    if(allEps.length>8){ var more=E("text",{class:"sub2 epmore", x:X0+330, y:Y+H-32, style:"cursor:pointer;text-decoration:underline"});
      more.textContent=expandedEps[slug]===true?"show fewer traces":"+"+(allEps.length-8)+" more traced endpoints — click to show all";
      more.addEventListener("click",function(ev){ ev.stopPropagation(); expandedEps[slug]=!expandedEps[slug]; renderKeepView(); });
      layer.appendChild(more); }
    b.minX=Math.min(b.minX,X0-260); b.maxX=Math.max(b.maxX,X0+930);
    b.minY=Math.min(b.minY,Y-40); b.maxY=Math.max(b.maxY,Y+H+10);
    Y += H + 40; });
  frame(b);
  legend([glyphIt("endpoint (entry)","ep"), glyphIt("handler ƒ","f-api"), glyphIt("model","cyl"), glyphIt("schema","s"),
          "<span class='it'>wire = the request's path: endpoint → handler → the data it touches (entity colour)"
          +(skipped.length?" · no traced endpoints: "+skipped.join(", "):"")+"</span>"]);
}

/* ── legend + panel helpers ── */
function sw(label, kind, col){ var d="M2 7 L20 7";
  return "<span class='it'><svg viewBox='0 0 22 14'><path d='"+d+"' fill='none' stroke='"+col+"' stroke-width='2' "+
    (kind==="dash"?"stroke-dasharray='5 4'":kind==="dot"?"stroke-dasharray='2 3'":"")+"/></svg>"+esc(label)+"</span>"; }
function glyphIt(label, kind){
  var g={cyl:"<ellipse cx='8' cy='4' rx='6' ry='2.4' fill='var(--c-model)'/><path d='M2 4 v6 a6 2.4 0 0 0 12 0 v-6' fill='var(--c-model)'/>",
         s:"<rect x='2' y='1' width='12' height='12' rx='3' fill='none' stroke='var(--c-schema)' stroke-width='1.6'/><text x='8' y='11' text-anchor='middle' font-size='9' font-weight='800' fill='var(--c-schema)'>S</text>",
         ep:"<circle cx='8' cy='7' r='6' fill='var(--m-post)'/><text x='8' y='10' text-anchor='middle' font-size='8' fill='#fff'>⚡</text>",
         "f-api":"<circle cx='8' cy='7' r='6.4' fill='none' stroke='var(--c-fn-api)' stroke-width='1.6'/><text x='8' y='10.5' text-anchor='middle' font-size='9' font-weight='800' fill='var(--c-fn-api)'>F</text>",
         "f-serv":"<circle cx='8' cy='7' r='6.4' fill='none' stroke='var(--c-fn-services)' stroke-width='1.6'/><text x='8' y='10.5' text-anchor='middle' font-size='9' font-weight='800' fill='var(--c-fn-services)'>F</text>",
         "f-web":"<circle cx='8' cy='7' r='6.4' fill='none' stroke='var(--c-fn-web)' stroke-width='1.6'/><text x='8' y='10.5' text-anchor='middle' font-size='9' font-weight='800' fill='var(--c-fn-web)'>F</text>"}[kind];
  return "<span class='it'><svg viewBox='0 0 16 15'>"+g+"</svg>"+esc(label)+"</span>"; }
function legend(items){ document.getElementById("legend").innerHTML=items.join(""); }

function showDefault(){
  panel.innerHTML="<h3>"+esc({entities:"Entities",pieces:"Pieces",functions:"Functions",layers:"Layers",trace:"Trace"}[level])+"</h3>"
   +"<div class='note'>"+{
     entities:"One dot per domain entity. Edges carry KINDS: fk solid · calls dashed-moving · imports dotted. Recipe→Cooking: fk×3 but calls×78 — the coupling FK could not see.",
     pieces:"Inside an entity: models as database cylinders, schemas as S badges. The API endpoints sit ON the border — they are the entity's surface, coloured by method.",
     functions:"The busiest cross-entity functions, F-glyphs coloured by layer (api / services / web-TS). A thick ring = endpoint handler. Every cross-file call edge is dashed because graft marks it inferred — a floor, not a census.",
     layers:"The same functions arranged by architectural lane. A dashed edge crossing lanes is cross-layer coupling at a glance.",
     trace:"The merge of Pieces + Functions: each endpoint wired to the handler function it calls, wired to the models/schemas that handler reads or writes — the request's path through the code, end to end. Wires wear the entity's colour."
   }[level]+"</div><div class='k'>fixture</div><div class='note'>"+esc(D.note)+"</div>";
}
function showEntity(en){ var pc=D.pieces[en.slug]||{};
  panel.innerHTML="<h3 style='color:"+(COLORS[en.slug]||"inherit")+"'>"+esc(en.label)+"</h3>"
   +"<div class='row'><span>endpoints</span><b>"+en.counts.endpoints+"</b></div>"
   +"<div class='row'><span>models</span><b>"+en.counts.models+"</b></div>"
   +"<div class='row'><span>schemas</span><b>"+en.counts.schemas+"</b></div>"
   +"<div class='row'><span>lines</span><b>"+(en.counts.lines||0).toLocaleString()+"</b></div>"
   +"<div class='note'>Switch to <b>2 · Pieces</b> to open it — the endpoints move to the border.</div>"; }
function showPiece(slug, it){
  panel.innerHTML="<h3>"+esc(it.m.cls||"")+"</h3><div class='note'>"+(it.kind==="model"?"model (database cylinder)":"schema (S badge)")+" · in "+esc(slug)+"</div>"
   +(it.m.table?"<div class='row'><span>table</span><b>"+esc(it.m.table)+"</b></div>":"")
   +(it.kind==="model"?"<div class='row'><span>foreign keys</span><b>"+(it.m.nfk||0)+"</b></div>":""); }
function showEndpoint(slug, ep){
  panel.innerHTML="<h3 style='font-size:13px'>"+esc(ep.m+" "+ep.p)+"</h3>"
   +"<div class='note'>an ENTRY POINT on the border of "+esc(slug)+"</div>"
   +"<div class='row'><span>handler</span><b>"+esc(ep.fn||"—")+"()</b></div>"; }
function showFn(f){
  panel.innerHTML="<h3>"+esc(f.name)+"()</h3>"
   +"<div class='row'><span>entity</span><b>"+esc(f.slug)+"</b></div>"
   +"<div class='row'><span>layer</span><b>"+esc(f.layer)+"</b></div>"
   +"<div class='row'><span>language</span><b>"+(f.lang==="ts"?"TypeScript":"Python")+"</b></div>"
   +(f.handler?"<div class='row'><span>role</span><b>endpoint handler</b></div>":"")
   +(f.god?"<div class='row'><span>⚠</span><b>god function</b></div>":"")
   +"<div class='note'>Edges into/out of this F are graft call edges — dashed = inferred (floor).</div>"; }

/* ── level switching (position persistence keeps shared anchors) ── */
function render(){
  vp.textContent=""; panX=0; panY=0; zoom=1;
  ({entities:drawEntities, pieces:drawPieces, functions:drawFunctions, layers:drawLayers, trace:drawTrace})[level]();
  showDefault();
  document.querySelectorAll("#levels button").forEach(function(btn){
    btn.classList.toggle("on", btn.getAttribute("data-lvl")===level); });
}
document.getElementById("levels").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return; level=b.getAttribute("data-lvl"); render(); });
window.addEventListener("resize", render);

/* ── the gear: entity layout Ring · Flow · Force (the command center's options) ── */
(function(){ var gb=document.getElementById("gear"), gp=document.getElementById("gearpanel");
  gb.addEventListener("click",function(e){ e.stopPropagation(); var open=gp.hidden; gp.hidden=!open; gb.setAttribute("aria-expanded",String(open)); });
  document.addEventListener("click",function(e){ if(!gp.hidden && !gp.contains(e.target) && !gb.contains(e.target)) gp.hidden=true; });
  document.getElementById("laySeg").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    entLayout=b.getAttribute("data-lay");
    document.querySelectorAll("#laySeg button").forEach(function(x){ x.classList.toggle("on", x===b); });
    computeEntityPositions(); render(); });
  document.getElementById("inSeg").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    insideLayout=b.getAttribute("data-in");
    document.querySelectorAll("#inSeg button").forEach(function(x){ x.classList.toggle("on", x===b); });
    Object.keys(pos).forEach(function(k){ if(k.indexOf("fn:")===0) delete pos[k]; });
    render(); });
})();

/* ── test hook ── */
window.__lvltest = {
  level:function(){ return level; },
  set:function(l){ level=l; render(); },
  counts:function(){ return {
    entities: vp.querySelectorAll(".entnode").length,
    pieces: vp.querySelectorAll(".piece").length,
    cylinders: vp.querySelectorAll(".piece[data-kind='model']").length,
    sbadges: vp.querySelectorAll(".piece[data-kind='schema']").length,
    epmarks: vp.querySelectorAll(".epmark").length,
    fnodes: vp.querySelectorAll(".fnode").length,
    ecalls: vp.querySelectorAll(".e-calls").length,
    efk: vp.querySelectorAll(".e-fk").length,
    eimports: vp.querySelectorAll(".e-imports").length };
  },
  epOnBorder:function(){ // every endpoint marker sits ON its container circle radius
    var ok=0, bad=0;
    ENTS.forEach(function(slug){ var p=entAnchor(slug); });
    vp.querySelectorAll(".epmark").forEach(function(g){
      var m=/translate\(([-0-9.]+),([-0-9.]+)\)/.exec(g.getAttribute("transform")); if(!m) { bad++; return; }
      var x=+m[1], y=+m[2], hit=false;
      vp.querySelectorAll("circle.container").forEach(function(c){
        var d=Math.hypot(x-(+c.getAttribute("cx")), y-(+c.getAttribute("cy")));
        if(Math.abs(d-(+c.getAttribute("r")))<1.5) hit=true; });
      hit?ok++:bad++; });
    return {ok:ok, bad:bad};
  },
  entPos:function(){ var o={}; ENTS.forEach(function(s){ o[s]=[pos["ent:"+s].x, pos["ent:"+s].y]; }); return o; },
  panelText:function(){ return panel.textContent; },
  layout:function(){ return entLayout; },
  setLayout:function(v){ entLayout=v; computeEntityPositions(); render(); },
  inside:function(){ return insideLayout; },
  setInside:function(v){ insideLayout=v; Object.keys(pos).forEach(function(k){ if(k.indexOf("fn:")===0) delete pos[k]; }); render(); },
  expandEps:function(slug){ expandedEps[slug]=!expandedEps[slug]; renderKeepView(); },
  touchWires:function(){ return vp.querySelectorAll(".e-touch").length; },
  schemaIcons:function(){ return vp.querySelectorAll(".piece[data-kind='schema'] path").length; },
  fnIcons:function(){ return vp.querySelectorAll(".fnode path").length; },
  containerOverlap:function(){ var cs=[]; vp.querySelectorAll("circle.container").forEach(function(c){
      cs.push({x:+c.getAttribute("cx"), y:+c.getAttribute("cy"), r:+c.getAttribute("r")}); });
    var bad=0; for(var i=0;i<cs.length;i++)for(var j=i+1;j<cs.length;j++){
      if(Math.hypot(cs[i].x-cs[j].x, cs[i].y-cs[j].y) < cs[i].r+cs[j].r) bad++; } return bad; },
  dragEntity:function(slug,dx,dy){ var o=pos["ent:"+slug];
    pos["ent:"+slug]={x:o.x+dx, y:o.y+dy};
    Object.keys(pos).forEach(function(k){ if(k.indexOf("fn:")===0) delete pos[k]; });
    suppressDeclutter=true; try{ renderKeepView(); } finally{ suppressDeclutter=false; } },
  gradients:function(){ return vp.querySelectorAll("defs linearGradient").length; },
  hitPaths:function(){ return vp.querySelectorAll("path[stroke='transparent']").length; },
  clickFirstEdge:function(){ var h=vp.querySelector("path[stroke='transparent']"); if(h) h.dispatchEvent(new MouseEvent("click",{bubbles:true})); },
  bowSides:function(){ // A→B and B→A between the same pair must bow to OPPOSITE sides
    var seen={}, both=0, opposite=0;
    D.l1_edges.forEach(function(ed){ var key=[ed.s,ed.t].sort().join("|");
      if(seen[key] && seen[key]!==(ed.s<ed.t)){ both++; opposite++; } // one fwd + one rev exists
      seen[key]=(ed.s<ed.t); });
    return {pairsBothDirs:both, opposite:opposite};
  }
};
render();
window.__lvlready = true;
})();
</script>
