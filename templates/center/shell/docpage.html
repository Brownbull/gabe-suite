<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOC_TITLE}} · {{PROJECT_NAME}} Command Center</title>
<link rel="stylesheet" href="assets/a3.css">
<script src="assets/slots.js" defer></script>
<script src="assets/a3-settings.js" defer></script>
<script src="assets/a3-lightbox.js" defer></script>
</head>
<body>
<!-- STATION: one authored DOC, rendered into the center's shell.
     SOURCE: docs/src/<name>.md — markdown is the source of truth; this page is
     generated by build_docsite.py and must never be hand-edited.

     This is the only station whose body is AUTHORED PROSE rather than machine
     facts, which is why it carries the .docbody typography layer and no KPI
     row: there is nothing to count on a page whose claim is an argument. -->
<div class="app">

<!-- ============ SIDEBAR — filled from nav.json, the model the center build
     emits. One sidebar, two builders: the estate pages render it directly, the
     doc pages render it from the seam file. Never authored here. -->
<aside class="side">
  {{SIDEBAR}}
</aside>

<main class="main">
  <div class="topbar">
    <div class="crumb"><a href="index.html">Overview</a> › <a href="docs.html">Docs</a> › <b>{{DOC_TITLE}}</b></div>
    <div class="spacer"></div>
    {{STATUS_PILLS}}
    <span class="stamp">regen · {{SYNC_AGE}}</span>
  </div>
  <div class="subject">
    <div class="subjecthead">
      <div class="pagehead">
        <div class="kicker">{{DOC_KICKER}}</div>
        <h1>{{DOC_TITLE}}</h1>
        <p>{{DOC_LEDE}}</p>
      </div>
    </div>
    <div class="tabbody">
      <section class="tabpane" id="doc" style="display:block">
        <article class="docbody">
          {{DOC_BODY}}
        </article>
        <p class="docsource">{{DOC_SOURCE}}</p>
      </section>
    </div>
  </div>
</main>

</div>
{{DOC_SCRIPTS}}
</body>
</html>
