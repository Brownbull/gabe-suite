  node:[ {key:"mass",lbl:"mass"}, {key:"glow",lbl:"glow"},
    {key:"ring1",lbl:"tests"}, {key:"ring2",lbl:"flags"}, {key:"ring3",lbl:"used-by"}, {key:"verts",lbl:"verts"},

function dimApplies(d){ return SEL.data && (dimScope(d)===SEL.kind); }
function dimF(d){ return fieldOf(d.key); }            // the field this effect is MAPPED to (per setup)
