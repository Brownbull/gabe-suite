<style>
  /* ══ the page's own rules — the kit block above is pasted verbatim by gen-review.js ══ */
  .artifact-page { margin: 0 auto; }            /* operator rule: an artifact's column is centred */
  .eyebrow { font-size: var(--fs-min); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-size: 2em; line-height: 1.15; margin: 8px 0 0; text-wrap: balance; }
  .lede { color: var(--ink-soft); max-width: 72ch; margin: 12px 0 0; }
  .cap { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; max-width: 80ch; }
  .sec-head { flex-wrap: wrap; }
  .sec-head .n { flex: 0 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
  .lab { font-size: var(--fs-min); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 2px 0 0; }
  .panel { position: relative; }

  .btn { font: inherit; font-size: var(--fs-sm); letter-spacing: inherit; cursor: pointer; border-radius: 8px; padding: 5px 11px; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn[data-mine="true"] { border: 1.5px dashed var(--accent); color: var(--accent); }                      /* dashed = my pick */
  .btn[aria-pressed="true"] { border: 1.5px solid var(--accent); background: var(--accent); color: var(--ground); }   /* filled = yours */
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .btn.pri:hover { filter: brightness(1.08); color: var(--ground); }
  .btn.nb { background: transparent; color: var(--ink-soft); font-size: var(--fs-xs); padding: 3px 9px; }
  .btn.nb[data-has="true"] { border-color: var(--accent); color: var(--accent); }
  .btn.sm { font-size: var(--fs-xs); padding: 2px 8px; border-radius: 6px; }
  .verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .state { font-size: var(--fs-min); color: var(--muted); letter-spacing: .04em; margin-left: 4px; }
  [data-state="yours"] .state { color: var(--accent); }
  .note { font: inherit; letter-spacing: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; width: 100%; box-sizing: border-box; resize: vertical; min-height: 2.6em; }
  .note[hidden] { display: none; }

  /* the key: what dashed and filled mean, drawn with the real buttons */
  .key { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 14px; }
  .key span { display: inline-flex; align-items: center; gap: 7px; }
  .key .btn { cursor: default; pointer-events: none; }

  /* ── the lab, as a map ── */
  .labmap { position: relative; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: #0b1020; }
  .labmap img { display: block; width: 100%; height: auto; }
  .labmap .rg { position: absolute; border: 2px solid var(--accent); border-radius: 6px; box-sizing: border-box; }
  .labmap .rg b { position: absolute; left: -2px; top: -2px; transform: translateY(-100%); background: var(--accent); color: var(--ground); font-size: var(--fs-min); font-weight: 650; letter-spacing: .04em; padding: 1px 7px; border-radius: 5px 5px 0 0; white-space: nowrap; }
  .labmap .rg[data-r="middle"] b { top: auto; bottom: -2px; transform: translateY(100%); border-radius: 0 0 5px 5px; }
  .labmap .rg[data-r="parts"] b { left: auto; right: -2px; top: 50%; transform: translate(100%, -50%); border-radius: 0 5px 5px 0; }

  /* ── the 36 lines ── */
  .norms { display: flex; flex-direction: column; gap: 14px; }
  .ngroup { display: flex; flex-direction: column; gap: 3px; }
  .ngroup h3 { margin: 0 0 3px; font-size: 1em; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
  .ngroup h3 span { font-size: var(--fs-min); color: var(--muted); font-weight: 400; }
  .nrow { display: grid; grid-template-columns: 6.2em minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 5px 8px; border-radius: 7px; border: 1px solid transparent; }
  .nrow:nth-child(even) { background: var(--raised); }
  .nrow[data-v="strike"] .ln { text-decoration: line-through; color: var(--muted); }
  .nrow[data-state="yours"] { border-color: var(--accent); }
  .nrow .st { font-size: var(--fs-min); letter-spacing: .08em; color: var(--muted); padding-top: 2px; }
  .nrow .ln { font-size: var(--fs-sm); color: var(--ink); overflow-wrap: anywhere; }
  .nrow .ln mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 2px; }
  .nrow .db { display: block; font-size: var(--fs-xs); color: var(--accent); margin-top: 2px; }
  .nrow .note { grid-column: 2 / -1; }
  @media (max-width: 760px) { .nrow { grid-template-columns: minmax(0, 1fr); } .nrow .note { grid-column: 1 / -1; } }

  /* ── one decision per card ── */
  .cards { display: flex; flex-direction: column; gap: 14px; }
  .dec { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 14px 28px; align-items: start; }
  .dec[data-state="yours"] { border-left-color: var(--strong) !important; }
  .dec > .dl, .dec > .dr { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .dec > .full { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 900px) { .dec { grid-template-columns: minmax(0, 1fr); } }
  .dec h3 { margin: 0; font-size: 1.05em; text-wrap: balance; }
  .live { align-self: flex-start; font-size: var(--fs-min); letter-spacing: .04em; border-radius: 999px; padding: 1px 9px; border: 1px solid var(--rule); color: var(--muted); }
  .live[data-live="worth"] { border-color: var(--accent); color: var(--ground); background: var(--accent); }
  .live[data-live="optional"] { color: var(--ink-soft); }
  .dec .what { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; }
  .dec .why { font-size: var(--fs-sm); color: var(--ink); margin: 0; border-left: 2px dashed var(--accent); padding-left: 9px; }
  .where { margin: 0; padding: 0; list-style: none; counter-reset: w; display: flex; flex-direction: column; gap: 3px; font-size: var(--fs-sm); color: var(--ink); }
  .where li { counter-increment: w; display: flex; gap: 8px; align-items: baseline; overflow-wrap: anywhere; }
  .where li::before { content: counter(w); flex: 0 0 auto; width: 1.5em; height: 1.5em; line-height: 1.5em; text-align: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-min); font-variant-numeric: tabular-nums; }
  .shot { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 8px; background: #0b1020; }
  .facts { border: 1px solid var(--rule); border-radius: 8px; background: var(--raised); padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); color: var(--ink-soft); }
  .facts b { color: var(--ink); font-weight: 650; }
  .facts ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; color: var(--ink); overflow-wrap: anywhere; }
  .facts li::before { content: "› "; color: var(--accent); }
  .facts table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: var(--fs-sm); }
  .facts th, .facts td { text-align: left; padding: 2px 14px 2px 0; font-weight: 400; color: var(--ink); }
  .facts th { color: var(--muted); font-size: var(--fs-min); letter-spacing: .06em; text-transform: uppercase; }
  .facts pre[hidden] { display: none; }
  .facts .btn.nb { align-self: flex-start; }
  .facts pre { margin: 0; font: inherit; font-size: var(--fs-xs); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: var(--fs-min); color: var(--ink); border: 1px solid var(--rule); border-radius: 999px; padding: 0 9px; line-height: 1.7; cursor: help; background: var(--card); }

  .tip { position: absolute; pointer-events: none; opacity: 0; background: var(--ink); color: var(--ground); font-size: var(--fs-min); letter-spacing: 0; line-height: 1.45; padding: 6px 9px; border-radius: 7px; z-index: 9; max-width: 46ch; transition: opacity .12s ease; }
  .tip[data-show="true"] { opacity: 1; }

  .out { font: inherit; letter-spacing: inherit; font-size: var(--fs-sm); line-height: 1.5; color: var(--ink); background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; width: 100%; box-sizing: border-box; min-height: 16em; resize: vertical; white-space: pre; overflow: auto; }
  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .said { font-size: var(--fs-sm); color: var(--accent); min-height: 1.4em; }
  .plainlist { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 3px; font-size: var(--fs-sm); color: var(--ink-soft); }
  a.link { color: var(--accent); overflow-wrap: anywhere; }
</style>
