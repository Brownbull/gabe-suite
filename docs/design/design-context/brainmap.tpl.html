<style>
  /* ══ the page's own rules — the kit block above is pasted verbatim by gen-brainmap.js ══ */
  /* The column is centred (his rule) but WIDE, because this page's subject is a map and a map read at 74rem on a 2,500px
     screen is the squeeze he saw. Every block of prose keeps its own reading width below, so nothing sets a long line. */
  .artifact-page { margin: 0 auto; max-width: min(2100px, 95vw); }

  :root { --alert:#a3470a; --alert-soft:#fbeadb; --lit:var(--accent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --alert:#f0a35a; --alert-soft:#3b2914; } }
  :root[data-theme="dark"] { --alert:#f0a35a; --alert-soft:#3b2914; }

  .eyebrow { font-size: var(--fs-min); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-size: 2em; line-height: 1.15; margin: 8px 0 0; text-wrap: balance; }
  .lede { color: var(--ink-soft); max-width: 70ch; margin: 12px 0 0; }
  .keys { font-size: var(--fs-xs); color: var(--muted); margin: 10px 0 0; max-width: 78ch; }
  .cap { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; max-width: 76ch; }
  kbd { font-family: inherit; font-size: var(--fs-min); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--raised); color: var(--ink-soft); }

  .btn { font: inherit; font-size: var(--fs-sm); letter-spacing: inherit; cursor: pointer; border-radius: 8px; padding: 6px 12px; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .btn.pri:hover { filter: brightness(1.08); color: var(--ground); }
  .btn.quiet { background: transparent; color: var(--ink-soft); font-size: var(--fs-xs); padding: 4px 10px; }
  .btn[data-armed="true"] { border-color: var(--alert); color: var(--alert); background: var(--alert-soft); }
  .said { font-size: var(--fs-xs); color: var(--accent); }

  /* ── the rail ─────────────────────────────────────────────────────── */
  .rail { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-start; }
  .rgrp { display: flex; flex-direction: column; gap: 5px; }
  .rgrp > .rl { font-size: var(--fs-min); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .opt { font: inherit; font-size: var(--fs-xs); letter-spacing: inherit; cursor: pointer; border-radius: 8px; padding: 4px 10px;
         border: 1px solid var(--rule); background: var(--raised); color: var(--ink-soft); display: flex; align-items: baseline; gap: 6px; }
  .opt:hover { border-color: var(--accent); color: var(--accent); }
  .opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent); color: var(--ground); }
  .opt .k { font-weight: 700; }
  .opt .sp { font-size: var(--fs-min); opacity: .78; }

  /* ── the stage: map + tray ──────────────────────────────────────────
     The PROSE keeps the centred column (his rule); the WORKING SURFACE breaks out of it and uses the screen — a map read at
     1,180px on a 2,500px display is the squeeze he saw. The breakout is symmetric, so the stage stays centred on the page. */
  .stage { position: relative; display: grid; gap: 14px; }
  .stage[data-tray="below"] { grid-template-columns: minmax(0, 1fr); }
  .stage[data-tray="beside"] { grid-template-columns: minmax(0, 1fr) clamp(320px, 26vw, 34rem); }   /* the tray on the RIGHT, wide enough to read a panel */
  /* an indented list is a LIST: it needs a column, not half the screen, and the panels take what it does not use */
  .stage[data-tray="beside"][data-lay="E"] { grid-template-columns: clamp(300px, 24vw, 30rem) minmax(0, 1fr); }
  .stage[data-lay="E"] .canvas { height: auto; min-height: 420px; max-height: clamp(520px, 74vh, 1000px); }
  @media (max-width: 900px) { .stage[data-tray="beside"] { grid-template-columns: minmax(0, 1fr); } }

  .canvas { position: relative; overflow: auto; height: clamp(520px, 74vh, 1000px); background: var(--card);
            border: 1px solid var(--rule); border-left: var(--rail) solid var(--accent); border-radius: var(--radius, 10px); }
  .canvas[data-lay="E"] { overflow: auto; }
  .plane { position: relative; }
  .wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .wire { fill: none; stroke: var(--rule); stroke-width: 1.6; transition: stroke .35s ease, stroke-width .35s ease, d .55s cubic-bezier(.22,.61,.36,1); }
  .wire[data-lit="true"] { stroke: var(--lit); stroke-width: 2.4; }
  .wire[data-kind="share"] { stroke-dasharray: 3 4; stroke: color-mix(in srgb, var(--accent) 40%, var(--rule)); }

  .node { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 2px;
          padding: 5px 9px; text-align: left; font: inherit; letter-spacing: inherit; cursor: pointer;
          background: var(--raised); color: var(--ink); border: 1px solid var(--rule); border-radius: 9px;
          transition: left .55s cubic-bezier(.22,.61,.36,1), top .55s cubic-bezier(.22,.61,.36,1), opacity .35s ease, border-color .3s ease, background .3s ease; }
  .plane.still .node, .plane.still .wire { transition: none !important; }
  .node:hover { border-color: var(--accent); }
  .node .nm { font-size: var(--fs-xs); font-weight: 650; line-height: 1.22; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .node .sub { font-size: var(--fs-min); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node[data-kind="root"] { background: var(--strong); color: var(--sec-ink, var(--ground)); border-color: var(--strong); }
  .node[data-kind="root"] .sub { color: var(--sec-ink, var(--ground)); opacity: .8; }
  .node[data-kind="attr"] { background: var(--card); }
  .node[data-shared="true"] { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); }
  .node[data-kind="added"], .node[data-unplaced="true"] { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--rule-soft) 6px 10px); }
  .node[data-lit="true"] { border-color: var(--lit); }
  .node[data-open="true"] { background: var(--accent); border-color: var(--accent); color: var(--ground); }
  .node[data-open="true"] .sub { color: var(--ground); opacity: .82; }
  .node .r3, .node .r2, .node .r1 { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
  .node .r3 { background: var(--accent); } .node .r2 { background: color-mix(in srgb, var(--accent) 52%, var(--card)); } .node .r1 { background: color-mix(in srgb, var(--accent) 22%, var(--card)); }
  .node[data-open="true"] .r3, .node[data-open="true"] .r2, .node[data-open="true"] .r1 { background: var(--ground); }
  .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* the indented control — no drawing */
  .ind { padding: 14px 16px; }
  .ind ul { list-style: none; margin: 0; padding: 0 0 0 0; }
  .ind li { margin: 0; }
  .ind .row { display: flex; align-items: baseline; gap: 8px; }
  .ind .tw { color: var(--muted); font-size: var(--fs-min); white-space: pre; }
  .ind .nb { font: inherit; font-size: var(--fs-xs); letter-spacing: inherit; background: none; border: 0; padding: 2px 6px; border-radius: 6px; cursor: pointer; color: var(--ink); text-align: left; }
  .ind .nb:hover { color: var(--accent); }
  .ind .nb[data-open="true"] { background: var(--accent); color: var(--ground); }
  .ind .nb[data-lit="true"] { box-shadow: inset 2px 0 0 var(--lit); }
  .ind .ct { color: var(--muted); font-size: var(--fs-min); font-variant-numeric: tabular-nums; }
  .ind ul ul { padding-left: 18px; border-left: 1px solid var(--rule-soft); margin-left: 6px; }

  /* the sweep — one curve from the lit node to the tray */
  .sweep { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
  .sweep path { fill: none; stroke: var(--lit); stroke-width: 2; stroke-linecap: round; opacity: .9; }
  .sweep path.brk { stroke-width: 1.6; opacity: .55; }

  /* the tray */
  .tray { position: relative; min-height: 96px; border: 1px dashed var(--rule); border-radius: var(--radius, 10px); padding: 12px; background: var(--rule-soft);
          display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .stage[data-tray="beside"] .tray { flex-direction: column; flex-wrap: nowrap; overflow: auto; max-height: clamp(520px, 74vh, 1000px); }   /* the tray matches the map, so the two scroll as one surface */
  .tray .empty { font-size: var(--fs-sm); color: var(--muted); }
  /* what a click does — a PROPOSAL, marked as one: the move, what it puts in front of you, and which region answers */
  .moves { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--rule); display: flex; flex-direction: column; gap: 5px; }
  .mvh { font-size: var(--fs-min); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .mv { display: flex; align-items: flex-start; gap: 8px; padding: 4px 6px; border-radius: 7px; background: var(--raised); cursor: help; }
  .mv .mvi { flex: none; display: inline-flex; color: var(--accent); }
  .mv .mvi svg { width: 15px; height: 15px; display: block; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .mv .mvb { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .mv .mvb b { font-size: var(--fs-xs); color: var(--ink); }
  .mv .mvw { font-size: var(--fs-min); color: var(--ink-soft); }
  .mv .mvr { flex: none; font-style: normal; font-size: var(--fs-min); color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 7px; line-height: 1.5; white-space: nowrap; }
  .mvn { font-size: var(--fs-min); color: var(--muted); margin: 2px 0 0; }
  /* the mark a node carries when the moves are shown: how many, so the map says a node is a place you can act from */
  .node .acts { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
  .node .acts i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .62; font-style: normal; }
  .sweep path.off { stroke-dasharray: 3 4; opacity: .55; }
  .pan { flex: 1 1 250px; min-width: 0; max-width: 100%; background: var(--card); border: 1px solid var(--rule); border-left: var(--rail) solid var(--accent);
         border-radius: var(--radius, 10px); padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; }
  .stage[data-tray="beside"] .pan { flex: 0 0 auto; }
  .pan .ph { display: flex; align-items: baseline; gap: 8px; }
  .pan .ph h3 { margin: 0; font-size: var(--fs-sm); font-weight: 700; }
  .pan .ph .x { margin-left: auto; }
  .pan .kind { font-size: var(--fs-min); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .pan .pl { font-size: var(--fs-sm); color: var(--ink-soft); }
  .pan .fl { display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .pan ul { margin: 0; padding-left: 16px; font-size: var(--fs-xs); color: var(--ink-soft); display: flex; flex-direction: column; gap: 3px; }
  .pan .std { font-size: var(--fs-xs); color: var(--muted); }
  .chip { font-size: var(--fs-min); color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 0 8px; line-height: 1.55; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip.al { border-color: var(--alert); color: var(--alert); }
  .chip.hz { border-style: dashed; }
  .xb { font: inherit; font-size: var(--fs-min); letter-spacing: inherit; cursor: pointer; border: 1px solid var(--rule); background: var(--raised); color: var(--ink-soft); border-radius: 6px; padding: 0 7px; line-height: 1.5; }
  .xb:hover { border-color: var(--alert); color: var(--alert); }

  .status { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: var(--fs-xs); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .status b { color: var(--ink); font-weight: 650; }
  .deep { font-size: var(--fs-xs); color: var(--alert); }
  .deep[hidden] { display: none; }

  /* ── what it draws ── */
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .facts .panel p { font-size: var(--fs-sm); color: var(--ink-soft); }
  .facts .big { font-size: 1.7em; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ── the five cards ── */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--rule); border-left: var(--rail) solid var(--accent); border-radius: var(--radius, 10px); padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
  .card[data-cur="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 40%, var(--card)); }
  .card h3 { margin: 0; font-size: var(--fs-sm); display: flex; align-items: baseline; gap: 8px; }
  .card h3 .k { font-family: var(--af-title); font-size: 1.25em; color: var(--accent); }
  .card p { font-size: var(--fs-xs); color: var(--ink-soft); }
  .card .meas { font-size: var(--fs-min); color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .acts { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }

  .take { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: var(--fs-xs); color: var(--ink-soft); }
  .take li { padding-left: 14px; position: relative; }
  .take li::before { content: ""; position: absolute; left: 0; top: .52em; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); }

  /* ── open questions ── */
  .qs { display: flex; flex-direction: column; gap: 10px; }
  .qq { background: var(--card); border: 1px solid var(--rule); border-left: var(--rail) solid var(--alert); border-radius: var(--radius, 10px); padding: 11px 13px; display: flex; flex-direction: column; gap: 5px; }
  .qq .h { font-size: var(--fs-sm); font-weight: 650; }
  .qq .d, .qq .a { font-size: var(--fs-xs); color: var(--ink-soft); }
  .qq .a { color: var(--accent); }

  /* ── more information (D-017) ── */
  #more-body[hidden] { display: none; }
  #more-body { display: flex; flex-direction: column; gap: 7px; }
  #more-body p { font-size: var(--fs-xs); color: var(--ink-soft); }

  .out { width: 100%; box-sizing: border-box; min-height: 8.5em; resize: vertical; font: inherit; font-size: var(--fs-xs); letter-spacing: inherit;
         background: var(--raised); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* ── one tooltip, short on a control and richer on an element ── */
  .tip { position: absolute; z-index: 60; max-width: 30rem; background: var(--strong); color: var(--sec-ink, var(--ground));
         border-radius: 8px; padding: 7px 10px; font-size: var(--fs-min); line-height: 1.45; box-shadow: var(--shadow); pointer-events: none; opacity: 0; transition: opacity .12s ease; }
  .tip[data-show="true"] { opacity: 1; }
  .tip b { font-weight: 700; }
  .tip .ln { display: block; }
  .tip .pl { display: block; margin-top: 4px; opacity: .86; }
</style>

<script>
(function () {

  var D = window.BM_DATA, KEY = "gabe:brainmap:" + D.kind, AKEY = "gabe:brainmap:anim";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  /* ── state ─────────────────────────────────────────────────────────── */
  var LAYS = ["A", "B", "C", "D", "E"], GRPS = ["flat", "standpoint", "section"], SPN = ["nodes", "band"], TRY = ["below", "beside"], ACT = ["on", "off"];
  var S = { lay: "A", grp: "flat", spine: "nodes", tray: "beside", acts: "on", open: [], pick: null };   /* the tray starts on the RIGHT, and a node says what a click on it would do (his asks 2026-09-22) */
  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  });
  function navKey(e, n) {
    var k = e.key;
    if (k === "Enter" || k === " ") { e.preventDefault(); toggle(n.pkey); return; }
    if (k === "Escape") { if (S.open.length) { e.preventDefault(); toggle(S.open[S.open.length - 1]); } return; }
    var dir = { ArrowLeft: -1, ArrowRight: 1 }[k], step = { ArrowUp: -1, ArrowDown: 1 }[k];
    if (dir === undefined && step === undefined) return;
    e.preventDefault();
    var same = NODES.filter(function (x) { return x.n.depth === n.depth; }).sort(function (a, b) { return a.n.sx - b.n.sx; });
    if (dir !== undefined) {
      var at = same.map(function (x) { return x.n.pkey; }).indexOf(n.pkey), nx = same[at + dir];
      if (nx) nx.el.focus();
      return;
    }
    var want = n.depth + step, lvl = NODES.filter(function (x) { return x.n.depth === want; });
    if (!lvl.length) return;
    lvl.sort(function (a, b) { return Math.abs(a.n.sx - n.sx) - Math.abs(b.n.sx - n.sx); });
    lvl[0].el.focus();
  }

  /* ── the panels ────────────────────────────────────────────────────── */
  function chip(t, cls) { return el("span", "chip" + (cls ? " " + cls : ""), t); }
  function panelFor(pkey) {
    var s = SUBJ(pkey); if (!s) return null;
    var p = el("div", "pan"); p.setAttribute("data-pkey", pkey);
    var h = el("div", "ph"), t = el("h3"), kindTxt = { root: "the card", attr: "attribute", block: "block", group: "standpoint", sec: "section", added: "not placed" }[s.kind];
    t.textContent = s.kind === "root" ? D.root.name : s.kind === "attr" ? s.a.label : s.kind === "block" ? s.b.name : s.kind === "group" ? s.g.name : s.kind === "sec" ? s.s.short : D.addedName;
    var kd = el("span", "kind", kindTxt);
    var x = el("button", "xb x", "close"); x.type = "button"; x.setAttribute("aria-label", "Close " + t.textContent);
    x.addEventListener("click", function () { toggle(pkey); });
    h.appendChild(t); h.appendChild(kd); h.appendChild(x); p.appendChild(h);
    var fl = el("div", "fl");
    if (s.kind === "root") {
      p.appendChild(el("p", "pl", D.root.plain));
      [plural(D.attrs.length, "attribute"), plural(D.blocks.length, "block"), D.spine.length + " shared", D.added.length + " not placed"].forEach(function (c) { fl.appendChild(chip(c)); });
      p.appendChild(fl);
      var ul = document.createElement("ul");
      D.blocks.slice().sort(function (a, b) { return (b.attrs.length + b.spine.length) - (a.attrs.length + a.spine.length) || a.n - b.n; })
        .forEach(function (b) { ul.appendChild(el("li", null, b.name + " · " + plural(b.attrs.length + b.spine.length, "attribute"))); });
      p.appendChild(ul);
    } else if (s.kind === "attr") {
      var a = s.a;
      p.appendChild(el("p", "pl", a.plain));
      fl.appendChild(chip("rated " + a.r, "on")); if (a.alarm) fl.appendChild(chip("alert", "al"));
      fl.appendChild(chip(a.type)); fl.appendChild(chip("first at " + a.first));
      if (a.card) fl.appendChild(chip(a.card, "hz"));
      fl.appendChild(chip(a.spine ? "shared by " + a.spineIn + " blocks" : a.home ? B[a.home].name : D.addedName, a.home || a.spine ? "" : "hz"));
      p.appendChild(fl);
      if (a.needs.length) {
        var uq = document.createElement("ul");
        a.needs.forEach(function (q) { uq.appendChild(el("li", null, q + " · " + D.qtext[q])); });
        p.appendChild(el("p", "std", "Questions that cannot be answered without it")); p.appendChild(uq);
      } else p.appendChild(el("p", "std", a.needNote));
    } else if (s.kind === "block") {
      var b = s.b;
      p.appendChild(el("p", "pl", b.plain));
      fl.appendChild(chip(b.attrs.length + " of its own")); fl.appendChild(chip(b.spine.length + " shared"));
      fl.appendChild(chip(b.questions.join(" · ")));
      p.appendChild(fl);
      var ub = document.createElement("ul");
      b.attrs.concat(b.spine).forEach(function (id) { ub.appendChild(el("li", null, A[id].label + " · rated " + A[id].r + (b.spine.indexOf(id) >= 0 ? " · shared" : ""))); });
      p.appendChild(ub);
      p.appendChild(el("p", "std", b.standpoint));
    } else if (s.kind === "group") {
      p.appendChild(el("p", "pl", s.g.plain));
      fl.appendChild(chip(plural(s.g.blocks.length, "block"))); fl.appendChild(chip(plural(s.g.n, "attribute")));
      p.appendChild(fl);
      var ug = document.createElement("ul");
      s.g.blocks.forEach(function (bk) { ug.appendChild(el("li", null, B[bk].name + " · " + plural(B[bk].attrs.length + B[bk].spine.length, "attribute"))); });
      p.appendChild(ug);
    } else if (s.kind === "sec") {
      p.appendChild(el("p", "pl", s.s.plain));
      fl.appendChild(chip(plural(s.s.attrs.length, "attribute"))); p.appendChild(fl);
      var us = document.createElement("ul");
      s.s.attrs.forEach(function (id) { us.appendChild(el("li", null, A[id].label + " · " + (A[id].spine ? "shared" : A[id].home ? B[A[id].home].name : D.addedName))); });
      p.appendChild(us);
    } else {
      p.appendChild(el("p", "pl", D.addedPlain));
      fl.appendChild(chip(plural(D.added.length, "attribute"))); p.appendChild(fl);
      var ua = document.createElement("ul");
      D.added.forEach(function (id) { ua.appendChild(el("li", null, A[id].label + " · rated " + A[id].r)); });
      p.appendChild(ua);
    }
    if (S.acts === "on") p.appendChild(moves(s.kind));
    return p;
  }

  /* ── what a click DOES, and which region answers (his ask, 2026-09-22) ─────────────────────────────
     A PROPOSAL and said to be one: the map is the COMMAND region, so a node names a concept and the move says where the
     answer lands — the middle, the portrait, the map itself, or this tray. Nothing here reaches the feed yet. */
  function moves(kind) {
    var rows = (D.acts.byNode || {})[kind] || [], box = el("div", "moves");
    box.appendChild(el("div", "mvh", D.acts.head));

    rows.forEach(function (r) {

      var row = el("div", "mv");

  /* ── the rail ──────────────────────────────────────────────────────── */
  function rgrp(label, plainTxt, opts, cur, onPick) {

      b.setAttribute("data-id", o.id); b.setAttribute("aria-checked", String(o.id === cur));

  function paintRail() {

      return { id: k, rail: "lay", label: k + " · " + D.layouts[k].name, plain: D.layouts[k].plain };
    }), S.lay, function (v) { S.lay = v; save(); draw(true, true); }));
    host.appendChild(rgrp(D.rails.group.label, D.rails.group.plain, GRPS.map(function (k) {
      return { id: k, rail: "grp", label: D.groupings[k].name, note: D.groupings[k].note, plain: D.groupings[k].plain };
    }), S.grp, function (v) { S.grp = v; save(); draw(true, true); }));
    host.appendChild(rgrp(D.rails.spine.label, D.rails.spine.plain, SPN.map(function (k) {
      return { id: k, rail: "spine", label: D.spineModes[k].name, note: D.spineModes[k].note, plain: D.spineModes[k].plain };
    }), S.spine, function (v) { S.spine = v; save(); draw(true, true); }));
    host.appendChild(rgrp(D.rails.acts.label, D.rails.acts.plain, ACT.map(function (k) {
      return { id: k, rail: "acts", label: D.actModes[k].name, plain: D.actModes[k].plain };
    }), S.acts, function (v) { S.acts = v; save(); draw(true, false); }));
    host.appendChild(rgrp(D.rails.tray.label, D.rails.tray.plain, TRY.map(function (k) {
      return { id: k, rail: "tray", label: D.trayModes[k].name, plain: D.trayModes[k].plain };
    }), S.tray, function (v) { S.tray = v; save(); draw(true, true); }));
  }
  function paintStatus(T, L) {
    var st = $("status"); st.innerHTML = "";
    var drawn = L.all.length;
    [["nodes drawn", drawn], ["levels drawn", L.maxD === BAND_D ? 1 : Math.floor(L.maxD) + 1], ["panels open", S.open.length],
     ["map is", L.w + " x " + L.h + " px"]].forEach(function (r) {
      var s = el("span"); s.appendChild(document.createTextNode(r[0] + " ")); s.appendChild(el("b", null, String(r[1]))); st.appendChild(s);
    });
    var dp = $("deep");
    if (T.deferred > 0) { dp.hidden = false; dp.textContent = D.deepNote.replace("{n}", String(T.deferred)); } else dp.hidden = true;
    buildText();
  }
  function paintCards(L) {
    var host = $("cards"); host.innerHTML = "";
    LAYS.forEach(function (k) {
      var c = el("div", "card"); c.setAttribute("data-lay", k); c.setAttribute("data-cur", String(k === S.lay));
      var h = el("h3"); h.appendChild(el("span", "k", k)); h.appendChild(document.createTextNode(D.layouts[k].name));
      if (S.pick === k) h.appendChild(chip("your pick", "on"));
      c.appendChild(h);
      c.appendChild(el("p", null, D.layouts[k].line1));
      c.appendChild(el("p", null, D.layouts[k].line2));
      var m = el("div", "meas"); m.setAttribute("data-meas", k); c.appendChild(m);
      var acts = el("div", "acts");
      var show = el("button", "btn quiet", "Show it"); show.type = "button"; show.addEventListener("click", function () { S.lay = k; save(); draw(); $("sec-map").scrollIntoView({ block: "start" }); });
      var pick = el("button", "btn quiet", S.pick === k ? "Picked" : "Pick this"); pick.type = "button"; pick.setAttribute("data-pick", k);
      pick.addEventListener("click", function () { S.pick = S.pick === k ? null : k; save(); paintCards(L); buildText(); });
      acts.appendChild(show); acts.appendChild(pick); c.appendChild(acts);
      host.appendChild(c);
    });
    measureAll();
  }
  /* every card's measured line comes from running the layout, never from a typed number */
  function measureAll() {
    var keep = S.lay, ext = {};
    LAYS.forEach(function (k) { S.lay = k; var T = buildTree(), L = place(T); ext[k] = { w: L.w, h: L.h, n: L.all.length }; });
    S.lay = keep;
    LAYS.forEach(function (k) {
      var m = document.querySelector('[data-meas="' + k + '"]'); if (!m) return;
      m.textContent = k === "E" ? ext[k].n + " nodes · no drawing, so it takes the width it is given"
        : ext[k].n + " nodes · " + ext[k].w + " x " + ext[k].h + " px as drawn now";
    });
    window.__bmExtents = ext;
    var wide = LAYS.filter(function (k) { return k !== "E"; }).sort(function (a, b) { return ext[b].w - ext[a].w; })[0];
    var tall = LAYS.filter(function (k) { return k !== "E"; }).sort(function (a, b) { return ext[b].h - ext[a].h; })[0];
    var t = $("take-options"); t.innerHTML = "";
    D.takes.options.forEach(function (s) {
      t.appendChild(el("li", null, s.replace("{widest}", D.layouts[wide].name + " at " + ext[wide].w + " px").replace("{tallest}", D.layouts[tall].name + " at " + ext[tall].h + " px")));
    });
  }

  /* ── motion: the page opens on the finished picture ─────────────────── */
  var ANIM = "finished";
  try { var av = window.localStorage.getItem(AKEY); if (av === "open" || av === "finished") ANIM = av; } catch (e) {}
  function settle() { plane.classList.add("still"); requestAnimationFrame(function () { requestAnimationFrame(function () { plane.classList.remove("still"); }); }); }
  function replay() {
    if (!window.MOTION || !window.MOTION.on) { draw(false); plane.classList.add("still"); requestAnimationFrame(drawSweep); return; }
    var T = CUR && CUR.T, L = CUR && CUR.L; if (!L) return;
    var r = L.all[0];
    plane.classList.add("still");
    NODES.forEach(function (x) { if (x.el.style.left !== undefined && S.lay !== "E") { x.el.style.left = (r.cx - SIZE[x.n.kind][0] / 2) + "px"; x.el.style.top = (r.cy - SIZE[x.n.kind][1] / 2) + "px"; x.el.style.opacity = "0"; } });
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      plane.classList.remove("still");
      NODES.forEach(function (x) { x.el.style.left = (x.n.cx - SIZE[x.n.kind][0] / 2) + "px"; x.el.style.top = (x.n.cy - SIZE[x.n.kind][1] / 2) + "px"; x.el.style.opacity = "1"; });
    }); });
  }

  /* ── one tooltip: short on a control, richer on an element ─────────── */
  var tip = el("div", "tip"); tip.setAttribute("data-show", "false"); document.body.appendChild(tip);
  function tipHtml(n) {
    if (n.control) return '<span class="ln"><b>' + esc(n.name) + "</b></span>" + '<span class="pl">' + esc(n.control) + "</span>";
    /* his rule: a CONTROL's card is very short, an ELEMENT's is richer — a move is an element, so it says what it changes */
    if (n.element) return '<span class="ln"><b>' + esc(n.name) + "</b></span>" + '<span class="pl">' + esc(n.element) + "</span>";
    var s = SUBJ(n.pkey), lines = [], plainTxt = "";
    if (!s) return "";
    if (s.kind === "attr") { var a = s.a;
      lines.push("<b>" + esc(a.label) + "</b>");
      lines.push(esc("rated " + a.r + (a.alarm ? " · alert" : "") + " · " + a.type));
      lines.push(esc("first shown at " + a.first + " · needed by " + plural(a.needs.length, "question")));
      lines.push(esc(a.spine ? "shared by " + a.spineIn + " blocks" : a.home ? "in " + B[a.home].name : D.addedName));
      plainTxt = a.plain;
    } else if (s.kind === "block") { lines.push("<b>" + esc(s.b.name) + "</b>");
      lines.push(esc(s.b.questions.join(" · ") + " · " + s.b.attrs.length + " of its own · " + s.b.spine.length + " shared"));
      plainTxt = s.b.plain;
    } else if (s.kind === "group") { lines.push("<b>" + esc(s.g.name) + "</b>"); lines.push(esc(plural(s.g.blocks.length, "block") + " · " + plural(s.g.n, "attribute"))); plainTxt = s.g.plain;
    } else if (s.kind === "sec") { lines.push("<b>" + esc(s.s.short) + "</b>"); lines.push(esc(plural(s.s.attrs.length, "attribute"))); plainTxt = s.s.plain;
    } else if (s.kind === "root") { lines.push("<b>" + esc(D.root.name) + "</b>"); lines.push(esc(D.root.sub)); plainTxt = D.root.plain;
    } else { lines.push("<b>" + esc(D.addedName) + "</b>"); lines.push(esc(plural(D.added.length, "attribute"))); plainTxt = D.addedPlain; }
    return lines.map(function (l) { return '<span class="ln">' + l + "</span>"; }).join("") + '<span class="pl">' + esc(plainTxt) + "</span>";
  }
  function hover(node, n) {
    node.addEventListener("mouseenter", function () { show(node, n); });
    node.addEventListener("mouseleave", function () { tip.setAttribute("data-show", "false"); });
    node.addEventListener("focus", function () { show(node, n); });
    node.addEventListener("blur", function () { tip.setAttribute("data-show", "false"); });
  }
  function show(node, n) {
    var html = tipHtml(n); if (!html) return;
    tip.innerHTML = html; tip.setAttribute("data-show", "true");
    var r = node.getBoundingClientRect(), tr = tip.getBoundingClientRect();
    var x = r.left + window.scrollX, y = r.top + window.scrollY - tr.height - 9;
    if (y < window.scrollY + 4) y = r.bottom + window.scrollY + 9;             /* never under the pointer */
    x = Math.max(6, Math.min(x, window.scrollX + document.documentElement.clientWidth - tr.width - 6));
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }

  /* ── the words ─────────────────────────────────────────────────────── */
  $("eyebrow").textContent = D.head.eyebrow; $("h1").textContent = D.head.title;
  $("lede").textContent = D.head.lede; $("keys").innerHTML = D.head.keys;
  ["map", "reads", "options", "open", "more", "pick"].forEach(function (k) { $("t-" + k).textContent = D.secWords[k].title; $("n-" + k).textContent = D.secWords[k].n; });
  $("tray-empty").textContent = D.trayEmpty; $("sketch").textContent = D.head.sketchNote;
  $("open-why").textContent = D.open.why;
  $("pick-intro").textContent = D.pickIntro;
  $("foot").textContent = D.foot;
  (function () { var t = $("take-map"); D.takes.map.forEach(function (s) { t.appendChild(el("li", null, s)); }); })();
  (function () { var h = $("facts"); D.facts.forEach(function (f) {
    var p = el("div", "panel"); p.appendChild(el("div", "big", f.big)); p.appendChild(el("p", null, f.text)); h.appendChild(p); }); })();
  (function () { var h = $("qs"); D.open.items.forEach(function (q) {
    var b = el("div", "qq"); b.appendChild(el("div", "h", q.q)); b.appendChild(el("div", "d", q.did)); b.appendChild(el("div", "a", q.ask)); h.appendChild(b); }); })();
  (function () { var h = $("more-body"); D.more.lines.forEach(function (s) { h.appendChild(el("p", null, s)); }); })();
  (function () { var b = $("more-btn"), body = $("more-body");
    b.addEventListener("click", function () { var on = b.getAttribute("aria-expanded") === "true"; b.setAttribute("aria-expanded", String(!on)); body.hidden = on; b.textContent = on ? D.moreShow : D.moreHide; });
    b.textContent = D.moreShow; hover(b, { control: D.ui.more, name: D.moreShow }); })();

  /* ── the pick, as text ─────────────────────────────────────────────── */
  function buildText() {
    var L = ["BRAIN MAP — " + D.root.name];
    L.push("pick: " + (S.pick ? S.pick + " · " + D.layouts[S.pick].name : "none yet"));
    L.push("showing: " + S.lay + " · " + D.layouts[S.lay].name + " | grouping " + D.groupings[S.grp].name + " | shared " + D.spineModes[S.spine].name + " | tray " + D.trayModes[S.tray].name);
    L.push("open panels (" + S.open.length + "): " + (S.open.map(function (k) { var s = SUBJ(k); return !s ? k : s.kind === "attr" ? s.a.label : s.kind === "block" ? s.b.name : s.kind === "group" ? s.g.name : s.kind === "sec" ? s.s.short : s.kind === "root" ? D.root.name : D.addedName; }).join(" · ") || "none"));
    L.push("map: " + D.inv.hash + " · cells " + D.cellsHash);
    $("out").value = L.join("\n");
  }
  $("copy").addEventListener("click", function () {
    var t = $("out").value;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { $("said").textContent = "Copied."; }, function () { $("said").textContent = "Select the text and copy it."; });
    else { $("out").select(); $("said").textContent = "Select the text and copy it."; }
  });
  var reset = $("reset");
  reset.addEventListener("click", function () {
    if (reset.getAttribute("data-armed") !== "true") { reset.setAttribute("data-armed", "true"); reset.textContent = D.resetArm; return; }
    reset.setAttribute("data-armed", "false"); reset.textContent = D.resetIdle;
    S.open = []; S.pick = null; save(); draw();
  });
  reset.textContent = D.resetIdle;
  $("closeall").addEventListener("click", function () { S.open = []; save(); draw(); });
  $("replay").addEventListener("click", replay);
  hover($("replay"), { control: D.ui.replay, name: "Replay" });
  hover($("copy"), { control: D.ui.copy, name: "Copy my pick" });
  hover(reset, { control: D.ui.reset, name: D.resetIdle });

  /* ── cog: animations start finished (his standing rule) ────────────── */
  (function () {
    var host = $("af-anim"); if (!host) return;
    var OPTS = [{ id: "finished", label: "Start finished", note: "default" }, { id: "open", label: "Play on open", note: "runs it" }];
    function apply(id, first) {
      ANIM = id; try { window.localStorage.setItem(AKEY, id); } catch (e) {}
      host.querySelectorAll(".af-opt").forEach(function (o) { o.setAttribute("aria-checked", String(o.getAttribute("data-id") === id)); });
      if (!first && id === "open") replay();
    }
    OPTS.forEach(function (o) {
      var b = el("button", "af-opt"); b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("data-id", o.id); b.setAttribute("aria-checked", "false");
      b.appendChild(el("span", "af-name", o.label)); b.appendChild(el("span", "af-spec", o.note));
      b.addEventListener("click", function () { apply(o.id); }); host.appendChild(b);
    });
    apply(ANIM, true);
  })();

  canvas.addEventListener("scroll", drawSweep);
  window.addEventListener("resize", drawSweep);
  draw(false);
  plane.classList.add("still");
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    if (ANIM === "open" && window.MOTION && window.MOTION.on) replay(); else plane.classList.remove("still");
    drawSweep();
  }); });
  window.__bm = { data: D, state: function () { return S; }, cur: function () { return CUR; }, nodes: function () { return NODES; }, draw: draw, text: function () { return $("out").value; }, extents: function () { return window.__bmExtents; } };
})();
