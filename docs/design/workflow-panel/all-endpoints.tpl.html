  }
  function closeSide() { S.open = null; $("side").hidden = true; render(); }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.open) closeSide(); });

  /* ── words for a value: what the cell's hover and the side panel say ── */
  function cellWords(c, r) {
    var v = r.v[c.id], k = r.k[c.id];
    if (stateOf(r, c) === "unknown") return W.unknown + " — " + r.why[c.id];
    if (isAbsent(r, c)) return W.absent + " — " + fill(W.absentWhy, { why: r.why[c.id] || c.armWhy || c.arm });
    var s;
    if (c.kind === "spine") s = SPINE.map(function (st) { return st + " " + (v[st] || 0); }).join(" · ");
    else if (c.kind === "stack") s = (c.id === "fate" ? D.fates : D.pieceWords).map(function (x) { return (c.id === "fate" ? W.fates[x].name : W.pieceWords[x].name) + " " + (v[x] || 0); }).join(" · ");
    else if (c.kind === "ratio") s = v[0] + "/" + v[1] + (v[2] ? " · " + fill(c.amb, { amb: v[2] }) : "");
    else if (c.kind === "dots") s = v.length ? v.join(" · ") : "0";

    if (kind === "head") return "<b>" + esc(c.head) + "</b> · " + esc(c.name) + "<span class=pl>" + esc(W.sortHint) + "</span>";

    if (kind === "id" && r) return "<b>" + esc(r.m + " " + r.p) + "</b><span class=ln>" + esc(r.fn + " · " + r.file + ":" + r.line) + "</span><span class=ln>" + esc(r.full || "") + "</span>";
    if (kind === "cell" && r) {
      var h = "<b>" + esc(c.head) + "</b> · " + esc(c.name) + "<span class=ln>" + esc(r.m + " " + r.p) + "</span><span class=ln>" + esc(cellWords(c, r)) + "</span>";
      if (c.kind === "spine") { var sub = t.closest("[data-stage]") || null; }
      h += "<span class=pl>" + esc(c.label) + " — " + esc(c.plain) + " · " + esc(fill(W.rating, { rating: c.r, top: T.rTop })) + (c.alarm ? " · " + esc(W.alarmRating) : "") + "</span>";
      return h; }
    return null;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }
  document.addEventListener("mouseover", function (e) {
    var t = e.target.closest("[data-tip]"); if (!t) { tip.setAttribute("data-show", "false"); return; }
    if (t.getAttribute("data-tip") === "cell" && e.target.closest(".spine i")) { var si = e.target.closest(".spine i"), c = COL[t.getAttribute("data-col")];
      tip.innerHTML = "<b>" + esc(si.getAttribute("data-stage")) + "</b> · " + esc(fill(W.stageCell, { stage: si.getAttribute("data-stage"), n: si.getAttribute("data-n") })) + "<span class=pl>" + esc(W.stages[si.getAttribute("data-stage")] || "") + "</span>"; }
    else if (t.getAttribute("data-tip") === "cell" && e.target.closest(".dots i")) { tip.innerHTML = "<b>" + esc(e.target.closest(".dots i").getAttribute("data-f")) + "</b><span class=pl>" + esc(W.families) + "</span>"; }
    else { var h = tipFor(t); if (!h) { tip.setAttribute("data-show", "false"); return; } tip.innerHTML = h; }
    var bx = t.getBoundingClientRect(), tw = tip.offsetWidth, thh = tip.offsetHeight;
    var x = Math.min(window.innerWidth - tw - 8, Math.max(8, bx.left)), y = bx.bottom + 6; if (y + thh > window.innerHeight - 4) y = Math.max(4, bx.top - thh - 6);
    tip.style.left = x + "px"; tip.style.top = y + "px"; tip.setAttribute("data-show", "true"); });
  window.hoverHide = function () { tip.setAttribute("data-show", "false"); };

  /* ── copy text ── */
  function copyText(s, said, word) {
    var done = function () { said.textContent = word; setTimeout(function () { said.textContent = ""; }, 1600); };
    try { navigator.clipboard.writeText(s).then(done, function () { fallback(); }); } catch (e) { fallback(); }
    function fallback() { var ta = el("textarea"); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e2) {} ta.remove(); done(); } }
  function writeOut(L, GS) {
