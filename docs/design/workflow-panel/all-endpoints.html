<title>All Endpoints</title>

<style>
  /* ── font roster (H3) — the script keeps these in sync ─────────────── */
  :root { --af-stack: ui-monospace, monospace; --af-size: 15px; --af-track: -0.025em; }

  /* ── title face (H3) — ONLY the section title pills pin a face: a modern
        condensed grotesque, set in caps. DIN lineage, so it reads as console
        lettering rather than book type, and it holds a long title in a pill
        without wrapping. Locally resolvable in order — Bahnschrift ships with
        Windows 10+, DIN Alternate with macOS — so nothing routes through a
        blocked webfont. Every OTHER title on the page stays in the body face:
        one distinctive treatment, or the distinction is worthless. */
  :root {
    --af-title: "Bahnschrift", "DIN Alternate", "Roboto Condensed",
                "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  }

  /* ── the legibility floor (H6) — the smallest text on a page is the text
        most often unreadable. Secondary content sizes off THESE steps, never
        below them: at the 15px base they compute to 13.8 / 12.8 / 12.3px.
        They are calc() off the roster base, NOT bare `em`, because `em`
        stacks: a .855em head inside a .92em table lands at 11.8px while both
        authored values look safe. An absolute step cannot compound. */
  :root {
    --fs-sm:  calc(var(--af-size) * 0.92);
    --fs-xs:  calc(var(--af-size) * 0.855);
    --fs-min: calc(var(--af-size) * 0.82);
  }

  /* ══ skins (H5) — chrome only: ground, ink, rules, accent, geometry.
        Sources: Catalog = docs/site/center/assets/a3.css · Blueprint = skin F ·
        Mission Console = skin B (output/mockups/center-skins.css). B and F are
        spec'd light-only; their dark arms are derived so the viewer's theme
        toggle still answers. Chart series and status colours are NEVER themed. */

  /* ── Catalog · cool developer portal (default) ── */
  :root, :root[data-skin="catalog"] {
    --ground:#f6f7f9; --card:#ffffff; --raised:#fbfcfd;
    --ink:#141a24; --ink-soft:#3d4756; --muted:#7a8595;
    --rule:#e7e9ee; --rule-soft:#eef0f4;
    --accent:#4f46e5; --accent-soft:#eef0fe; --strong:#101726;
    --radius:10px; --rail:5px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]), :root[data-skin="catalog"]:not([data-theme="light"]) {
      --ground:#101726; --card:#1b2436; --raised:#212b40;
      --ink:#e7ebf3; --ink-soft:#c7cfdd; --muted:#79839a;
      --rule:#2c3648; --rule-soft:#232d3f;
      --accent:#8b83f5; --accent-soft:#23214a; --strong:#c7cfdd;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"], :root[data-skin="catalog"][data-theme="dark"] {
    --ground:#101726; --card:#1b2436; --raised:#212b40;
    --ink:#e7ebf3; --ink-soft:#c7cfdd; --muted:#79839a;
    --rule:#2c3648; --rule-soft:#232d3f;
    --accent:#8b83f5; --accent-soft:#23214a; --strong:#c7cfdd;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.9);
  }
  :root[data-skin="catalog"][data-theme="light"] {
    --ground:#f6f7f9; --card:#ffffff; --raised:#fbfcfd;
    --ink:#141a24; --ink-soft:#3d4756; --muted:#7a8595;
    --rule:#e7e9ee; --rule-soft:#eef0f4; --accent:#4f46e5; --accent-soft:#eef0fe;
    --strong:#101726;
  }

  /* ── Blueprint · skin F, blue ink ── */
  :root[data-skin="blueprint"] {
    --ground:#f6f8fc; --card:#fdfeff; --raised:#f1f5fd;
    --ink:#16233b; --ink-soft:#41547a; --muted:#8494b5;
    --rule:#c3d0f0; --rule-soft:#dde5f8;
    --accent:#1d4ed8; --accent-soft:#e4ecfe; --strong:#16233b;
    --radius:6px; --rail:5px; --shadow:none;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="blueprint"]:not([data-theme="light"]) {
      --ground:#0b1220; --card:#101a2e; --raised:#142138;
      --ink:#dce6fa; --ink-soft:#a8bce4; --muted:#7286b0;
      --rule:#23375f; --rule-soft:#1a2942;
      --accent:#6f9bff; --accent-soft:#16264a; --strong:#a8bce4; --shadow:none;
    }
  }
  :root[data-skin="blueprint"][data-theme="dark"] {
    --ground:#0b1220; --card:#101a2e; --raised:#142138;
    --ink:#dce6fa; --ink-soft:#a8bce4; --muted:#7286b0;
    --rule:#23375f; --rule-soft:#1a2942;
    --accent:#6f9bff; --accent-soft:#16264a; --strong:#a8bce4; --shadow:none;
  }
  :root[data-skin="blueprint"][data-theme="light"] {
    --ground:#f6f8fc; --card:#fdfeff; --raised:#f1f5fd;
    --ink:#16233b; --ink-soft:#41547a; --muted:#8494b5;
    --rule:#c3d0f0; --rule-soft:#dde5f8; --accent:#1d4ed8; --accent-soft:#e4ecfe;
    --strong:#16233b;
  }

  /* ── Mission Console · skin B, teal ops console ── */
  :root[data-skin="mission"] {
    --ground:#eef1f4; --card:#ffffff; --raised:#f6f8fa;
    --ink:#1a2b36; --ink-soft:#4a6272; --muted:#7d92a0;
    --rule:#c8d4dc; --rule-soft:#e2e9ee;
    --accent:#0e7c8c; --accent-soft:#e0f1f4; --strong:#1a2b36;
    --radius:4px; --rail:5px; --shadow:none;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="mission"]:not([data-theme="light"]) {
      --ground:#0e161c; --card:#16222b; --raised:#1b2934;
      --ink:#e3edf3; --ink-soft:#b3c6d2; --muted:#7d92a0;
      --rule:#27394a; --rule-soft:#1e2c39;
      --accent:#2ba7bb; --accent-soft:#0f3038; --strong:#b3c6d2; --shadow:none;
    }
  }
  :root[data-skin="mission"][data-theme="dark"] {
    --ground:#0e161c; --card:#16222b; --raised:#1b2934;
    --ink:#e3edf3; --ink-soft:#b3c6d2; --muted:#7d92a0;
    --rule:#27394a; --rule-soft:#1e2c39;
    --accent:#2ba7bb; --accent-soft:#0f3038; --strong:#b3c6d2; --shadow:none;
  }
  :root[data-skin="mission"][data-theme="light"] {
    --ground:#eef1f4; --card:#ffffff; --raised:#f6f8fa;
    --ink:#1a2b36; --ink-soft:#4a6272; --muted:#7d92a0;
    --rule:#c8d4dc; --rule-soft:#e2e9ee; --accent:#0e7c8c; --accent-soft:#e0f1f4;
    --strong:#1a2b36;
  }

  /* ══ section blocks — page furniture, deliberately OUTSIDE the series and
        status palettes so a section header can never be mistaken for data. */
  :root {
    --sec1:#2b3a55; --sec2:#2f4858; --sec3:#1f5453; --sec4:#2e5339;
    --sec5:#5a4a2b; --sec6:#5c3340; --sec7:#4a3560; --sec8:#33415c;
    --sec9:#6b3f2e;
    --sec-ink:#f7f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sec1:#9fb4d6; --sec2:#a3bfcd; --sec3:#8fc9c4; --sec4:#a8cfa6;
      --sec5:#d8c48d; --sec6:#d9a3b0; --sec7:#bda8dd; --sec8:#a6b6d9;
      --sec9:#e3ab8f;
      --sec-ink:#111722;
    }
  }
  :root[data-theme="dark"] {
    --sec1:#9fb4d6; --sec2:#a3bfcd; --sec3:#8fc9c4; --sec4:#a8cfa6;
    --sec5:#d8c48d; --sec6:#d9a3b0; --sec7:#bda8dd; --sec8:#a6b6d9;
    --sec9:#e3ab8f;
    --sec-ink:#111722;
  }
  :root[data-theme="light"] {
    --sec1:#2b3a55; --sec2:#2f4858; --sec3:#1f5453; --sec4:#2e5339;
    --sec5:#5a4a2b; --sec6:#5c3340; --sec7:#4a3560; --sec8:#33415c;
    --sec9:#6b3f2e;
    --sec-ink:#f7f8fa;
  }

  /* ── chart series + status — never themed, validated (dataviz skill) ── */
  :root {
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }
  }
  :root[data-theme="dark"] { --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }

  /* ══ the page: content anchored LEFT, never centred (H1) ═══════════ */
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--af-stack); font-size: var(--af-size); letter-spacing: var(--af-track);
    line-height: 1.55; text-align: left; -webkit-font-smoothing: antialiased;
  }
  /* ── scrollbars wear the skin ────────────────────────────────────────
     A native scrollbar is the one piece of chrome the page does not own by
     default, and it shows: a grey OS bar with stepper arrows sitting inside a
     dark panel reads as a rendering fault, not as a control. Both engines are
     addressed (Firefox takes the two `scrollbar-*` properties, WebKit/Blink the
     pseudo-elements), the thumb is mixed from the skin's own accent so it moves
     with the theme, and the stepper arrows are removed — a scroll bar is a
     position indicator, not a set of buttons anyone clicks. */
  :root {
    --sb-thumb: color-mix(in srgb, var(--accent) 42%, var(--rule));
    scrollbar-width: thin;
    scrollbar-color: var(--sb-thumb) var(--rule-soft);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--rule-soft); border-radius: 999px; }
  ::-webkit-scrollbar-thumb {
    background: var(--sb-thumb); border-radius: 999px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: padding-box; }
  ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  ::-webkit-scrollbar-corner { background: transparent; }

  .artifact-page {
    max-width: 74rem;
    margin: 0 auto 0 clamp(16px, 4vw, 56px);   /* left-anchored, never `margin: 0 auto` */
    padding: 32px 24px 48px;
    display: flex; flex-direction: column; gap: 30px;
    text-align: left;
  }
  .artifact-page > :first-child { padding-right: 56px; }   /* clear of the fixed cog */
  :is(a, button, select, input, textarea, summary):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  p { margin: 0; }

  /* ══ the two devices (H5) — every skin, every section ══════════════ */
  .sec { display: flex; flex-direction: column; gap: 14px; }
  .sec-head { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
  .sec-head .n { margin-left: auto; font-size: var(--fs-min); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  /* Title = normal-size text in a PILL that hugs it, led by an icon.
     Prominence is the background and the icon, never the type: no uppercase,
     no tracking, no size bump. The pill's padding stays tight — a wide slab
     reads as a banner and competes with the content it introduces. */
  .sec-head h2 {
    margin: 0; background: var(--sec, var(--strong)); color: var(--sec-ink, var(--ground));
    padding: 2px 11px 2px 9px; border-radius: 999px;
    font-family: var(--af-title);
    font-size: 1em; font-weight: 600; letter-spacing: .045em; text-transform: uppercase;
    line-height: 1.34;
    display: inline-flex; align-items: center; gap: 7px;
  }
  /* Every title carries an icon (H6). Lucide geometry, inlined — the CSP
     blocks icon CDNs, and an icon font would fall back silently. */
  .sec-head h2 svg {
    width: 1.02em; height: 1.02em; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .sec[data-sec="1"] { --sec: var(--sec1); } .sec[data-sec="2"] { --sec: var(--sec2); }
  .sec[data-sec="3"] { --sec: var(--sec3); } .sec[data-sec="4"] { --sec: var(--sec4); }
  .sec[data-sec="5"] { --sec: var(--sec5); } .sec[data-sec="6"] { --sec: var(--sec6); }
  .sec[data-sec="7"] { --sec: var(--sec7); } .sec[data-sec="8"] { --sec: var(--sec8); }
  .sec[data-sec="9"] { --sec: var(--sec9); }

  .panel {
    background: var(--card); border: 1px solid var(--rule);
    border-radius: var(--radius, 10px); padding: 15px;
    display: flex; flex-direction: column; gap: 12px;
  }
  /* :root prefix so the rail beats the `border:` shorthand above at equal
     specificity — without it the rail silently renders at 1px. */
  :root .panel { border-left: var(--rail) solid var(--accent); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; }

  /* ══ cog + options panel (H2 — the only floating affordance) ═══════ */
  .af-chrome { position: fixed; top: 14px; right: 14px; z-index: 200; }
  .af-cog {
    display: grid; place-items: center; width: 38px; height: 38px;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
    cursor: pointer; transition: color .15s ease, border-color .15s ease, transform .25s ease;
  }
  .af-cog:hover { color: var(--accent); border-color: var(--accent); }
  .af-cog[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); transform: rotate(45deg); }
  .af-cog svg { width: 18px; height: 18px; display: block; }
  .af-panel {
    position: absolute; top: 46px; right: 0; width: 262px;
    background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow); padding: 14px;
    display: none; flex-direction: column; gap: 11px; max-height: 82vh; overflow-y: auto;
  }
  .af-panel[data-open="true"] { display: flex; }
  .af-group { display: flex; flex-direction: column; gap: 7px; }
  .af-legend { font-size: .72em; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .af-opt {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; cursor: pointer; font-family: inherit;
    background: var(--raised); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 8px; padding: 8px 11px;
  }
  .af-opt:hover { border-color: var(--accent); }
  .af-opt[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .af-opt .af-name { font-size: 14px; line-height: 1.2; }
  .af-opt .af-spec { font-size: 12px; color: var(--muted); letter-spacing: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .af-opt[aria-checked="true"] .af-spec { color: var(--accent); }
  .af-foot { font-size: 12px; color: var(--muted); margin: 0; letter-spacing: 0; }
  .af-divider { height: 1px; background: var(--rule-soft); }

  /* motion primitives — global pause is wired to this attribute */
  :root[data-motion="off"] *, :root[data-motion="off"] *::before { animation-play-state: paused !important; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<style>
  /* ══ the page's own rules — the kit block above is pasted verbatim by gen-all-endpoints.py ══ */
  /* centred (his rule, 2026-09-17) and WIDE: the subject is a table of every endpoint, and every column saved is a row seen */
  .artifact-page { margin: 0 auto; max-width: min(2400px, 97vw); }

  :root { --alert:#a3470a; --alert-soft:#fbeadb;
          --k-success:#2f855a; --k-refusal:#b7791f; --k-framework:#64748b; --k-validation:#7c3aed; --k-uncaught:#c53030;
          --f-saved:#2f855a; --f-maybe:#d69e2e; --f-rolled:#718096; --f-unsaved:#c05621; --f-after:#2b6cb0; --f-none:var(--rule);
          --p-norm:#cbd5e1; --p-common:#94a3b8; --p-rare:var(--accent); --p-only:var(--alert);
          --m-GET:#2b6cb0; --m-POST:#2f855a; --m-PUT:#b7791f; --m-PATCH:#805ad5; --m-DELETE:#c53030;
          --bz:color-mix(in srgb, var(--accent) 5%, var(--card)); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --alert:#f0a35a; --alert-soft:#3b2914;
          --k-success:#5fc28e; --k-refusal:#e5b454; --k-framework:#94a3b8; --k-validation:#a78bfa; --k-uncaught:#f47272;
          --f-saved:#5fc28e; --f-maybe:#f2c94c; --f-rolled:#94a3b8; --f-unsaved:#f0955a; --f-after:#6fa8e8; --p-norm:#3b4658; --p-common:#64748b;
          --m-GET:#6fa8e8; --m-POST:#5fc28e; --m-PUT:#e5b454; --m-PATCH:#b69cf0; --m-DELETE:#f47272; } }
  :root[data-theme="dark"] { --alert:#f0a35a; --alert-soft:#3b2914;
          --k-success:#5fc28e; --k-refusal:#e5b454; --k-framework:#94a3b8; --k-validation:#a78bfa; --k-uncaught:#f47272;
          --f-saved:#5fc28e; --f-maybe:#f2c94c; --f-rolled:#94a3b8; --f-unsaved:#f0955a; --f-after:#6fa8e8; --p-norm:#3b4658; --p-common:#64748b;
          --m-GET:#6fa8e8; --m-POST:#5fc28e; --m-PUT:#e5b454; --m-PATCH:#b69cf0; --m-DELETE:#f47272; }
  body { background: var(--ground); }

  .eyebrow { font-size: var(--fs-min); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { font-size: 2em; line-height: 1.15; margin: 8px 0 0; text-wrap: balance; }
  .lede { color: var(--ink-soft); max-width: 92ch; margin: 12px 0 0; }
  .prop { font-size: var(--fs-sm); color: var(--alert); background: var(--alert-soft); border: 1px solid var(--alert); border-radius: 8px;
          padding: 6px 12px; margin: 12px 0 0; max-width: 92ch; }
  .stamp { font-size: var(--fs-xs); color: var(--muted); margin: 10px 0 0; font-variant-numeric: tabular-nums; }
  .keys { font-size: var(--fs-xs); color: var(--muted); margin: 6px 0 0; max-width: 92ch; }
  .cap { font-size: var(--fs-sm); color: var(--ink-soft); margin: 0; max-width: 92ch; }
  .btn { font: inherit; font-size: var(--fs-sm); letter-spacing: inherit; cursor: pointer; border-radius: 8px; padding: 6px 12px; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.quiet { background: transparent; color: var(--ink-soft); font-size: var(--fs-xs); padding: 4px 10px; }
  .said { font-size: var(--fs-xs); color: var(--accent); }

  /* ── the rail ── */
  .rail { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-start; margin: 0 0 10px; }
  .rgrp { display: flex; flex-direction: column; gap: 5px; }
  .rgrp[hidden] { display: none; }
  .rgrp > .rl { font-size: var(--fs-min); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .opt { font: inherit; font-size: var(--fs-xs); letter-spacing: inherit; cursor: pointer; border-radius: 8px; padding: 4px 10px;
         border: 1px solid var(--rule); background: var(--raised); color: var(--ink-soft); display: flex; align-items: baseline; gap: 6px; }
  .opt:hover { border-color: var(--accent); color: var(--accent); }
  .opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent); color: var(--ground); }
  .opt .pk { font-size: var(--fs-min); border-bottom: 1px dashed currentColor; opacity: .85; }
  .status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: var(--fs-xs); color: var(--ink-soft); margin: 0 0 8px; }
  .litchip { display: inline-flex; gap: 8px; align-items: center; color: var(--alert); border: 1px solid var(--alert); background: var(--alert-soft); border-radius: 8px; padding: 2px 8px; }
  .litchip[hidden] { display: none; }
  .litchip button, .status button { font: inherit; font-size: var(--fs-min); cursor: pointer; background: none; border: 0; color: inherit; text-decoration: underline; padding: 0; }

  /* ── the board: one scroll surface, header and identity column stick ── */
  .board { position: relative; overflow: auto; max-height: calc(100vh - 24px); border: 1px solid var(--rule); border-radius: var(--radius, 10px); background: var(--card); }
  .board.cardsmode { max-height: none; overflow: visible; border: 0; background: transparent; }
  table.grid { border-collapse: separate; border-spacing: 0; font-size: var(--fs-min); font-variant-numeric: tabular-nums; }
  table.grid th, table.grid td { padding: 0 1px; height: 21px; white-space: nowrap; border-bottom: 1px solid var(--rule-soft); text-align: center; vertical-align: middle; line-height: 1.2; }
  table.grid thead th { position: sticky; background: var(--card); z-index: 3; }
  table.grid thead tr.bh th { top: var(--pagetop, 0px); height: auto; padding: 3px 4px 3px 6px; font-weight: 650; color: var(--ink-soft); border-bottom: 2px solid var(--rule); text-align: left; white-space: normal; line-height: 1.15; vertical-align: bottom; max-width: 1px; }
  table.grid thead tr.ch th { top: calc(var(--pagetop, 0px) + var(--bh, 24px)); height: auto; padding: 4px 3px 5px; vertical-align: bottom; cursor: pointer; border-bottom: 2px solid var(--rule); }
  table.grid thead tr.ch th:hover .hd { color: var(--accent); }

s on its paths","zero":"no catch on any path"},"rate":{"head":"rate","name":"the rate limiters it sits behind","zero":"no limiter was read"},"written":{"head":"writes","name":"tables its own code writes; a table only the login check writes is left out","zero":"its own code writes no table"},"fate":{"head":"fate","name":"its paths, by what becomes of the endpoint's own writes; the number is the paths that save","zero":"no path saves a write of its own before the answer"},"deciders":{"head":"deciders","name":"functions whose refusal or raise becomes one of its endings","zero":"no function's refusal becomes an ending here"},"datafns":{"head":"data fns","name":"functions that read or write the database on its own paths","zero":"none of its own functions touches the database"},"request":{"head":"fields","name":"fields at the top of the JSON body it reads","zero":"it reads no body","unknown":"It reads a JSON body, and how many fields that body has is unknown. This is not a zero."},"fetched":{"head":"screen","name":"frontend hooks that call it","zero":"no screen of the app calls it"},"reasons":{"head":"reads","name":"places in the frontend that read its status, detail or code","zero":"no screen reads why it refused"},"chain":{"head":"steps","name":"steps on its longest path","zero":"no path has steps"},"cases422":{"head":"rules","name":"rules on its input, body, query, path or headers, that make it fail with a 422","zero":"no input rule can fail"},"inf_answer":{"head":"request","name":"values alive only while the request runs, gone with the answer","zero":"nothing lives only for the request"},"inf_server":{"head":"server","name":"values the server process keeps between requests","zero":"nothing is kept by the process"},"proof":{"head":"proven","name":"endings a test proves on its own, of all its endings; a test whose status fits several endings proves none of them","zero":"no test proves any of its endings on its own","amb":"{amb} more endings only by a test whose status fits several"},"alarms":{"head":"alarms","name":"anomalies the form check found","zero":"the form check found nothing"},"behind":{"head":"behind","name":"functions reachable behind its handler","zero":"the map reaches no function behind it"},"switches":{"head":"switches","name":"settings or swapped-in parts that change what it does","zero":"no switch changes it"},"pieces":{"head":"pieces","name":"its pieces by how common each is in the app; the number is the rare ones plus the ones only it has","zero":"every piece it has is common or the norm"},"lacks":{"head":"lacks","name":"pieces nearly every endpoint carries that it does not","zero":"it carries every piece that is the norm"}},"families":"the form check's findings, one place each, most frequent first","panel":{"close":"close","closePlain":"Close this panel.","handler":"handler","entity":"entity","segment":"first URL segment","declared":"declared success","exits":"the endings","exitCols":["kind","stage","status","what it says","tests"],"tables":"the tables","fates":"each path's fate","guards":"its own checks","gates":"login check","limits":"rate limiters","limitWords":"{v} per window","request":"request body","response":"reply body","cases":"422 rules by type","deciders":"deciding functions","switches":"switches","behind":"functions behind, and how deep","proof":"the lab's proof rank","proofWords":"{n} of its refusals named by a test, a test that fits several counted for each · rank {v} of {of}","inflight":"in flight","hook":"the hook that calls it","screens":"screens above that hook","reasons":"reason sites","alarms":"alarms","pieces":"its rare pieces","lacks":"norms it lacks","none":"none","more":"and {more} more","lab":"open it in the lab","labPlain":"The lab is baked to one endpoint today. These commands bake it to this endpoint; they rewrite the lab's own facts file, so run them only when you mean to move the lab here.","cmd":"cd docs/design/workflow-panel\npython3 gen-endpoint-facts.py \"{ep}\" --forms {formsPath} --archmap {archmapPath}\n# then open endpoint-lab.html","copy":"copy the commands","copied":"copied","gateWrites":"the login check writes"},"more":{"show":"Show how the map knows this","hide":"Hide it again","lines":["Every row comes from the lab's own reader: gen-endpoint-facts.py ran once per endpoint, into a temporary file, never over the lab's facts. This page keeps a small record of each and counts what the facts already say.","The feed is the forms file of {app} at head {head}, sha {formsSha}, with its map beside it, sha {archmapSha}. Arms on: {arms}. Arms off: {armsOff}.","A cell that reads absent means the feed did not look. A cell that reads unknown means it looked, and the value is not known. A zero means it looked and found nothing, and its hover says why.","The stage an ending leaves from follows the robot's lay: the app band's endings at the edge, the login check's at the gate, the body's at the input, the endpoint's own refusals in the handler, every success at the answer, and the uncaught in the bay.","The writes column and a path's fate read the endpoint's own writes only. The login check can create a user row on almost every endpoint; counting it would paint both columns the same, so the side panel names those writes apart, as the login check's."],"colsHead":["column","block","attribute","rating","arm"],"armMap":"the map itself"},"copy":{"intro":"What you are looking at, as text, to paste back with your words under it.","button":"Copy","copied":"copied","lines":{"page":"page","layout":"layout","group":"grouped by","sort":"sorted","lit":"lit","open":"open","cols":"columns","your":"your words:"}},"authNoScheme":"own check","authNoSchemePlain":"It asks for a login through its own check, with no declared scheme: the check reads the token itself, not from the usual header."}};</script>
<script>
(function () {

  var $ = function (id) { return document.getElementById(id); };
  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
  function nEp(n) { return fill(n === 1 ? W.group.countOne : W.group.count, { n: n }); }
  function fill(s, x) { return String(s).replace(/\{([a-zA-Z]\w*)\}/g, function (m, k) { return x && x[k] != null ? x[k] : (T[k] != null ? T[k] : m); }); }

  /* ── state: every rail defaults to the words file's pick, and is remembered per viewer ── */

    if (o.sort && D.cols.some(function (c) { return c.id === o.sort.col; })) S.sort = { col: o.sort.col, dir: o.sort.dir === -1 ? -1 : 1 }; } } catch (e) {}
  function save() { try { var o = {}; RAILS.forEach(function (r) { o[r] = S[r]; }); o.sort = S.sort; window.localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }

  var COL = {}; D.cols.forEach(function (c) { COL[c.id] = c; });
  var BLK = {}; D.blocks.forEach(function (b) { BLK[b.key] = b; });
  var ROWS = D.rows, N = ROWS.length;
  var METHODS = ["GET", "POST", "PUT", "PATCH", "DELETE"];
  function baseOrder(a, b) { return a.p < b.p ? -1 : a.p > b.p ? 1 : METHODS.indexOf(a.m) - METHODS.indexOf(b.m); }
  var MAX = {}; D.cols.forEach(function (c) { var m = 0; ROWS.forEach(function (r) { var k = r.k[c.id]; if (typeof k === "number" && k > m) m = k; }); MAX[c.id] = m; });
  var SPINE = D.orders.stageRows.filter(function (s) { return D.orders.kinds[s] !== "screen"; });

  /* ── which columns, under which block, in which order ── */
  function layout() {

    groups.forEach(function (g) {

    });

  /* ── the bins of a column: what its header strip counts ── */
  /* a cell that holds no number: "absent" (the feed did not look) or "unknown" (it looked, the value is not known) — never a 0 */
  function stateOf(r, c) { var v = r.v[c.id]; return v === "absent" || v === "unknown" ? v : null; }
  function binsOf(c) {
    var vals = ROWS.map(function (r) { return r.k[c.id]; }), bins = [];
    var absent = ROWS.filter(function (r) { return stateOf(r, c) === "absent"; }).length, unk = ROWS.filter(function (r) { return stateOf(r, c) === "unknown"; }).length;
    if (c.kind === "cat") {

      Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a] || (a < b ? -1 : 1); }).forEach(function (k, i) {

      if (c.kind === "ratio") {

      } else if (distinct.length <= 7) {

  }
  var BINS = {}; D.cols.forEach(function (c) { BINS[c.id] = binsOf(c); });
  var NORM = {}; D.cols.forEach(function (c) { if (c.kind === "cat" && BINS[c.id].length) NORM[c.id] = BINS[c.id][0].key.slice(2); });   /* the most common category */

  /* ── the rows' groups ── */
  function stageRank(s) { return D.orders.stageRows.indexOf(s); }
  function groupKey(r) {

    if (S.grp === "labels") { var by = {}; r.labels.forEach(function (l) { var q = l.split(":"); (by[q[0]] = by[q[0]] || []).push(q[1]); });   /* one stage, its statuses */
      return Object.keys(by).sort(function (a, b) { return stageRank(a) - stageRank(b); }).map(function (st) { return st + " " + by[st].sort().join(" "); }).join(" · "); }
    if (S.grp === "counts") return D.kinds5.map(function (k) { return COL["e_" + k].head + " " + r.v["e_" + k]; }).join(" · ");
    return "";
  }
  function sortRows(rs) {

        var nx = x === null || x === undefined, ny = y === null || y === undefined;
        if (nx !== ny) return nx ? 1 : -1;

  }

    var gs = order.map(function (k) { return { key: k, name: k, rows: m[k] }; });

    gs.sort(S.gord === "size" ? function (a, b) { return b.rows.length - a.rows.length || (a.name < b.name ? -1 : 1); } : function (a, b) { return a.name < b.name ? -1 : 1; });
    if (alone.length) gs.push({ key: "_alone", name: W.group.alone, rows: [].concat.apply([], alone.map(function (g) { return g.rows; })), alone: true });

  }

  /* ── one cell ── */
  function isAbsent(r, c) { return stateOf(r, c) !== null; }
  function cell(c, r) {

    w.setAttribute("data-col", c.id); w.setAttribute("data-v", st || String(k)); w.setAttribute("data-tip", "cell");
    if (st) { w.className = "ab" + (st === "unknown" ? " unk" : ""); w.textContent = st === "unknown" ? W.unknown : W.absent; return w; }
    if (c.kind === "slot") { var kd = c.id.slice(2); w.className = "slot" + (v ? "" : " e0"); w.textContent = String(v);
      if (v) w.style.background = "var(--k-" + kd + ")"; return w; }
    if (c.kind === "num") { w.className = "num" + (v ? "" : " z"); w.textContent = String(v);
      if (v && MAX[c.id] && S.heat === "heat") w.style.background = "color-mix(in srgb, var(--accent) " + Math.round(8 + 42 * v / MAX[c.id]) + "%, transparent)"; return w; }
    if (c.kind === "spine") { w.className = "spine"; var mx = 0; SPINE.forEach(function (s) { mx = Math.max(mx, v[s] || 0); });
      SPINE.forEach(function (s) { var i = el("i"); var n = v[s] || 0; if (D.orders.kinds[s] === "bay") i.className = "bay";
        if (n) { i.style.background = "color-mix(in srgb, var(--accent) " + Math.round(35 + 65 * n / Math.max(mx, 1)) + "%, var(--card))"; i.style.borderColor = "transparent"; }
        i.setAttribute("data-stage", s); i.setAttribute("data-n", String(n)); w.appendChild(i); }); return w; }
    if (c.kind === "stack") { w.className = "stack"; var sb = el("span", "sb"), keys = c.id === "fate" ? D.fates : D.pieceWords, tot = 0;
      keys.forEach(function (x) { tot += v[x] || 0; });
      keys.forEach(function (x) { if (!v[x]) return; var i = el("i"); i.style.width = (100 * v[x] / tot) + "%"; i.setAttribute("data-s", x); i.setAttribute("data-n", String(v[x]));
        i.style.background = c.id === "fate" ? "var(--f-" + x + ")" : "var(--p-" + ({ "the norm": "norm", "common": "common", "rare": "rare", "only here": "only" })[x] + ")"; sb.appendChild(i); });
      w.appendChild(sb); w.appendChild(el("span", "n" + (k ? "" : " z"), String(k))); return w; }
    if (c.kind === "ratio") { w.className = "ratio" + (v[0] ? "" : " z"); w.appendChild(el("span", null, v[0] + "/" + v[1]));
      var rb = el("span", "bar"), ri = el("i"); ri.style.width = (v[1] ? Math.round(100 * v[0] / v[1]) : 0) + "%"; rb.appendChild(ri); w.appendChild(rb); return w; }
    if (c.kind === "dots") { w.className = "dots"; D.families.forEach(function (f) { var i = el("i", v.indexOf(f) >= 0 ? "on" : ""); i.setAttribute("data-f", f); w.appendChild(i); }); return w; }
    if (c.kind === "cat") { var q = S.norm === "quiet" && NORM[c.id] === v; w.className = "cat" + (q ? " norm" : ""); w.textContent = q ? "·" : String(v).replace(/\+/g, " · "); return w; }
    w.textContent = String(v); return w;
  }
  /* a group row: an ending belongs to one endpoint, so endings ADD UP; a table, a function, a process value is one thing
     several endpoints share, so it is counted ONCE across the group (the generator carries each row's things by identity) */
  function aggOf(c, rs) {
    if (!c.agg) return "";
    var live = rs.filter(function (r) { return !isAbsent(r, c); }); if (!live.length) return "";
    if (c.agg === "ratio") { var a = 0, b = 0; live.forEach(function (r) { a += r.v[c.id][0]; b += r.v[c.id][1]; }); return a + "/" + b; }
    if (c.agg === "count") return String(live.filter(function (r) { var v = r.v[c.id]; return v && v !== "none"; }).length);
    if (c.agg === "union") { var seen = {}, n = 0; live.forEach(function (r) { (r.u[c.id] || []).forEach(function (x) { if (!seen[x]) { seen[x] = 1; n++; } }); }); return String(n); }
    var s = 0; live.forEach(function (r) { s += r.k[c.id] || 0; }); return String(s);
  }

  /* ── the header: block band, column heads with rating pips and the distribution strip ── */
  function headRows(L) {
    var thead = el("thead"), bh = el("tr", "bh"), ch = el("tr", "ch");
    var i0 = el("th", "idh"); i0.setAttribute("rowspan", "1"); bh.appendChild(i0);
    var i1 = el("th", "idh"); i1.appendChild(el("span", "hd", W.sortReset)); i1.setAttribute("data-tip", "sortreset"); i1.addEventListener("click", function () { S.sort = null; save(); render(); }); ch.appendChild(i1);
    L.forEach(function (g, gi) {
      var th = el("th", "bstart" + (gi % 2 ? " bz" : ""), g.name); th.colSpan = g.cols.length; th.setAttribute("data-tip", "block"); th.setAttribute("data-block", g.key); bh.appendChild(th);
      g.cols.forEach(function (c, ci) {
        var h = el("th", (ci === 0 ? "bstart" : "") + (gi % 2 ? " bz" : "")); h.setAttribute("data-col", c.id); h.setAttribute("data-tip", "head");
        if (S.sort && S.sort.col === c.id) h.setAttribute("data-sorted", S.sort.dir > 0 ? "up" : "down");
        var hd = el("span", "hd", c.head); if (S.sort && S.sort.col === c.id) hd.appendChild(el("span", "dir", S.sort.dir > 0 ? " ↑" : " ↓")); h.appendChild(hd);
        var pp = el("span", "pips"); for (var q = 1; q <= T.rTop; q++) pp.appendChild(el("i", q <= c.r ? "on" : "")); if (c.alarm) pp.appendChild(el("i", "al")); h.appendChild(pp);
        var st = el("span", "strip"); st.style.width = Math.max(24, c.kind === "spine" ? 50 : c.kind === "stack" ? 48 : c.kind === "dots" ? D.families.length * 7 : 26) + "px";
        BINS[c.id].forEach(function (b) { var s = el("span", "sg"); s.style.flex = b.n + " 0 0"; s.style.background = b.col;
          s.setAttribute("data-bin", b.key); s.setAttribute("data-n", String(b.n)); s.setAttribute("data-tip", "bin"); s.setAttribute("data-col", c.id);
          if (S.lit && S.lit.col === c.id && S.lit.bin === b.key) s.setAttribute("data-lit", "true"); st.appendChild(s); });
        h.appendChild(st);

          var sg = ev.target.closest(".sg");
          if (sg) { ev.stopPropagation(); var bk = sg.getAttribute("data-bin"); S.lit = S.lit && S.lit.col === c.id && S.lit.bin === bk ? null : { col: c.id, bin: bk }; render(); return; }
          S.sort = S.sort && S.sort.col === c.id ? { col: c.id, dir: -S.sort.dir } : { col: c.id, dir: 1 }; save(); render(); });
        ch.appendChild(h); });
    });

  function litTest() { if (!S.lit) return null; var c = COL[S.lit.col], b = BINS[S.lit.col].filter(function (x) { return x.key === S.lit.bin; })[0];

  function writeOut(L, GS) {

  $("more-btn").addEventListener("click", function () { var b = $("more-body"), open = b.hidden; b.hidden = !open; this.setAttribute("aria-expanded", open ? "true" : "false"); this.textContent = open ? W.more.hide : W.more.show; });
